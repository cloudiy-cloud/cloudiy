name: Contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"

env:
  CARGO_TERM_COLOR: always
  SOLANA_VERSION: "2.1.0"
  ANCHOR_VERSION: "0.32.1"

jobs:
  anchor:
    name: Build & test Anchor escrow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag v${ANCHOR_VERSION} anchor-cli --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS test deps
        run: yarn install --frozen-lockfile

      - name: Create local wallets
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json --force
          solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/new-wallet.json --force

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Anchor build
        run: anchor build

      # target/ is gitignored, so the program keypair is regenerated fresh on CI
      # (the real one is a mainnet-squat risk and never committed). Point
      # declare_id!/Anchor.toml at that throwaway id so the local run is
      # self-consistent.
      - name: Sync program id (CI throwaway)
        run: anchor keys sync

      - name: Anchor test (local validator)
        run: anchor test --provider.cluster localnet
