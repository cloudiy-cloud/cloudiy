name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

  sdk-tests:
    name: SDK tests (Python + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Cross-language signature-verification vectors (generated by the Rust
      # signer) — gates the SDKs' ed25519 result verification against regressions.
      - name: Python SDK tests
        run: python3 sdk/python/tests/test_verify.py

      - name: JS SDK tests
        run: node sdk/js/test.mjs

      - name: Go SDK tests
        run: cd sdk/go && go vet ./... && go test ./...

  e2e:
    name: E2E (P2P + container job)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build cloudiy
        run: cargo build -p cloudiy

      # ubuntu-latest ships Docker; the provider runs CPU-only (no GPU on CI)
      # and serves the container workload the e2e exercises.
      - name: End-to-end (two processes over real P2P)
        run: bash scripts/e2e.sh

      # Drive the HTTP SDKs (Python + JS) against a live node: info(), the x402
      # 402->quote flow, and signature verification. CPU-only here, so the paid
      # kernel path asserts the honest "no GPU" outcome (the x402 wire is still
      # fully exercised); a GPU node additionally verifies a signed result.
      - name: End-to-end (HTTP SDKs)
        run: bash scripts/e2e-sdk.sh

  windows-build:
    name: Windows build (native provider node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Compiles the node for x86_64-pc-windows-msvc (the runner's host target),
      # so a Windows machine can run as a provider. Cross-platform resource
      # detection (sysinfo) means it announces real CPU/RAM, not 0.
      - name: Build cloudiy (Windows)
        run: cargo build -p cloudiy

      # Confirms hardware detection works at runtime on Windows (real RAM > 0).
      - name: Discovery tests (Windows)
        run: cargo test -p cloudiy discover
