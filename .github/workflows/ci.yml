name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

  e2e:
    name: E2E (P2P + container job)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build cloudiy
        run: cargo build -p cloudiy

      # ubuntu-latest ships Docker; the provider runs CPU-only (no GPU on CI)
      # and serves the container workload the e2e exercises.
      - name: End-to-end (two processes over real P2P)
        run: bash scripts/e2e.sh

  windows-build:
    name: Windows build (native provider node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Compiles the node for x86_64-pc-windows-msvc (the runner's host target),
      # so a Windows machine can run as a provider. Cross-platform resource
      # detection (sysinfo) means it announces real CPU/RAM, not 0.
      - name: Build cloudiy (Windows)
        run: cargo build -p cloudiy

      # Confirms hardware detection works at runtime on Windows (real RAM > 0).
      - name: Discovery tests (Windows)
        run: cargo test -p cloudiy discover
