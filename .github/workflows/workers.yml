name: workers

# Builds and pushes the GPU worker images to GHCR on a worker-v* tag push.
#   git tag worker-v0.1.0 && git push origin worker-v0.1.0
on:
  push:
    tags:
      - "worker-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [sdxl, ltx]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker-${{ matrix.worker }}
        uses: docker/build-push-action@v6
        with:
          context: workers/${{ matrix.worker }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cloudiy/worker-${{ matrix.worker }}:latest
            ghcr.io/cloudiy/worker-${{ matrix.worker }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
