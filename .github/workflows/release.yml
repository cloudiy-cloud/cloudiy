name: Release

# Cuts prebuilt provider-node binaries so a non-developer never needs Rust /
# cargo to run a Cloudiy provider. Push a version tag (e.g. `v0.1.0`) to build
# and publish a GitHub Release; run manually (workflow_dispatch) to just build
# and attach the binaries as workflow artifacts (no Release created).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the Release and upload assets

env:
  CARGO_TERM_COLOR: always
  BIN: cloudiy
  # Code signing is OPTIONAL — the steps below run ONLY when these secrets are
  # set, so the unsigned build works out of the box. See SIGNING.md to enable.
  APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
  APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
  APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
  WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
  WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
  # Same opt-in shape: crates.io publishing stays skipped until this is set.
  # Mapped here (not just on the step) so step-level `if:` can read it.
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm # GitHub's native arm64 Linux runner (Raspberry Pi, ARM servers)
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Bakes the network's directory id into the binary, so `curl … | sh`
      # followed by `cloudiy share` finds the network with no flags and no env
      # (bootstrap.rs: flag → env → this compile-time default). Set the repo
      # variable CLOUDIY_DEFAULT_DIRECTORY to the directory node's id — until
      # then it is empty and the binary behaves exactly as it does today,
      # requiring --via/--directory. Empty is a warning below, never a failure.
      - name: Build (release)
        env:
          CLOUDIY_DEFAULT_DIRECTORY: ${{ vars.CLOUDIY_DEFAULT_DIRECTORY }}
        run: |
          if [ -z "${CLOUDIY_DEFAULT_DIRECTORY:-}" ]; then
            echo "::warning::CLOUDIY_DEFAULT_DIRECTORY is unset — the released binary ships WITHOUT zero-config discovery (users must pass --via <directory-id>). Set it in repo Settings → Secrets and variables → Actions → Variables."
          else
            echo "baking default directory: $CLOUDIY_DEFAULT_DIRECTORY"
          fi
          cargo build --release -p cloudiy --target ${{ matrix.target }}

      # Optional Developer ID signing — skipped unless APPLE_CERT_P12 is set.
      - name: Sign (macOS Developer ID, if configured)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" "target/${{ matrix.target }}/release/$BIN"
          codesign --verify --verbose "target/${{ matrix.target }}/release/$BIN"

      # Optional Authenticode signing — skipped unless WINDOWS_CERT_PFX is set.
      - name: Sign (Windows Authenticode, if configured)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "target/${{ matrix.target }}/release/$env:BIN.exe"

      # Asset names are UNVERSIONED (cloudiy-<target>.<ext>) so the install
      # scripts can always fetch `releases/latest/download/cloudiy-<target>...`.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NAME="${BIN}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/" 2>/dev/null || true
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Name = "$env:BIN-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$Name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" "dist/$Name/"
          Copy-Item README.md,LICENSE "dist/$Name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$Name/*" -DestinationPath "$Name.zip" -Force
          (Get-FileHash "$Name.zip" -Algorithm SHA256).Hash.ToLower() + "  $Name.zip" | Out-File -Encoding ascii "$Name.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: |
            ${{ env.BIN }}-${{ matrix.target }}.tar.gz*
            ${{ env.BIN }}-${{ matrix.target }}.zip*
          if-no-files-found: ignore

      # Attach assets to a Release on THIS (private) repo. Not publicly
      # downloadable, but it's what `scripts/publish-dist.sh` reads to mirror
      # them into the public dist repo (the no-PAT path).
      - name: Publish to private Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BIN }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN }}-${{ matrix.target }}.tar.gz.sha256
            ${{ env.BIN }}-${{ matrix.target }}.zip
            ${{ env.BIN }}-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false

      # Also publish directly to the PUBLIC distribution repo (source stays
      # private, binaries anonymously downloadable so `install.sh` works).
      # Requires a PAT with contents:write on cloudiy-dist as DIST_REPO_TOKEN.
      - name: Publish to dist Release (public)
        if: startsWith(github.ref, 'refs/tags/') && env.DIST_REPO_TOKEN != ''
        env:
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          repository: w3-surfer/cloudiy-dist
          token: ${{ secrets.DIST_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.BIN }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN }}-${{ matrix.target }}.tar.gz.sha256
            ${{ env.BIN }}-${{ matrix.target }}.zip
            ${{ env.BIN }}-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false

  # Publishes the Rust library crates to crates.io. They live here rather than
  # in `release-sdks.yml` because their version IS the workspace version — the
  # same one these binaries carry — while the Python/JS/Go thin clients are on
  # their own line and ship from `sdk-v*` tags.
  #
  # ORDER MATTERS AND IS NOT OPTIONAL. crates.io resolves the `version` on each
  # path dependency from the registry, so a crate cannot be published (or even
  # `--dry-run`ed) before its dependencies are actually up there:
  #   cloudiy-protocol -> cloudiy-common -> cloudiy-sdk
  # `cargo publish` waits for the index to catch up between crates.
  #
  # Skipped with a clear warning until CARGO_REGISTRY_TOKEN exists.
  crates-io:
    name: Publish crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: No CARGO_REGISTRY_TOKEN — skipping
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "::warning title=crates.io publish skipped::CARGO_REGISTRY_TOKEN is not set, so cloudiy-protocol / cloudiy-common / cloudiy-sdk were NOT published to crates.io. Add the secret (Settings -> Secrets and variables -> Actions) and re-run to publish. Packaging is still verified below."

      # Always provable: the leaf crate has no internal dependencies, so its
      # dry-run works without anything being on crates.io yet. The two above it
      # cannot be dry-run until their dependencies are published for real —
      # that is a cargo constraint, not a misconfiguration.
      - name: Package check (cloudiy-protocol)
        run: cargo publish --dry-run -p cloudiy-protocol

      - name: Publish (in dependency order)
        if: startsWith(github.ref, 'refs/tags/') && env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # A version already on crates.io is immutable — re-publishing it is an
          # error, not a no-op. Treat "already exists" as success so re-running a
          # release after a partial failure resumes instead of dead-ending.
          publish_one() {
            local crate="$1" out status
            echo "==> publishing $crate"
            set +e
            out="$(cargo publish -p "$crate" 2>&1)"; status=$?
            set -e
            printf '%s\n' "$out"
            if [ $status -ne 0 ]; then
              if printf '%s' "$out" | grep -q "already exists"; then
                echo "    (already on crates.io at this version — skipping)"
                return 0
              fi
              return $status
            fi
          }
          publish_one cloudiy-protocol
          publish_one cloudiy-common
          publish_one cloudiy-sdk

  # Multi-arch container image ghcr.io/<owner>/cloudiy (amd64 + arm64), the one
  # the ODS extension (integrations/ods/compose.yaml) and the directory compose
  # pull. It REUSES the Linux binaries the `build` job already produced — no
  # second Rust compile — and packages them with the docker CLI (a node launches
  # tenant workloads as sibling containers; see deploy/docker/cloudiy.Dockerfile).
  #
  # Publishing a container image is external and irreversible, so — exactly like
  # the binaries and crates above — it PUSHES ONLY ON A TAG. On workflow_dispatch
  # it builds both arches to validate the Dockerfile but pushes nothing. A
  # separate job: its failure never breaks the binary release.
  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      # Pull the two Linux release artifacts and stage the raw binaries into a
      # tiny build context named by docker's arch (amd64 / arm64).
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*-unknown-linux-gnu
          path: dl
      - name: Stage per-arch binaries
        run: |
          set -eux
          mkdir -p ctx
          for pair in "x86_64:amd64" "aarch64:arm64"; do
            rust="${pair%%:*}"; darch="${pair##*:}"
            tar -xzf "dl/${BIN}-${rust}-unknown-linux-gnu/${BIN}-${rust}-unknown-linux-gnu.tar.gz" -C /tmp
            cp "/tmp/${BIN}-${rust}-unknown-linux-gnu/${BIN}" "ctx/${BIN}-${darch}"
          done
          cp deploy/docker/cloudiy.Dockerfile ctx/Dockerfile
          ls -l ctx

      - uses: docker/setup-qemu-action@v3    # arm64 layers build under emulation
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and, on a tag, push) the multi-arch image
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/${BIN}"
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "publishing ${image}:${GITHUB_REF_NAME} and ${image}:latest (amd64 + arm64)"
            docker buildx build ctx \
              --platform linux/amd64,linux/arm64 \
              -t "${image}:${GITHUB_REF_NAME}" -t "${image}:latest" \
              --push
          else
            # Validation only: amd64 builds natively (fast, no QEMU) and proves the
            # Dockerfile + binary packaging. arm64 is exercised on the real tag.
            echo "::notice title=Image not pushed::Not a tag — building amd64 to validate the Dockerfile, pushing nothing. Publishing (and the arm64 arch) happens only when you push a v* tag."
            docker buildx build ctx --platform linux/amd64
          fi
