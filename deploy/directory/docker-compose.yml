# Cloudiy public directory / discovery node.
#
# Runs the unified `cloudiy` binary in `directory` mode as a long-running service.
# The image is published by the release pipeline on a v* tag (release.yml →
# `image` job); pin a released tag instead of `latest` if you want reproducibility.
#
#   docker compose up -d
#   docker compose logs -f directory   # copy the printed EndpointId

services:
  directory:
    image: ghcr.io/w3-surfer/cloudiy:latest
    command: ["directory"]
    restart: unless-stopped
    # No inbound ports: the directory is pure P2P (iroh/QUIC), dialed out to
    # relays and addressed by its EndpointId — nothing listens on a host TCP port.
    volumes:
      # Persist the node key so the EndpointId is stable across restarts.
      - cloudiy-node-key:/root/.config/cloudiy
    environment:
      - RUST_LOG=info

volumes:
  cloudiy-node-key:
