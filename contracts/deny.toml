# cargo-deny config for the escrow program's (separate) workspace.
# The Solana/Anchor toolchain pins a large transitive tree we don't control;
# this scopes the audit to security advisories and explicitly ignores the
# known-unfixable informational ones, so any *new* advisory fails CI.
# Run locally with: cd contracts && cargo deny check advisories

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive via the Solana/Anchor stack — unmaintained, not exploitable here:
    "RUSTSEC-2025-0141", # bincode is unmaintained
    "RUSTSEC-2025-0161", # libsecp256k1 is unmaintained
    # rand "unsound" only for a custom-logger `rand::rng()` pattern the program
    # never uses (the program has no RNG at runtime):
    "RUSTSEC-2026-0097",
]

[licenses]
version = 2
# Advisories are the focus for the on-chain program; accept the toolchain's
# permissive licenses broadly so license drift in the Solana tree isn't a gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/coral-xyz/anchor",
]
