[package]
name = "cloudify-escrow"
version = "0.1.0"
description = "Cloudify USDC escrow — locks payment until the GPU job is delivered"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "cloudify_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
