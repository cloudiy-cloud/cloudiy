[package]
name = "cloudiy-vm"
version = "0.1.0"
description = "Cloudiy VM manifest — a small, identity-keyed state account per wallet"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "cloudiy_vm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# init_if_needed lets one instruction create-or-update the manifest PDA.
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

# Anchor's macros emit cfgs (anchor-debug, custom-heap/panic) and solana-program
# uses cfg(target_os = "solana"); declare them so `unexpected_cfgs` doesn't fire
# under `clippy -D warnings` (same as the escrow program).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
] }
