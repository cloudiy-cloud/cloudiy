# cargo-deny configuration — https://embark-studios.github.io/cargo-deny/
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
# Fail on any security advisory in the RustSec database.
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (no successor, no known vulnerability). Pulled in
    # transitively by the wgpu/graphics stack as a proc-macro helper; there is no
    # upgrade path and no runtime security impact. Informational only.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licenses compatible with this MIT-licensed project.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    # Mozilla CA root-cert bundle data (webpki-roots / webpki-root-certs), pulled
    # in transitively by the rustls/reqwest TLS stack. A permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Surface accidental dependency bloat and version drift.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are `path` deps with no version req, which reads as
# a wildcard — allow that for local paths while still denying wildcards on
# crates.io dependencies.
allow-wildcard-paths = true
allow = []
deny = []

[sources]
# Only crates.io and first-party git sources are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/coral-xyz/anchor",
]
