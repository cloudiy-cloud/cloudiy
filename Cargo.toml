[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/provider",
    "crates/consumer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GPUaaS Team"]
license = "MIT"
repository = "https://github.com/seu-usuario/gpuasas"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web / RPC
axum = "0.7"
tonic = "0.12"
prost = "0.13"
tower = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Solana (futuro)
# solana-sdk = "2"
# anchor-lang = "0.30"

# Cryptography
ed25519-dalek = "2"
rand = "0.8"

# Testing
tokio-test = "0.4"