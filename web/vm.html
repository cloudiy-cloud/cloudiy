        body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
        /* Fluorescent-green scrollbars with black borders, OS-wide */
        * { scrollbar-width: thin; scrollbar-color: #ccff33 #000; }
        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-track { background: #000; border-radius: 8px; }
        *::-webkit-scrollbar-thumb { background: #ccff33; border: 2px solid #000; border-radius: 8px; }

        .gpu-card { transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1); }

        .gpu-canvas { border-radius: 14px; background: #111; }
        .titlebar { cursor: grab; user-select: none; }
        .titlebar:active { cursor: grabbing; }
        /* Resize handles: 4 edges + 4 corners (inside the border, since the
           window clips overflow). Corners win via higher z-index. */
        .win-handle { position: absolute; z-index: 40; }
        .wh-n  { top: 0; left: 10px; right: 10px; height: 5px; cursor: n-resize; }
        .wh-s  { bottom: 0; left: 10px; right: 10px; height: 5px; cursor: s-resize; }
        .wh-e  { right: 0; top: 10px; bottom: 10px; width: 5px; cursor: e-resize; }
        .wh-w  { left: 0; top: 10px; bottom: 10px; width: 5px; cursor: w-resize; }
        .wh-ne { top: 0; right: 0; width: 12px; height: 12px; cursor: ne-resize; z-index: 41; }
        .wh-nw { top: 0; left: 0; width: 12px; height: 12px; cursor: nw-resize; z-index: 41; }
        .wh-se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: se-resize; z-index: 41; }
        .wh-sw { bottom: 0; left: 0; width: 12px; height: 12px; cursor: sw-resize; z-index: 41; }
        #wallpaper {

                radial-gradient(ellipse at 70% 20%, rgba(204,255,51,0.07), transparent 55%),

        }
        @keyframes bootpulse { 0%,100% { opacity: .4 } 50% { opacity: 1 } }

</head>
<body class="bg-black text-white h-screen">

    <!-- Boot screen -->

    <div id="login" class="fixed inset-0 z-[190] bg-black hidden flex-col items-center justify-center" style="background: radial-gradient(ellipse at 50% 30%, rgba(204,255,51,0.06), transparent 60%), #000;">

    <script>
        // ================= VM state — the machine IS this state ==========
        // Persisted per user (localStorage stands in for the encrypted,
        // replicated network volume). No provider ever hosts the VM: state
        // lives outside providers; compute bursts onto the network per run.
        const VM_KEY = 'cloudiy_vm_v1';
        function loadVM() {
            try {
                const vm = JSON.parse(localStorage.getItem(VM_KEY) || 'null');
                if (vm && Array.isArray(vm.installed)) {
                    vm.installed = [...new Set(vm.installed)];
                    if (!Array.isArray(vm.parts)) vm.parts = [];
                    if (!Array.isArray(vm.warm)) vm.warm = [];
                    if (!vm.samples || typeof vm.samples !== 'object') vm.samples = {};
                    return vm;
                }
            } catch (e) {}
            return {
                name: 'vm-' + Math.random().toString(36).slice(2, 8),
                created: new Date().toISOString(),
                cpu: 8, ram: 32, vram: 24, disk: 50,
                installed: [],
                parts: [],   // hardware attached from the Hardware Store
                warm: [],    // endpoints already provisioned on a node (cold start done)
                samples: {}, // key → { type, src }: real outputs a model generated,
                             // reused as that endpoint's thumbnail (never copied art)
            };
        }
        function saveVM() { try { localStorage.setItem(VM_KEY, JSON.stringify(VM)); } catch (e) {} }
        const VM = loadVM(); saveVM();

        // ================= app catalog (docker images) ====================
        const APP_CATS = [
            { key: 'image',     name: 'Image' },
            { key: 'video',     name: 'Video' },
            { key: 'audio',     name: 'Audio' },
            { key: 'language',  name: 'Language' },
            { key: 'embedding', name: 'Embedding' },
            { key: 'dev',       name: 'Dev' },
        ];
        const APPS = [
            // Image
            { key: 'comfyui',   cat: 'image',     name: 'ComfyUI',                icon: 'fa-image',        image: 'ghcr.io/comfyanonymous/comfyui',                size: 6.4, kind: 'image', version: '5.8.6',  pub: 'cloudiy-workers', stars: 710,  desc: 'Generate images with ComfyUI using FLUX.1-dev (fp8).' },
            { key: 'sdxl',      cat: 'image',     name: 'SDXL (Stable Diffusion XL)', icon: 'fa-wand-magic-sparkles', image: 'cloudiy/worker-sdxl',           size: 8.2, kind: 'image', version: '2.1.1',  pub: 'cloudiy-workers', stars: 443,  desc: 'Generate images with Stable Diffusion XL.' },
            { key: 'esrgan',    cat: 'image',     name: 'Real-ESRGAN (Upscaler)', icon: 'fa-up-right-and-down-left-from-center', image: 'cloudiy/worker-esrgan', size: 1.4, kind: 'image', version: '2.0.5',  pub: 'community',       stars: 126,  desc: 'High-performance image upscaling worker.' },
            // Video
            { key: 'wan',       cat: 'video',     name: 'Wan 2.2 with LoRA',      icon: 'fa-clapperboard', image: 'cloudiy/worker-wan22',                          size: 12.8, kind: 'image', version: '1.1.0', pub: 'community',      stars: 232,  desc: 'Generate high-quality videos from images with natural motion. Up to 3 LoRA pairs.' },
            { key: 'ltx',       cat: 'video',     name: 'LTX-Video',              icon: 'fa-film',         image: 'cloudiy/worker-ltx-video',                      size: 9.6,  kind: 'image', version: '0.9.7', pub: 'cloudiy-workers', stars: 187,  desc: 'Real-time text-to-video generation, 5-second clips.' },
            // Audio
            { key: 'whisper',   cat: 'audio',     name: 'Whisper Large v3',       icon: 'fa-microphone',   image: 'onerahmet/openai-whisper-asr-webservice',       size: 2.8,  kind: 'audio', version: '1.9.2', pub: 'cloudiy-workers', stars: 341,  desc: 'Speech-to-text inference in 100 languages, word-level timestamps.' },
            { key: 'musicgen',  cat: 'audio',     name: 'MusicGen',               icon: 'fa-music',        image: 'cloudiy/worker-musicgen',                       size: 4.1,  kind: 'audio', version: '1.2.0', pub: 'community',       stars: 158,  desc: 'Text-to-music generation, 15-second clips.' },
            // Language
            { key: 'vllm',      cat: 'language',  name: 'vLLM',                   icon: 'fa-bolt-lightning', image: 'cloudiy/worker-vllm',                         size: 7.9,  kind: 'chat',  version: '2.22.5', pub: 'cloudiy-workers', stars: 455, desc: 'Deploy OpenAI-compatible blazing-fast LLM endpoints powered by vLLM.' },
            { key: 'ollama',    cat: 'language',  name: 'Ollama Worker',          icon: 'fa-robot',        image: 'ollama/ollama',                                  size: 1.9,  kind: 'chat',  version: '0.30.8', pub: 'community',      stars: 296,  desc: 'A serverless Ollama worker — chat with Llama, Qwen, Mistral…' },

            // Embedding
            { key: 'infinity',  cat: 'embedding', name: 'Infinity Embedding',     icon: 'fa-diagram-project', image: 'cloudiy/worker-infinity',                    size: 3.4,  kind: 'shell', version: '1.1.4', pub: 'cloudiy-workers', stars: 147,  desc: 'High-throughput, OpenAI-compatible text embedding & reranker.' },
            // Dev environments
            { key: 'pytorch',   cat: 'dev',       name: 'PyTorch',                icon: 'fa-fire',         image: 'pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime', size: 7.1,  kind: 'shell', version: '2.4.0', pub: 'cloudiy-workers', stars: 389,  desc: 'CUDA notebook / training environment.' },
            { key: 'jupyter',   cat: 'dev',       name: 'Jupyter',                icon: 'fa-book',         image: 'jupyter/scipy-notebook',                         size: 3.2,  kind: 'shell', version: '7.2.1', pub: 'community',       stars: 204,  desc: 'Notebooks with the scipy stack.' },
            { key: 'node',      cat: 'dev',       name: 'Node.js',                icon: 'fa-node-js',      image: 'node:22-slim',                                   size: 0.2,  kind: 'shell', version: '22.11', pub: 'community',       stars: 92,   desc: 'JavaScript runtime environment.' },
            { key: 'postgres',  cat: 'dev',       name: 'Postgres',               icon: 'fa-database',     image: 'postgres:16',                                    size: 0.4,  kind: 'svc',   version: '16.4',  pub: 'community',       stars: 171,  desc: 'Relational database service.' },
            { key: 'ffmpeg',    cat: 'dev',       name: 'FFmpeg',                 icon: 'fa-sliders',      image: 'linuxserver/ffmpeg',                             size: 0.6,  kind: 'shell', version: '7.0.2', pub: 'community',       stars: 88,   desc: 'Video/audio transcoding toolbox.' },
        ];
        const appOf = k => APPS.find(a => a.key === k);
        let storeCat = 'all', storeQuery = '', storeSort = 'popular';

        // Official brand marks via Simple Icons (CC0 icon collection), used
        // wherever an app has one; the rest keep their generic glyph. Rendered
        // white so every logo stays legible on the dark theme.
        const APP_LOGO = {
            // Simple Icons slugs (CC0) — rendered as monochrome white marks.
            ollama: 'ollama', whisper: 'openai', vllm: 'vllm',
            pytorch: 'pytorch', jupyter: 'jupyter', node: 'nodedotjs',
            postgres: 'postgresql', ffmpeg: 'ffmpeg',
            // Full-color official logos served from each project's own repo
            // (jsDelivr) or its official org avatar. Every URL was verified to
            // return a real image. Where a project ships no square logo of its
            // own, its parent brand's official mark is used.
            comfyui:  'https://avatars.githubusercontent.com/u/166579949?v=4',              // Comfy-Org mark
            esrgan:   'https://cdn.jsdelivr.net/gh/xinntao/Real-ESRGAN@master/assets/realesrgan_logo.png',
            wan:      'https://cdn.jsdelivr.net/gh/Wan-Video/Wan2.2@main/assets/logo.png',
            axolotl:  'https://cdn.jsdelivr.net/gh/axolotl-ai-cloud/axolotl@main/image/axolotl_symbol_digital_white.svg',
            sdxl:     'https://cdn-avatars.huggingface.co/v1/production/uploads/643feeb67bc3fbde1385cc25/7vmYr2XwVcPtkLzac_jxQ.png', // Stability AI
            ltx:      'https://cdn-avatars.huggingface.co/v1/production/uploads/669524bcbcd81f395e8f60f6/0ynfqKEWMh_dn3h4ff1K5.png', // Lightricks
            musicgen: 'https://avatars.githubusercontent.com/u/16943930?v=4',               // Meta Research
            infinity: 'https://avatars.githubusercontent.com/u/63565275?v=4',               // Infinity maintainer
        };
        /// Icon markup for an app: the official logo `<img>`. The APP_LOGO value
        /// is either a full logo URL (used as-is) or a Simple Icons slug (built
        /// into a white monochrome mark). `imgSize` sizes the logo; a rare load
        /// failure falls back to the app's white FA glyph.
        function appGlyph(app, imgSize, faSize) {
            const logo = APP_LOGO[app.key];
            if (logo) {
                const src = logo.startsWith('http') ? logo : `https://cdn.simpleicons.org/${logo}/ffffff`;
                return `<img src="${src}" alt="${app.name}" `
                    + `class="${imgSize} object-contain" `
                    + `onerror="this.outerHTML='&lt;i class=\\'fa-solid ${app.icon} text-white ${faSize || ''}\\'&gt;&lt;/i&gt;'">`;
            }
            return `<i class="fa-solid ${app.icon} text-white ${faSize || ''}"></i>`;
        }
        let hubTab = 'endpoints'; // 'endpoints' | 'repos'

        // Public Endpoints: generation models ready to run per prompt —
        // no install, pay per request (x402 · USDC).
        const ENDPOINTS = [
            // Video
            { key: 'hailuo-fast', cat: 'video', vendor: 'minimax',     model: 'hailuo 2.3 fast',        task: 'image-to-video', price: 0.18, runs: 48210, desc: 'Fast AI video generation. Animate a reference image with a text prompt into 6–10s clips.' },
            { key: 'veo-fast',    cat: 'video', vendor: 'google',      model: 'veo 3.1 fast',           task: 'image-to-video', price: 0.32, runs: 39877, desc: 'High-quality image-to-video generation, up to 4K resolution with optional audio.' },
            { key: 'hailuo-std',  cat: 'video', vendor: 'minimax',     model: 'hailuo 02 standard',     task: 'text-to-video',  price: 0.24, runs: 27904, desc: 'Generate 6–10s videos from text prompts or reference images with prompt enhancement.' },
            { key: 'p-video',     cat: 'video', vendor: 'pruna',       model: 'p-video',                task: 'text-to-video',  price: 0.15, runs: 18442, desc: 'Premium AI video from text, images and audio. Generation in under 10 seconds.' },
            { key: 'vidu-t2v',    cat: 'video', vendor: 'vidu',        model: 'vidu q3 text-to-video',  task: 'text-to-video',  price: 0.19, runs: 15230, desc: 'High-quality videos from text with multiple resolutions, aspect ratios and audio.' },
            { key: 'vidu-i2v',    cat: 'video', vendor: 'vidu',        model: 'vidu q3 image-to-video', task: 'image-to-video', price: 0.21, runs: 13096, desc: 'Animate a reference image with motion driven by a text prompt, up to 1080p.' },
            { key: 'kling',       cat: 'video', vendor: 'kwaivgi',     model: 'kling v2.6 motion',      task: 'image-to-video', price: 0.28, runs: 11873, desc: 'Transfers motion from reference videos to animate still images with smooth results.' },
            // Image
            { key: 'nano-banana', cat: 'image', vendor: 'google',      model: 'nano banana 2',          task: 'image-to-image', price: 0.04, runs: 52108, desc: 'AI-powered image editing. Up to 14 reference images, outputs at 1K / 2K / 4K.' },
            { key: 'z-image',     cat: 'image', vendor: 'tongyi-mai',  model: 'z image turbo',          task: 'text-to-image',  price: 0.012, runs: 44560, desc: 'Powerful and efficient image generation family with 6B parameters.' },
            { key: 'qwen-edit',   cat: 'image', vendor: 'qwen',        model: 'qwen image edit 2511',   task: 'image-to-image', price: 0.03, runs: 21785, desc: 'Strong edit consistency, multi-person identity/pose consistency, built-in LoRA styles.' },
            { key: 'flux2',       cat: 'image', vendor: 'bfl',         model: 'flux.2 pro',             task: 'text-to-image',  price: 0.05, runs: 61240, desc: 'State-of-the-art text-to-image with exceptional prompt adherence and detail.' },
            // Audio
            { key: 'stable-audio',cat: 'audio', vendor: 'stability',   model: 'stable audio 2.5',       task: 'text-to-audio',  price: 0.06, runs: 9312,  desc: 'Generate music and sound effects from text, up to 3 minutes, 44.1 kHz stereo.' },
            { key: 'whisper-ep',  cat: 'audio', vendor: 'openai',      model: 'whisper large v3',       task: 'speech-to-text', price: 0.006, runs: 33470, desc: 'Transcription in 100 languages with word-level timestamps.' },
            { key: 'chatterbox',  cat: 'audio', vendor: 'resemble',    model: 'chatterbox tts',         task: 'text-to-speech', price: 0.02, runs: 12055, desc: 'Expressive text-to-speech with zero-shot voice cloning.' },
            // Language
            { key: 'llama-ep',    cat: 'language', vendor: 'meta',     model: 'llama 3.3 70b',          task: 'chat',           price: 0.004, runs: 71204, desc: 'Frontier open-weights chat model served on network GPUs, per-1k-token pricing.' },
        ];
        const TASK_KIND = t => t.includes('video') || t.includes('image') ? 'image'
                             : t === 'chat' ? 'chat' : 'audio';
        const PROMPT_PLACEHOLDER = {
            image: 'a solarpunk city at golden hour, ultra detailed…',
            video: 'a paper boat sailing through neon rain…',
            audio: 'lo-fi beat with warm vinyl crackle…',
            language: 'Explain the x402 payment flow in two sentences.',
        };

        // ================= window manager =================================
        let zTop = 10, winCount = 0;
        const openWindows = {};
        const TASKBAR_H = 56, MIN_W = 300, MIN_H = 180;

        // While dragging/resizing over iframe apps, iframes must not swallow
        // mouse events — toggle pointer-events during the operation.
        function setIframesInert(on) {
            document.querySelectorAll('#windows iframe').forEach(f => {
                f.style.pointerEvents = on ? 'none' : '';
            });
        }
        function dragOperation(onMove) {
            setIframesInert(true);
            document.body.style.userSelect = 'none';
            const up = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', up);
                setIframesInert(false);
                document.body.style.userSelect = '';
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', up);
        }
        /// Before any resize/maximize, freeze the current auto height so the
        /// window can be resized in both axes.
        function lockSize(win) {
            if (!win.style.height) {
                win.style.height = win.offsetHeight + 'px';
                win.style.maxHeight = 'none';
            }
        }

        function createWindow(id, title, icon, width, opts = {}) {
            if (openWindows[id]) { restoreWindow(id); return null; }
            const win = document.createElement('div');
            win.id = 'win-' + id;
            win.className = 'vm-window fixed bg-zinc-900/95 backdrop-blur border border-zinc-700 rounded-2xl overflow-hidden flex flex-col';
            const vp0 = viewportSize();
            const w = Math.min(width || 560, vp0.w - 40);
            win.style.width = w + 'px';
            win.style.maxHeight = (vp0.h - 120) + 'px';
            win.style.zIndex = ++zTop;
            winCount++;

            // -- titlebar with standard OS controls: − · ⛶ · × --------------
            const bar = document.createElement('div');
            bar.className = 'titlebar bg-zinc-950 border-b border-zinc-800 pl-4 pr-2 py-2 flex items-center justify-between';
            bar.innerHTML = `<div class="text-sm font-medium truncate mr-3"><i class="fa-solid ${icon} text-[#ccff33] mr-2"></i>${title}</div>`;
            const controls = document.createElement('div');
            controls.className = 'flex items-center gap-x-1 shrink-0';
            const mkBtn = (html, hover, aria) => {
                const b = document.createElement('button');
                b.className = `w-7 h-7 rounded-lg text-zinc-400 flex items-center justify-center text-xs ${hover}`;
                b.innerHTML = html;
                b.setAttribute('aria-label', aria);
                return b;
            };
            const minBtn = mkBtn('<i class="fa-solid fa-minus"></i>', 'hover:bg-zinc-800 hover:text-white', 'Minimize');
            const maxBtn = mkBtn('<i class="fa-solid fa-expand"></i>', 'hover:bg-zinc-800 hover:text-white', 'Maximize');
            const closeBtn = mkBtn('<i class="fa-solid fa-xmark"></i>', 'hover:bg-rose-500/20 hover:text-rose-400', 'Close');
            minBtn.onclick = e => { e.stopPropagation(); minimizeWindow(id); };
            maxBtn.onclick = e => { e.stopPropagation(); toggleMaximize(id); };
            closeBtn.onclick = e => { e.stopPropagation(); closeWindow(id); };
            controls.append(minBtn, maxBtn, closeBtn);
            bar.appendChild(controls);
            win.appendChild(bar);

            const body = document.createElement('div');
            body.className = (opts.plain ? 'overflow-hidden' : 'p-5 overflow-y-auto') + ' flex-1 min-h-0';
            if (opts.height) body.style.height = Math.min(opts.height, window.innerHeight - 170) + 'px';
            win.appendChild(body);

            // -- move (disabled while maximized; double-click toggles) ------
            bar.addEventListener('mousedown', e => {
                if (e.target.closest('button')) return;
                focusWindow(id);
                if (openWindows[id]?.maximized) return;
                openWindows[id].userTouched = true;
                const start = { dx: e.clientX - win.offsetLeft, dy: e.clientY - win.offsetTop };
                dragOperation(ev => {
                    win.style.left = Math.max(0, ev.clientX - start.dx) + 'px';
                    win.style.top = Math.max(0, Math.min(ev.clientY - start.dy, window.innerHeight - TASKBAR_H - 40)) + 'px';
                });
            });
            bar.addEventListener('dblclick', e => {
                if (e.target.closest('button')) return;
                toggleMaximize(id);
            });
            win.addEventListener('mousedown', () => focusWindow(id));

            // -- resize handles: 4 edges + 4 corners -------------------------
            [['n','wh-n'],['s','wh-s'],['e','wh-e'],['w','wh-w'],
             ['ne','wh-ne'],['nw','wh-nw'],['se','wh-se'],['sw','wh-sw']].forEach(([dir, cls]) => {
                const h = document.createElement('div');
                h.className = 'win-handle ' + cls;
                h.addEventListener('mousedown', e => {
                    e.preventDefault(); e.stopPropagation();
                    if (openWindows[id]?.maximized) return;
                    focusWindow(id);
                    openWindows[id].userTouched = true;
                    lockSize(win);
                    const start = {
                        x: e.clientX, y: e.clientY,
                        l: win.offsetLeft, t: win.offsetTop,
                        w: win.offsetWidth, h: win.offsetHeight,
                    };
                    dragOperation(ev => {
                        const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
                        let l = start.l, t = start.t, w2 = start.w, h2 = start.h;
                        if (dir.includes('e')) w2 = start.w + dx;
                        if (dir.includes('s')) h2 = start.h + dy;
                        if (dir.includes('w')) { w2 = start.w - dx; l = start.l + dx; }
                        if (dir.includes('n')) { h2 = start.h - dy; t = start.t + dy; }
                        if (w2 < MIN_W) { if (dir.includes('w')) l -= MIN_W - w2; w2 = MIN_W; }
                        if (h2 < MIN_H) { if (dir.includes('n')) t -= MIN_H - h2; h2 = MIN_H; }
                        win.style.left = l + 'px';
                        win.style.top = Math.max(0, t) + 'px';
                        win.style.width = w2 + 'px';
                        win.style.height = h2 + 'px';
                    });
                });
                win.appendChild(h);
            });

            // Born invisible: the window is positioned only after callers
            // fill the body (real height known). Revealing it then removes
            // the top-left flash that a visible-but-unpositioned window causes.
            win.style.visibility = 'hidden';
            document.getElementById('windows').appendChild(win);
            const cascade = ((winCount - 1) % 5) * 24;
            setTimeout(() => {
                centerWindow(id, cascade);
                win.style.visibility = '';
            }, 0);
            openWindows[id] = { el: win, title, icon, minimized: false, maximized: false, prevRect: null, maxBtn };
            renderTaskbar();
            return body;
        }

        function viewportSize() {
            return {
                w: window.innerWidth || document.documentElement.clientWidth || 1280,
                h: window.innerHeight || document.documentElement.clientHeight || 800,
            };
        }
        function centerWindow(id, cascade = 0) {
            const w = openWindows[id];
            if (!w || w.maximized || w.minimized) return;
            const vp = viewportSize();
            w.cascade = cascade || w.cascade || 0;
            w.el.style.left = Math.max(8, (vp.w - w.el.offsetWidth) / 2 + w.cascade) + 'px';
            w.el.style.top = Math.max(8, (vp.h - TASKBAR_H - w.el.offsetHeight) / 2 + w.cascade) + 'px';
        }
        // Windows the user hasn't repositioned stay centered on viewport
        // changes (also fixes environments that lay out after first paint).
        window.addEventListener('resize', () => {
            Object.entries(openWindows).forEach(([id, w]) => {
                if (!w.userTouched) centerWindow(id);
            });
        });

        function focusWindow(id) { const w = openWindows[id]; if (w) w.el.style.zIndex = ++zTop; }
        function closeWindow(id) { const w = openWindows[id]; if (!w) return; w.el.remove(); delete openWindows[id]; renderTaskbar(); }

        function minimizeWindow(id) {
            const w = openWindows[id]; if (!w) return;
            w.minimized = true;
            w.el.style.display = 'none';
            renderTaskbar();
        }
        function restoreWindow(id) {
            const w = openWindows[id]; if (!w) return;
            if (w.minimized) { w.minimized = false; w.el.style.display = ''; }
            focusWindow(id);
            renderTaskbar();
        }
        function toggleMaximize(id) {
            const w = openWindows[id]; if (!w) return;
            const win = w.el;
            if (!w.maximized) {
                lockSize(win);
                w.prevRect = {
                    left: win.style.left, top: win.style.top,
                    width: win.style.width, height: win.style.height,
                };
                win.style.left = '8px';
                win.style.top = '8px';
                win.style.width = (window.innerWidth - 16) + 'px';
                win.style.height = (window.innerHeight - TASKBAR_H - 16) + 'px';
                w.maximized = true;
                w.maxBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                w.maxBtn.setAttribute('aria-label', 'Restore');
            } else {
                Object.assign(win.style, w.prevRect);
                w.maximized = false;
                w.maxBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                w.maxBtn.setAttribute('aria-label', 'Maximize');
            }
            focusWindow(id);
        }

        function renderTaskbar() {
            const bar = document.getElementById('taskbar-apps');
            bar.innerHTML = '';
            Object.entries(openWindows).forEach(([id, w]) => {
                const b = document.createElement('button');
                b.className = w.minimized
                    ? 'px-3 py-1.5 rounded-xl bg-zinc-950 border border-zinc-800 text-xs text-zinc-500 hover:border-[#ccff33]/50 whitespace-nowrap'
                    : 'px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-700 text-xs hover:border-[#ccff33]/50 whitespace-nowrap';
                b.innerHTML = `<i class="fa-solid ${w.icon} ${w.minimized ? 'text-zinc-600' : 'text-[#ccff33]'} mr-1.5"></i>${w.title}`;
                b.onclick = () => w.minimized ? restoreWindow(id) : (minimizeWindow(id));
                bar.appendChild(b);
            });
        }

        // ================= desktop icons ==================================
        function desktopIcon(icon, label, onclick, app) {

            b.className = 'desktop-icon w-24 rounded-2xl px-2 py-3 text-center';

                             ${glyph}

        // ================= My Virtual Machine =============================
        function openMyVM() {
            hideStart();
            const body = createWindow('myvm', 'My Virtual Machine', 'fa-computer', 520);
            if (!body) return;
            const used = VM.installed.reduce((s, k) => s + (appOf(k)?.size || 0), 0);
            const pct = Math.min(100, used / VM.disk * 100).toFixed(0);

            // Compute power by category: base slice + parts attached from the
            // Hardware Store, per resource kind.
            const all = VM.parts.map(partOf).filter(Boolean);
            const attached = kindKey => all.filter(p => p.kind === kindKey);
            // Base = current spec minus everything attached (parts AND whole
            // machines), so a rented machine never inflates the "base" chip.
            const sumField = field => all.reduce((s, p) => s + (p.add[field] || 0), 0);
            const chip = (label, accent) =>
                `<span class="px-2 py-0.5 rounded-lg bg-zinc-950 border ${accent ? 'border-[#ccff33]/40 text-zinc-200' : 'border-zinc-800 text-zinc-500'} text-[10px] font-mono">${label}</span>`;
            // A whole machine contributes to several categories at once; show it
            // as a chip in each resource it provides.
            const machines = all.filter(p => p.kind === 'MACHINE');
            const mChip = (field, unit) => machines.filter(m => m.add[field])
                .map(m => chip(`${m.name} · +${m.add[field]} ${unit} · $${m.price.toFixed(2)}/h`, true)).join('');

            const gpuParts = attached('GPU'), cpuParts = attached('CPU'),
                  ramParts = attached('RAM'), diskParts = attached('STORAGE');
            const baseCpu = VM.cpu - sumField('cpu');
            const baseRam = VM.ram - sumField('ram');
            const baseVram = VM.vram - sumField('vram');
            const baseDisk = VM.disk - sumField('disk');

            const catCard = (icon, name, value, unit, chips) => `
                <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[10px] tracking-widest text-zinc-500"><i class="fa-solid ${icon} text-[#ccff33] mr-1.5"></i>${name}</span>
                        <span class="font-mono text-lg text-[#ccff33]">${value}<span class="text-xs text-zinc-500 ml-1">${unit}</span></span>
                    </div>
                    <div class="flex flex-wrap gap-1">${chips}</div>
                </div>`;

            body.innerHTML = `
                <div class="flex items-center gap-x-4 mb-5">
                    <div class="w-14 h-14 rounded-2xl bg-[#ccff33] flex items-center justify-center">
                        <i class="fa-solid fa-computer text-black text-2xl"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-display text-xl">${VM.name}</div>
                        <div class="text-xs text-zinc-500 font-mono">CloudiyOS 0.1 · identity-bound</div>
                    </div>
                    <button onclick="openHardwareStore()" class="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold">
                        <i class="fa-solid fa-microchip text-[#ccff33] mr-1.5"></i>Upgrade
                    </button>
                </div>

                <div class="text-[10px] tracking-widest text-zinc-500 mb-2">COMPUTE POWER · SELECTED BY YOU</div>
                <div class="grid sm:grid-cols-2 gap-3 mb-4">
                    ${catCard('fa-microchip', 'COMPUTE', VM.cpu, 'vCPU',
                        chip(`base ${baseCpu} vCPU`) + cpuParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('cpu', 'vCPU'))}
                    ${catCard('fa-memory', 'MEMORY', VM.ram, 'GB',
                        chip(`base ${baseRam} GB`) + ramParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('ram', 'GB'))}
                    ${catCard('fa-bolt', 'GRAPHICS', VM.vram, 'GB VRAM',
                        (baseVram > 0 ? chip(`base ${baseVram} GB`) : (gpuParts.length || machines.some(m => m.add.vram) ? '' : chip('no GPU — attach one')))
                        + gpuParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('vram', 'GB'))}
                    ${catCard('fa-hard-drive', 'STORAGE', VM.disk, 'GB',
                        chip(`base ${baseDisk} GB`) + diskParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('disk', 'GB'))}
                </div>

                <div class="mb-1 flex justify-between text-xs text-zinc-400"><span>Volume usage (${VM.installed.length} images)</span><span class="font-mono">${used.toFixed(1)} / ${VM.disk} GB</span></div>
                <div class="h-2 bg-zinc-950 border border-zinc-800 rounded-full overflow-hidden">
                    <div class="h-full bg-[#ccff33]" style="width:${pct}%"></div>
                </div>`;
        }

                b.textContent = c.name;
                b.onclick = () => { storeCat = c.key; renderStore(body); };

        function renderStoreGrid(body) {

                if (storeSort === 'name')    items = [...items].sort((a, b) => a.name.localeCompare(b.name));

            body.querySelector('#store-empty').classList.toggle('hidden', items.length > 0);
        }

        // Procedural thumbnail — deterministic per endpoint (honest placeholder
        // until real sample outputs ship with the serverless runtime).
        function drawThumb(canvas, seedText) {
            const ctx = canvas.getContext('2d');
            let seed = [...seedText].reduce((a, c) => a + c.charCodeAt(0), 11);
            const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
            const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            g.addColorStop(0, `hsl(${rnd() * 360}, 45%, 13%)`);
            g.addColorStop(1, `hsl(${rnd() * 360}, 55%, 26%)`);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 26; i++) {
                ctx.beginPath();
                ctx.arc(rnd() * canvas.width, rnd() * canvas.height, rnd() * 34 + 3, 0, 7);
                ctx.fillStyle = `hsla(${68 + rnd() * 45}, 90%, ${48 + rnd() * 32}%, ${0.05 + rnd() * 0.14})`;
                ctx.fill();
            }
            ctx.strokeStyle = 'rgba(204,255,51,0.35)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * (0.3 + rnd() * 0.5));
            for (let x = 0; x <= canvas.width; x += 14) {
                ctx.lineTo(x, canvas.height * (0.25 + rnd() * 0.55));
            }
            ctx.stroke();
        }

        function endpointCard(ep) {
            const card = document.createElement('div');
            card.className = 'bg-zinc-950 border border-zinc-800 hover:border-zinc-600 rounded-2xl p-3 flex flex-col transition-all cursor-pointer';
            // Thumbnail = a real output this model generated (cached after a run
            // on a GPU node), otherwise a placeholder. Never external sample art.
            const sample = VM.samples[ep.key];
            let thumb;
            if (sample && sample.type === 'image') {
                thumb = `<img src="${sample.src}" alt="${ep.model} sample" class="w-full h-40 object-cover rounded-xl mb-3">`;
            } else if (sample && sample.type === 'video') {
                thumb = `<video src="${sample.src}" muted playsinline preload="metadata" class="w-full h-40 object-cover rounded-xl mb-3"></video>`;
            } else {
                thumb = `<canvas width="340" height="160" class="w-full rounded-xl mb-3"></canvas>`;
            }
            card.innerHTML = `
                ${thumb}
                <div class="text-sm font-medium mb-1">${ep.vendor} <span class="text-zinc-500">/</span> ${ep.model}</div>
                <div class="text-xs text-zinc-500 leading-relaxed flex-1">${ep.desc}</div>
                <div class="flex items-center justify-between mt-3">
                    <span class="text-[10px] px-2 py-1 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-400 font-mono">${ep.task}</span>
                    <span class="text-[10px] text-zinc-500 font-mono">$${ep.price}/req · ${ep.runs.toLocaleString()} runs</span>
                </div>`;
            const cv = card.querySelector('canvas');
            if (cv) drawThumb(cv, ep.key + ep.model);
            const btn = document.createElement('button');
            btn.className = 'mt-3 w-full py-2 rounded-xl bg-[#ccff33] hover:bg-white text-black text-xs font-semibold';
            btn.textContent = 'Run';
            btn.onclick = (e) => { e.stopPropagation(); openEndpoint(ep); };
            card.onclick = () => openEndpoint(ep);
            card.appendChild(btn);
            return card;
        }

        // Endpoint playground: prompt in, x402 per request, output by task type.
        function openEndpoint(ep) {
            hideStart();
            // Chat models keep the conversational window; image/video/audio
            // get the full playground (Input | Result, like the reference).
            if (TASK_KIND(ep.task) === 'chat') {
                const body = createWindow('ep-' + ep.key, `${ep.vendor} / ${ep.model}`, 'fa-wand-magic-sparkles', 560);
                if (!body) return;
                chatUI(body, { name: `${ep.vendor} / ${ep.model}`, kind: 'chat', key: ep.key });
                return;
            }
            const body = createWindow('ep-' + ep.key, `${ep.vendor} / ${ep.model}`, 'fa-wand-magic-sparkles', 920);
            if (!body) return;
            playgroundUI(body, ep);
        }

        // ---- endpoint playground: Input | Result, tabs Playground/API ----
        function playgroundUI(body, ep) {
            const isVideo = ep.task.includes('video');
            const isI2 = ep.task.startsWith('image-to') || ep.task === 'speech-to-text';
            const durations = isVideo ? ['5s', '10s', '15s'] : null;
            const sizes = ep.cat === 'image' ? ['512', '768', '1024'] : null;

            body.innerHTML = `

                    <pre class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-[11px] font-mono text-zinc-300 overflow-x-auto">curl -X POST https://node.cloudiy/v1/${ep.key} \\

                        } else if (d.media_url) {
                            preview.innerHTML = `<video src="${d.media_url}" controls class="w-full rounded-xl"></video>`;
                            VM.samples[ep.key] = { type: 'video', src: d.media_url }; saveVM();
                            dl.disabled = false;
                            dl.className = 'ml-auto px-3 py-1.5 rounded-xl bg-zinc-950 border border-[#ccff33]/50 text-[11px] text-[#ccff33] hover:bg-zinc-900';
                            dl.onclick = () => { const a = document.createElement('a'); a.href = d.media_url; a.download = ep.key + '.mp4'; a.click(); };
                            logLine2(`← 200 OK · video generated on ${d.settled_via} · cached as thumbnail`, true);
                            setStatus('Complete');
                        } else {
                            preview.innerHTML = `<div class="text-sm text-rose-400 leading-relaxed">⚠ ${(d.error || 'error').replace(/</g,'&lt;')}</div>`;

                    } catch (e) {
                        logLine2('⚠ gateway unreachable — showing demo preview');
                    }
                }

                // cold start: first run pulls the model on the node, then warm
                if (!VM.warm.includes(ep.key)) {
                    logLine2(`· cold start: provisioning model on node…`);

                    wrap.appendChild(barUi);

                } else {

                    canvas.width = 560; canvas.height = 315;
                    canvas.className = 'w-full rounded-xl';
                    let seed = [...prompt].reduce((a, c) => a + c.charCodeAt(0), 7);
                    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
                    const ctx = canvas.getContext('2d');
                    const g = ctx.createLinearGradient(0, 0, 560, 315);
                    g.addColorStop(0, `hsl(${rnd() * 360},45%,12%)`);
                    g.addColorStop(1, `hsl(${rnd() * 360},60%,24%)`);
                    ctx.fillStyle = g; ctx.fillRect(0, 0, 560, 315);
                    for (let i = 0; i < 40; i++) {
                        ctx.beginPath();
                        ctx.arc(rnd() * 560, rnd() * 315, rnd() * 58 + 4, 0, 7);
                        ctx.fillStyle = `hsla(${68 + rnd() * 40},90%,${50 + rnd() * 30}%,${0.05 + rnd() * 0.12})`;

        }
        function storeCard(app) {

                    <span><i class="fa-regular fa-star mr-1"></i>${app.stars.toLocaleString()}</span>
                </div>`;

        async function installApp(app, row, btn) {
            btn.disabled = true; btn.textContent = 'Pulling…';
            const bar = row.querySelector('.progress');

            const log = row.querySelector('.pull-log');

        const partOf = k => PARTS.find(p => p.key === k) || MACHINES.find(m => m.key === k);

        function applyPart(part, sign) {
            if (part.add.cpu)  VM.cpu  = Math.max(1, VM.cpu  + sign * part.add.cpu);
            if (part.add.ram)  VM.ram  = Math.max(1, VM.ram  + sign * part.add.ram);
            if (part.add.vram) VM.vram = Math.max(0, VM.vram + sign * part.add.vram);
            if (part.add.disk) VM.disk = Math.max(10, VM.disk + sign * part.add.disk);

        function attachPart(key) {

        function detachPart(key) {
            const part = partOf(key);

        const PART_KINDS = [

        function rentMachineCard(machine) {

        // ---- three.js part models (GPU ported from the marketplace) -------
        function part3DBase(canvas) {
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(canvas.offsetWidth || 280, canvas.offsetHeight || 112);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, (canvas.offsetWidth || 280) / (canvas.offsetHeight || 112), 0.1, 100);
            camera.position.set(0, 0.5, 4.4);
            const dir = new THREE.DirectionalLight(0xffffff, 1.25);
            dir.position.set(4, 6, 8);
            scene.add(dir);
            scene.add(new THREE.AmbientLight(0x222222));
            const rim = new THREE.DirectionalLight(0xccff33, 0.55);
            rim.position.set(0, -8, 3);
            scene.add(rim);
            return { renderer, scene, camera };
        }
        const glowMat = (i = 0.7) => new THREE.MeshPhongMaterial({ color: 0xccff33, emissive: 0xccff33, emissiveIntensity: i, shininess: 80 });
        const darkMat = (c = 0x1f2528) => new THREE.MeshPhongMaterial({ color: c, shininess: 25, specular: 0x111111 });

        function initPart3D(canvas, kind) {
            if (!canvas || typeof THREE === 'undefined') return;
            const { renderer, scene, camera } = part3DBase(canvas);
            const root = new THREE.Group();
            scene.add(root);
            const spinners = [];

            if (kind === 'GPU') {
                // The marketplace reference card: long body, glow strip, 3 fans.
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.35, 0.55), darkMat());
                root.add(body);
                const accent = new THREE.Mesh(new THREE.BoxGeometry(3.45, 0.18, 0.6), glowMat(0.6));
                accent.position.y = -0.65;
                root.add(accent);
                [-0.95, 0.05, 1.05].forEach((x, index) => {
                    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.32, 32), darkMat(0x111111));
                    ring.rotation.x = Math.PI / 2;
                    ring.position.set(x, 0, 0.32);
                    root.add(ring);
                    const blades = new THREE.Group();
                    for (let i = 0; i < 7; i++) {
                        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.77, 0.08), glowMat(0.9));
                        blade.position.y = 0.22;
                        blade.rotation.z = i * (Math.PI * 2 / 7);
                        blades.add(blade);
                    }
                    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.35, 24), glowMat(0.7));
                    hub.rotation.x = Math.PI / 2;
                    blades.add(hub);
                    blades.position.set(x, 0, 0.32);
                    root.add(blades);
                    spinners.push({ obj: blades, speed: 0.12 + index * 0.02 });
                });
            } else if (kind === 'CPU') {
                // Substrate + heat-spreader lid + pulsing die + pin field.
                const pcb = new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.3, 0.12), darkMat(0x14210c));
                pcb.rotation.x = -0.9;
                root.add(pcb);
                const lid = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.7, 0.16), darkMat(0x3a4148));
                lid.rotation.x = -0.9;
                lid.position.z = 0.14; lid.position.y = 0.09;
                root.add(lid);
                const die = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.06), glowMat(0.8));
                die.rotation.x = -0.9;
                die.position.z = 0.26; die.position.y = 0.16;
                root.add(die);
                spinners.push({ obj: die, pulse: true });
                for (let i = -3; i <= 3; i++) {
                    const trace = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.28, 0.02), glowMat(0.25));
                    trace.rotation.x = -0.9;
                    trace.position.x = i * 0.31;
                    trace.position.z = -0.05; trace.position.y = -0.04;
                    root.add(trace);
                }
            } else if (kind === 'RAM') {
                // Standing stick: PCB, 8 memory chips, gold edge connector, glow top.
                const pcb = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.15, 0.1), darkMat(0x14210c));
                root.add(pcb);
                for (let i = 0; i < 8; i++) {
                    const chip = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.08), darkMat(0x0c0c0e));
                    chip.position.set(-1.5 + i * 0.43, 0.05, 0.09);
                    root.add(chip);
                }
                const edge = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.14, 0.12), new THREE.MeshPhongMaterial({ color: 0xd4af37, shininess: 90 }));
                edge.position.y = -0.62;
                root.add(edge);
                const glow = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 0.14), glowMat(0.9));
                glow.position.y = 0.62;
                root.add(glow);
                spinners.push({ obj: glow, pulse: true });
            } else {
                // STORAGE: NVMe-style slab with controller + pulsing activity LED.
                const slab = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.0, 0.14), darkMat(0x14210c));
                root.add(slab);
                const ctrl = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.1), darkMat(0x0c0c0e));
                ctrl.position.set(-1.0, 0, 0.11);
                root.add(ctrl);
                [0.0, 0.7, 1.4].forEach(x => {
                    const nand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.09), darkMat(0x191a1d));
                    nand.position.set(x, 0, 0.11);
                    root.add(nand);
                });
                const led = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.1), glowMat(1.0));
                led.position.set(-1.52, 0.32, 0.12);
                root.add(led);
                spinners.push({ obj: led, pulse: true, fast: true });
            }

            const entry = { renderer, raf: 0 };
            hwScenes.push(entry);
            (function animate() {
                entry.raf = requestAnimationFrame(animate);
                spinners.forEach(s => {
                    if (s.pulse) {
                        s.obj.material.emissiveIntensity =
                            0.45 + Math.abs(Math.sin(Date.now() * (s.fast ? 0.006 : 0.002))) * 0.6;
                    } else {
                        s.obj.rotation.z += s.speed;
                    }
                });
                root.rotation.y = Math.sin(Date.now() * 0.0003) * 0.09;
                root.rotation.x = Math.cos(Date.now() * 0.0002) * 0.03;
                renderer.render(scene, camera);
            })();
        }

        // Network reference rates (from the rent listings), used only to
        // suggest a fair per-part price for an offer.
        const OFFER_RATE = { cpu: 0.011, ram: 0.0026 }; // USDC per core/h, per GB/h
        // Suggested hourly price for the detected GPU, matched by model family.
        function guessGpuPrice(name) {
            const n = (name || '').toLowerCase();
            if (n.includes('h100')) return 3.90;
            if (n.includes('a100')) return 2.60;
            if (n.includes('l40'))  return 1.95;
            if (n.includes('4090')) return 0.90;
            if (n.includes('4080')) return 0.62;
            if (n.includes('3090')) return 0.48;
            if (n.includes('7900')) return 0.40;
            return name ? 0.50 : 0;
        }

        // Best-effort read of THIS machine's hardware straight from the browser.
        // Values are approximate — the browser coarsens/masks them (Chrome caps
        // deviceMemory at 8 GB, the GPU comes from the WebGL renderer string,
        // other engines restrict both) — so they only PRE-FILL the offer; the
        // `cloudiy share` daemon measures the exact capacity when the node
        // actually comes online.
        function detectHardware() {
            const cores = navigator.hardwareConcurrency || 0;
            const ram = navigator.deviceMemory || 0; // GB, coarse
            let gpu = '';
            try {
                const cv = document.createElement('canvas');
                const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
                const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) {
                    gpu = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toString();
                    // Unwrap ANGLE strings: "ANGLE (NVIDIA, NVIDIA RTX 4090 Direct3D11 ...)".
                    const m = gpu.match(/ANGLE \([^,]+,\s*([^,)]+)/);
                    if (m) gpu = m[1].replace(/Direct3D.*$/i, '').replace(/\(0x[0-9a-f]+\)/i, '').trim();
                }
            } catch (e) { /* WebGL blocked — leave GPU unknown */ }
            return { cores, ram, gpu: gpu.slice(0, 48) };
        }

        function renderOffer(el) {
            const det = detectHardware();
            const saved = VM.offering || {};
            // Hard caps: you can't offer more than this machine actually has.
            // Cores (hardwareConcurrency) and the GPU (WebGL renderer) are read
            // straight from the device; RAM (deviceMemory) is coarse and can
            // only UNDER-report, so capping at it never lets you over-claim.
            // When a value can't be read, fall back to a ceiling and flag it
            // unverified — the `cloudiy share` daemon enforces the real limit.
            const cpuMax = det.cores > 0 ? det.cores : 32;
            const ramMax = det.ram   > 0 ? det.ram   : 128;
            const clamp = (v, max) => Math.max(0, Math.min(v, max));
            const seedCpu = clamp(saved.cpu != null ? saved.cpu : cpuMax, cpuMax);
            const seedRam = clamp(saved.ram != null ? saved.ram : ramMax, ramMax);
            // A GPU can only be offered if this machine reports one, and only
            // the one it reports; a stale saved choice is dropped.
            const detGpu = det.gpu || '';
            const seedGpu = saved.gpu && saved.gpu === detGpu ? saved.gpu : '';
            const hint = (txt, warn) => `<span class="text-[10px] ${warn ? 'text-amber-500/80' : 'text-zinc-600'} ml-2">${txt}</span>`;
            const cpuHint = det.cores > 0 ? hint('max ' + det.cores + ' cores · this machine') : hint('unverified — daemon enforces the limit', true);
            const ramHint = det.ram   > 0 ? hint('max ~' + det.ram + ' GB · this machine')     : hint('unverified — daemon enforces the limit', true);
            const gpuHint = detGpu ? hint('detected: ' + detGpu) : hint('no GPU detected on this machine', true);
            const gpuSelect = detGpu
                ? `<option value="">None — offer CPU/RAM only</option><option>${detGpu}</option>`
                : `<option value="">None — no GPU on this machine</option>`;
            const priceBox = id =>
                `<div class="flex items-center gap-2 mt-2"><span class="text-[11px] text-zinc-500">Price</span>`
                + `<input type="number" id="${id}" min="0" step="0.01" class="w-24 bg-zinc-950 border border-zinc-700 rounded-xl px-2 py-1 text-xs font-mono focus:outline-none focus:border-[#ccff33]">`
                + `<span class="text-[11px] text-zinc-500">USDC/h</span></div>`;
            el.innerHTML = `
                <div class="space-y-5">
                    <div>
                        <div class="flex justify-between text-sm mb-2"><span class="text-zinc-400"><i class="fa-solid fa-microchip mr-2 text-[#ccff33]"></i>CPU to offer${cpuHint}</span><span class="font-mono" id="off-cpu-val"></span></div>
                        <input type="range" id="off-cpu" min="0" max="${cpuMax}" value="${seedCpu}" class="w-full accent-[#ccff33]">
                        ${priceBox('off-cpu-price')}
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-2"><span class="text-zinc-400"><i class="fa-solid fa-memory mr-2 text-[#ccff33]"></i>RAM to offer${ramHint}</span><span class="font-mono" id="off-ram-val"></span></div>
                        <input type="range" id="off-ram" min="0" max="${ramMax}" value="${seedRam}" class="w-full accent-[#ccff33]">
                        ${priceBox('off-ram-price')}
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-1.5">GPU to offer <span class="text-zinc-600">(optional)</span>${gpuHint}</label>
                        <select id="off-gpu" ${detGpu ? '' : 'disabled'} class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#ccff33] disabled:opacity-50">
                            ${gpuSelect}
                        </select>
                        ${priceBox('off-gpu-price')}
                    </div>
                    <div class="flex justify-between items-center border-t border-zinc-800 pt-3">
                        <span class="text-xs text-zinc-400">Total offer price</span>
                        <span class="font-mono text-lg text-[#ccff33]" id="off-total">$0.00/h</span>
                    </div>
                    <div id="off-summary" class="text-[11px] font-mono text-zinc-400 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2"></div>
                    <button id="off-go" class="w-full py-3.5 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-2xl text-sm">Announce to the network</button>
                </div>`;
            const $ = s => el.querySelector(s);
            if (seedGpu) $('#off-gpu').value = seedGpu;
            const gpuPrice = () => guessGpuPrice($('#off-gpu').value);
            // Seed prices: a saved offer wins, else the suggestion from the rate.
            $('#off-cpu-price').value = saved.priceCpu != null ? saved.priceCpu : +(seedCpu * OFFER_RATE.cpu).toFixed(2);
            $('#off-ram-price').value = saved.priceRam != null ? saved.priceRam : +(seedRam * OFFER_RATE.ram).toFixed(2);
            $('#off-gpu-price').value = saved.priceGpu != null ? saved.priceGpu : +gpuPrice().toFixed(2);
            const upd = reprice => {
                const cpu = +$('#off-cpu').value, ram = +$('#off-ram').value, gpu = $('#off-gpu').value;
                $('#off-cpu-val').textContent = cpu ? cpu + ' cores' : 'None';
                $('#off-ram-val').textContent = ram ? ram + ' GB' : 'None';
                // Re-suggest a price when the amount changes, unless the user
                // has hand-edited that field.
                if (reprice === 'cpu' && !$('#off-cpu-price').dataset.touched) $('#off-cpu-price').value = +(cpu * OFFER_RATE.cpu).toFixed(2);
                if (reprice === 'ram' && !$('#off-ram-price').dataset.touched) $('#off-ram-price').value = +(ram * OFFER_RATE.ram).toFixed(2);
                if (reprice === 'gpu' && !$('#off-gpu-price').dataset.touched) $('#off-gpu-price').value = +gpuPrice().toFixed(2);
                const pc = cpu ? (+$('#off-cpu-price').value || 0) : 0;
                const pr = ram ? (+$('#off-ram-price').value || 0) : 0;
                const pg = gpu ? (+$('#off-gpu-price').value || 0) : 0;
                $('#off-total').textContent = '$' + (pc + pr + pg).toFixed(2) + '/h';
                $('#off-summary').textContent = `$ cloudiy share --share-cpu ${cpu * 1000} --share-memory ${ram * 1024}` + (gpu ? '   # + ' + gpu : '');
            };
            $('#off-cpu').oninput = () => upd('cpu');
            $('#off-ram').oninput = () => upd('ram');
            $('#off-gpu').onchange = () => upd('gpu');
            ['#off-cpu-price', '#off-ram-price', '#off-gpu-price'].forEach(id =>
                $(id).addEventListener('input', () => { $(id).dataset.touched = '1'; upd(); }));
            upd();
            $('#off-go').onclick = () => {
                const cpu = +$('#off-cpu').value, ram = +$('#off-ram').value, gpu = $('#off-gpu').value;
                const priceCpu = cpu ? (+$('#off-cpu-price').value || 0) : 0;
                const priceRam = ram ? (+$('#off-ram-price').value || 0) : 0;
                const priceGpu = gpu ? (+$('#off-gpu-price').value || 0) : 0;
                const total = priceCpu + priceRam + priceGpu;
                if (!cpu && !ram && !gpu) { alert('Offer at least one part — CPU, RAM or a GPU.'); return; }
                if (!(total > 0)) { alert('Set a price for at least one offered part.'); return; }
                VM.offering = { cpu, ram, gpu, priceCpu, priceRam, priceGpu }; saveVM();
                const lines = [];
                if (cpu) lines.push(`${cpu} CPU cores — $${priceCpu.toFixed(2)}/h`);
                if (ram) lines.push(`${ram} GB RAM — $${priceRam.toFixed(2)}/h`);
                if (gpu) lines.push(`${gpu} — $${priceGpu.toFixed(2)}/h`);
                alert(`Parts announced to the network!\n\n${lines.join('\n')}\n\nTotal $${total.toFixed(2)}/hour · payouts in USDC\n\nBring this machine online:\ncloudiy share --share-cpu ${cpu * 1000} --share-memory ${ram * 1024}`);
            };
        }

        // ================= running apps (compute bursts) ==================

        async function x402Boot(logEl, app) {

            };

        // ================= Terminal =======================================
        // Gateway base: same-origin when CloudiyOS is served by `cloudiy os`
        // (http://127.0.0.1:4600), else the local gateway. WS derives from it.
        // A remote (Vercel) origin can't reach a local ws:// — the terminal
        // detects that and tells the user to run `cloudiy os --web-dir web`.
        const GW_HTTP = /^http:\/\/(127\.0\.0\.1|localhost)/.test(location.origin) ? location.origin : 'http://127.0.0.1:4600';
        const GW_WS = GW_HTTP.replace(/^http/, 'ws');

        // Persist the last provider node id + access code the user connected to.
        const conn = JSON.parse(localStorage.getItem('cloudiy_conn') || '{}');

        function openTerminal() {
            hideStart();
            const body = createWindow('term', 'Terminal', 'fa-terminal', 720);
            if (!body) return;
            body.innerHTML = `
                <div class="p-3 border-b border-zinc-800 flex flex-wrap items-center gap-2 bg-zinc-950/60">
                    <input class="t-node flex-1 min-w-[240px] bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-zinc-100 focus:outline-none focus:border-[#ccff33]" placeholder="provider Node ID (cloudiy share)">
                    <input class="t-tok w-40 bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs font-mono text-zinc-100 focus:outline-none focus:border-[#ccff33]" placeholder="access code">

            if (typeof Terminal === 'undefined') {
                status.textContent = 'terminal library failed to load (offline?)';
                return;
            }
            const term = new Terminal({
                fontSize: 13, cursorBlink: true, fontFamily: 'ui-monospace, Menlo, monospace',
                theme: { background: '#000000', foreground: '#e4e4e7', cursor: '#ccff33', selectionBackground: 'rgba(204,255,51,0.3)' }
            });
            const fit = new FitAddon.FitAddon(); term.loadAddon(fit);
            term.open(body.querySelector('.t-term')); setTimeout(() => { try { fit.fit(); } catch(e){} }, 30);
            term.writeln('\x1b[38;2;204;255;51mCloudiyOS\x1b[0m — enter a provider Node ID and Connect for a real shell.');
            term.writeln('\x1b[90m(the shell runs on the provider\'s hardware over P2P, via your local `cloudiy os` gateway)\x1b[0m');

            let ws = null;
            const setStatus = t => status.textContent = t;

            go.onclick = async () => {
                if (ws) { ws.close(); return; }

                catch (e) {
                    setStatus('no gateway');
                    term.writeln('\r\n\x1b[31m✗ local gateway not reachable at ' + GW_HTTP + '\x1b[0m');
                    term.writeln('  run:  \x1b[38;2;204;255;51mcloudiy os --web-dir web\x1b[0m  then open CloudiyOS at ' + GW_HTTP + '/vm.html');
                    return;
                }
                // 2) provision (idempotent — returns the existing VM if running)
                setStatus('provisioning VM…');
                term.writeln('\r\n\x1b[90m● provisioning your VM…\x1b[0m');
                const up = await fetch(GW_HTTP + '/api/vm/up', {
                    method: 'POST', headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ to: node, token: token || null, image: 'debian:12-slim', cpu: VM.cpu || 1, memory_mb: (VM.ram || 1) * 1024 })

                if (up.error) { setStatus('error'); term.writeln('\x1b[31m✗ ' + up.error + '\x1b[0m'); return; }
                if (up.payment_required) { setStatus('payment required'); term.writeln('\x1b[33mpayment required (x402) — provision via CLI with --x402-demo\x1b[0m'); return; }
                term.writeln('\x1b[38;2;204;255;51m● VM ' + up.state + ' — ' + up.image + ' · ' + (up.cpu_millis/1000) + ' vCPU · ' + up.memory_mib + ' MiB\x1b[0m');
                // 3) open the shell

                ws = new WebSocket(url); ws.binaryType = 'arraybuffer';
                setStatus('connecting…'); go.textContent = 'Disconnect';
                ws.onmessage = e => term.write(typeof e.data === 'string' ? e.data : new Uint8Array(e.data));

        // True when a local Cloudiy gateway (`cloudiy os`) is serving this page:

        (async () => {
            try {
                const r = await fetch('/api/id');
                GATEWAY_OK = r.ok && !!(await r.json()).id;
            } catch (e) { GATEWAY_OK = false; }
        })();

        let walletPubkey = null;
        window.addEventListener('load', async () => {
            const provider = window.phantom?.solana || window.solana;
            if (provider) {
                try { const r = await provider.connect({ onlyIfTrusted: true }); walletPubkey = r.publicKey.toString(); } catch (e) {}
            }
        });

        // ============ On-chain USDC escrow, signed in the browser ============
        // A faithful JS port of `create_job` from crates/cloudiy/src/solana.rs
        // (devnet-tested): identical PDA seeds, account order and instruction
        // data, against the deployed escrow program. Phantom signs; the wallet
        // never leaves the user. The provider verifies the Job on-chain (its
        // --require-payment mode) before running the workload.
        const ESCROW = {
            programId:         '9zMBC7JDA8SJ2mk3ATYqRuJvn14MQyZVg9q3XPnzc1TN',
            rpcUrl:            'https://api.devnet.solana.com',
            mint:              '7E2fxsgWJiXGyFtLuybzhEavKXPkuCXMyqdW8GaZegRw', // devnet USDC test mint
            tokenProgram:      'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA',
            assocTokenProgram: 'ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL',
            systemProgram:     '11111111111111111111111111111111',
        };
        const hasWeb3 = () => typeof solanaWeb3 !== 'undefined';
        function hexToBytes(hex) {
            hex = (hex || '').replace(/^0x/, '').trim();
            if (hex.length % 2) throw new Error('odd-length hex');
            const out = new Uint8Array(hex.length / 2);
            for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
            return out;
        }
        const bytesToHex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
        function writeIntLE(buf, off, value, bytes) {
            let v = BigInt(value);
            for (let i = 0; i < bytes; i++) { buf[off + i] = Number(v & 0xffn); v >>= 8n; }
        }
        async function anchorDiscriminator(name) {
            const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('global:' + name)));
            return hash.slice(0, 8);
        }
        function ataFor(owner, mint) {
            const w = solanaWeb3;
            return w.PublicKey.findProgramAddressSync(
                [owner.toBytes(), new w.PublicKey(ESCROW.tokenProgram).toBytes(), mint.toBytes()],
                new w.PublicKey(ESCROW.assocTokenProgram))[0];
        }
        // Lock `amountMicro` (micro-USDC) for a provider. `providerPayout` is the
        // provider's payout pubkey; `providerNodeKeyHex` its 32-byte node identity.
        async function escrowCreateJob({ providerPayout, providerNodeKeyHex, amountMicro, timeoutSecs = 3600 }) {
            if (!hasWeb3()) throw new Error('Solana web3 not loaded (offline?).');
            const w = solanaWeb3;
            const wallet = window.phantom?.solana || window.solana;
            if (!wallet) throw new Error('No Solana wallet found.');
            const { publicKey: consumer } = await wallet.connect();
            const programId = new w.PublicKey(ESCROW.programId);
            const provider = new w.PublicKey(providerPayout);
            const mint = new w.PublicKey(ESCROW.mint);
            const nodeKey = hexToBytes(providerNodeKeyHex);
            if (nodeKey.length !== 32) throw new Error('provider node key must be 32 bytes (64 hex chars).');
            const jobId = crypto.getRandomValues(new Uint8Array(16));
            const enc = new TextEncoder();
            const [job]   = w.PublicKey.findProgramAddressSync([enc.encode('job'), consumer.toBytes(), jobId], programId);
            const [vault] = w.PublicKey.findProgramAddressSync([enc.encode('vault'), job.toBytes()], programId);
            const consumerToken = ataFor(consumer, mint);
            // data = disc(8) ++ job_id(16) ++ amount(u64 LE) ++ timeout(i64 LE) ++ node_key(32)
            const disc = await anchorDiscriminator('create_job');
            const data = new Uint8Array(8 + 16 + 8 + 8 + 32);
            let o = 0;
            data.set(disc, o); o += 8;
            data.set(jobId, o); o += 16;
            writeIntLE(data, o, amountMicro, 8); o += 8;
            writeIntLE(data, o, timeoutSecs, 8); o += 8;
            data.set(nodeKey, o);
            const keys = [
                { pubkey: consumer,     isSigner: true,  isWritable: true  },
                { pubkey: provider,     isSigner: false, isWritable: false },
                { pubkey: mint,         isSigner: false, isWritable: false },
                { pubkey: job,          isSigner: false, isWritable: true  },
                { pubkey: vault,        isSigner: false, isWritable: true  },
                { pubkey: consumerToken, isSigner: false, isWritable: true },
                { pubkey: new w.PublicKey(ESCROW.tokenProgram),  isSigner: false, isWritable: false },
                { pubkey: new w.PublicKey(ESCROW.systemProgram), isSigner: false, isWritable: false },
            ];
            const ix = new w.TransactionInstruction({ programId, keys, data });
            const conn = new w.Connection(ESCROW.rpcUrl, 'confirmed');
            const { blockhash, lastValidBlockHeight } = await conn.getLatestBlockhash();
            const tx = new w.Transaction({ feePayer: consumer, blockhash, lastValidBlockHeight });
            tx.add(ix);
            const sent = await wallet.signAndSendTransaction(tx);
            const signature = sent.signature || sent;
            await conn.confirmTransaction({ signature, blockhash, lastValidBlockHeight }, 'confirmed');
            return { jobAccount: job.toBase58(), jobId: bytesToHex(jobId), signature };
        }

        // Ask the gateway for a real provider to pay (payout + node key + mint +
        // price). Returns null when no gateway or no field — the deposit modal
        // then lets the user fill a devnet target by hand.
        async function gatewayProvider(epKey) {
            if (!GATEWAY_OK) return null;
            try {
                const r = await fetch('/api/providers');
                if (!r.ok) return null;
                const list = await r.json();
                const p = Array.isArray(list) ? list[0] : (list.providers || [])[0];
                if (!p) return null;
                return {
                    payout: p.payout || p.payout_pubkey || p.wallet || '',
                    nodeKey: p.node_key || p.node_key_hex || p.id_hex || '',
                    price: p.price ?? null,
                };
            } catch (e) { return null; }
        }

        // Per-endpoint escrow session the user has funded (key -> {jobAccount…}).
        VM.sessions = VM.sessions || {};
        // A small modal: connect wallet, confirm amount + provider, sign create_job.
        async function openEscrowDeposit(ep) {
            const body = createWindow('escrow-' + (ep.key || 'x'), 'Deposit USDC · escrow', 'fa-lock', 460);
            if (!body) return;
            const gp = await gatewayProvider(ep.key);
            const price = ep && ep.price ? ep.price : 0.05;
            const suggested = Math.max(price * 20, 0.10); // ~20 requests of headroom
            body.innerHTML = `
                <p class="text-xs text-zinc-500 mb-4">Lock USDC in the on-chain escrow (devnet). The provider verifies the deposit before running, and you release payment as you consume. Phantom signs — your keys never leave the wallet.</p>
                <label class="text-[11px] text-zinc-400 block mb-1">Amount to deposit (USDC)</label>
                <input id="esc-amt" type="number" min="0" step="0.01" value="${suggested.toFixed(2)}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm font-mono mb-3 focus:outline-none focus:border-[#ccff33]">
                <label class="text-[11px] text-zinc-400 block mb-1">Provider payout address</label>
                <input id="esc-prov" placeholder="provider USDC wallet (base58)" value="${gp?.payout || ''}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs font-mono mb-3 focus:outline-none focus:border-[#ccff33]">
                <label class="text-[11px] text-zinc-400 block mb-1">Provider node key <span class="text-zinc-600">(64 hex)</span></label>
                <input id="esc-node" placeholder="32-byte node identity, hex" value="${gp?.nodeKey || ''}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs font-mono mb-4 focus:outline-none focus:border-[#ccff33]">
                <button id="esc-go" class="w-full py-3 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-xl text-sm">Sign & deposit with Phantom</button>
                <div id="esc-out" class="text-[11px] font-mono mt-4"></div>
                <p class="text-[10px] text-zinc-600 mt-3"><i class="fa-solid fa-circle-info mr-1"></i>Devnet. Program <span class="text-zinc-400">9zMB…c1TN</span>, mint <span class="text-zinc-400">7E2f…egRw</span>. Get devnet USDC from a faucet first.</p>`;
            const out = body.querySelector('#esc-out');
            body.querySelector('#esc-go').onclick = async () => {
                const amount = parseFloat(body.querySelector('#esc-amt').value);
                const providerPayout = body.querySelector('#esc-prov').value.trim();
                const providerNodeKeyHex = body.querySelector('#esc-node').value.trim();
                if (!(amount > 0)) { out.innerHTML = '<span class="text-rose-400">Set an amount.</span>'; return; }
                if (!providerPayout || !providerNodeKeyHex) { out.innerHTML = '<span class="text-rose-400">Provider payout and node key are required.</span>'; return; }
                out.innerHTML = '<span class="text-zinc-400">Awaiting Phantom signature…</span>';
                try {
                    const r = await escrowCreateJob({
                        providerPayout, providerNodeKeyHex,
                        amountMicro: Math.round(amount * 1e6),
                    });
                    if (ep && ep.key) { VM.sessions[ep.key] = { jobAccount: r.jobAccount, jobId: r.jobId, remaining: amount }; saveVM(); }
                    out.innerHTML = `<span class="text-[#ccff33]">✓ Deposited $${amount.toFixed(2)} USDC</span>`
                        + `<div class="text-zinc-500 mt-1 break-all">job ${r.jobAccount}</div>`
                        + `<div class="text-zinc-500 break-all">tx ${r.signature}</div>`
                        + `<a class="text-[#ccff33] hover:text-white" target="_blank" href="https://explorer.solana.com/tx/${r.signature}?cluster=devnet">view on explorer →</a>`;
                } catch (e) {
                    out.innerHTML = `<span class="text-rose-400">⚠ ${(e.message || e).toString().replace(/</g, '&lt;')}</span>`;
                }
            };
        }

        // ================= boot ===========================================
        (async () => {
            const bar = document.getElementById('boot-bar'), msg = document.getElementById('boot-msg');
            const steps = [
                ['mounting encrypted volume…', 30],
                ['verifying identity…', 55],
                [`restoring ${VM.installed.length} installed image${VM.installed.length === 1 ? '' : 's'}…`, 80],
                ['connecting to compute network…', 100],
            ];
            for (const [m, p] of steps) { msg.textContent = m; bar.style.width = p + '%'; await sleep(380); }
            document.getElementById('boot').style.transition = 'opacity .4s';
            document.getElementById('boot').style.opacity = '0';
            setTimeout(() => document.getElementById('boot').remove(), 450);
            showLogin();
        })();

        // ---------- login: the machine unlocks with a Solana identity ------
        function showLogin() {
            document.getElementById('login-vm').textContent = 'vm://' + VM.name;
            if (walletPubkey) {
                // Wallet already trusted this site: one click to enter.
                document.getElementById('login-avatar').src =
                    'https://api.dicebear.com/7.x/identicon/svg?seed=' + walletPubkey;
                document.getElementById('login-hint').textContent = 'Welcome back.';
                document.getElementById('login-btn').innerHTML =
                    `<i class="fa-solid fa-wallet mr-2"></i>Enter as ${walletPubkey.slice(0, 4)}…${walletPubkey.slice(-4)}`;
            }
            const login = document.getElementById('login');
            login.classList.remove('hidden');
            login.classList.add('flex');
        }

        async function loginConnect() {
            if (walletPubkey) { enterDesktop(); return; }
            const provider = window.phantom?.solana || window.solana;
            if (provider) {
                try {
                    const resp = await provider.connect();
                    walletPubkey = resp.publicKey.toString();
                    try { localStorage.setItem('cloudiy_wallet', walletPubkey); } catch (e) {}
                    enterDesktop();
                } catch (err) {
                    console.warn('Wallet connection rejected:', err);
                }
                return;
            }
            if (confirm('No Solana wallet detected.\n\nOK: install Phantom\nCancel: continue in demo mode')) {
                window.open('https://phantom.com/', '_blank');
            } else {
                loginDemo();
            }
        }

        function loginDemo() {
            walletPubkey = 'DemoWa11etCLoUD1Yxxxxxxxxxxxxxxxxxxxxxxxxxxx';
            enterDesktop();
        }

        function enterDesktop() {
            const login = document.getElementById('login');
            login.style.transition = 'opacity .35s';
            login.style.opacity = '0';
            setTimeout(() => login.remove(), 400);
            document.getElementById('vm-chip').textContent =
                'vm://' + VM.name + ' · ' + walletPubkey.slice(0, 4) + '…' + walletPubkey.slice(-4);
            renderDesktop();
        }
    </script>
</body>
</html>
