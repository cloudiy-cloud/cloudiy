<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Machine • Cloudiy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ccff33'/%3E%3Cpath fill='%23000' d='M22.5 22h-11a4.5 4.5 0 0 1-.7-8.95 6 6 0 0 1 11.53 1.62A3.94 3.94 0 0 1 22.5 22z'/%3E%3C/svg%3E">
    <!-- Third-party scripts are pinned to exact versions and carry Subresource
         Integrity hashes: this is the origin that connects the wallet and
         builds the signed escrow transaction, so a CDN compromise or MITM must
         not be able to swap the code. (Tailwind's CDN is an unversioned dev
         build with no stable hash — replace with a compiled stylesheet before
         a production launch; see docs/SECURITY-AUDIT.md.) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Real terminal emulator for the live VM shell (via the `cloudiy os` gateway) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
            integrity="sha384-J4qzUjBl1FxyLsl/kQPQIOeINsmp17OHYXDOMpMxlKX53ZfYsL+aWHpgArvOuof9" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
            integrity="sha384-XGqKrV8Jrukp1NITJbOEHwg01tNkuXr6uB6YEj69ebpYU3v7FvoGgEg23C1Gcehk" crossorigin="anonymous"></script>
    <!-- Solana web3 for wallet-signed USDC escrow (create_job) in the browser.
         Deferred so a slow/unavailable CDN can never block the app from booting. -->
    <script defer src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.min.js"
            integrity="sha384-ujeTtvHxhu2g5lnu14Roii2ajvVKJ74KQ6eo6GGfAi0IrKZ1YkF8N68Iw5VmIJO0" crossorigin="anonymous"></script>
    <!-- QR code generator for the wallet's Receive page (renders locally; the
         public address never leaves the browser). -->
    <script defer src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
        /* Fluorescent-green scrollbars with black borders, OS-wide */
        * { scrollbar-width: thin; scrollbar-color: #ccff33 #000; }
        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-track { background: #000; border-radius: 8px; }
        *::-webkit-scrollbar-thumb { background: #ccff33; border: 2px solid #000; border-radius: 8px; }
        *::-webkit-scrollbar-thumb:hover { background: #e2ff70; }
        *::-webkit-scrollbar-corner { background: #000; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
        .desktop-icon { transition: background 0.15s ease; }
        .desktop-icon:hover { background: rgba(204, 255, 51, 0.08); }
        .vm-window { box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7); }
        /* Marketplace card aesthetic inside the Hardware Store */
        .gpu-card { transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1); }
        .gpu-card:hover { transform: translateY(-3px); box-shadow: 0 0 20px rgba(204,255,51,0.2); }
        .gpu-canvas { border-radius: 14px; background: #111; }
        .titlebar { cursor: grab; user-select: none; }
        .titlebar:active { cursor: grabbing; }
        /* Resize handles: 4 edges + 4 corners. They straddle the window border
           (a few px outside, a few in) so hovering the visible edge changes the
           cursor. The window no longer clips overflow, so titlebar/body carry
           the rounded corners instead. Corners win via higher z-index. */
        .win-handle { position: absolute; z-index: 40; }
        .wh-n  { top: -4px; left: 16px; right: 16px; height: 10px; cursor: n-resize; }
        .wh-s  { bottom: -4px; left: 16px; right: 16px; height: 10px; cursor: s-resize; }
        .wh-e  { right: -4px; top: 16px; bottom: 16px; width: 10px; cursor: e-resize; }
        .wh-w  { left: -4px; top: 16px; bottom: 16px; width: 10px; cursor: w-resize; }
        .wh-ne { top: -4px; right: -4px; width: 20px; height: 20px; cursor: ne-resize; z-index: 41; }
        .wh-nw { top: -4px; left: -4px; width: 20px; height: 20px; cursor: nw-resize; z-index: 41; }
        .wh-se { bottom: -4px; right: -4px; width: 22px; height: 22px; cursor: se-resize; z-index: 41; }
        .wh-sw { bottom: -4px; left: -4px; width: 20px; height: 20px; cursor: sw-resize; z-index: 41; }
        /* Store card grid: fills as many columns as the window width allows
           (2 in a small window, more as it grows / maximizes) and the cards
           flex in size with it. Responds to the window, not the viewport. */
        .hw-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        #wallpaper {
            background:
                radial-gradient(ellipse at 70% 20%, rgba(204,255,51,0.07), transparent 55%),
                radial-gradient(ellipse at 20% 85%, rgba(204,255,51,0.05), transparent 50%),
                linear-gradient(160deg, #09090b 0%, #101012 55%, #0b0d08 100%);
        }
        @keyframes bootpulse { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
        .bootpulse { animation: bootpulse 1.2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-black text-white h-screen">

    <!-- Boot screen -->
    <!-- Login (after loading): connect a Solana wallet to enter -->
    <div id="login" class="fixed inset-0 z-[190] bg-black hidden flex-col items-center justify-center" style="background: radial-gradient(ellipse at 50% 30%, rgba(204,255,51,0.06), transparent 60%), #000;">
        <div class="w-full max-w-sm mx-4 text-center">

            <div class="bg-zinc-900/80 border border-zinc-800 rounded-3xl p-6">

    <div id="boot" class="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center">

    <script>
        // ================= VM state — the machine IS this state ==========
        // Persisted per user (localStorage stands in for the encrypted,
        // replicated network volume). No provider ever hosts the VM: state
        // lives outside providers; compute bursts onto the network per run.
        const VM_KEY = 'cloudiy_vm_v1';
        function loadVM() {
            try {
                const vm = JSON.parse(localStorage.getItem(VM_KEY) || 'null');
                if (vm && Array.isArray(vm.installed)) {
                    vm.installed = [...new Set(vm.installed)];
                    if (!Array.isArray(vm.parts)) vm.parts = [];
                    if (!Array.isArray(vm.warm)) vm.warm = [];
                    if (!vm.samples || typeof vm.samples !== 'object') vm.samples = {};
                    return vm;
                }
            } catch (e) {}
            return {
                name: 'vm-' + Math.random().toString(36).slice(2, 8),
                created: new Date().toISOString(),
                cpu: 8, ram: 32, vram: 24, disk: 50,
                installed: [],
                parts: [],   // hardware attached from the Hardware Store
                warm: [],    // endpoints already provisioned on a node (cold start done)
                samples: {}, // key → { type, src }: real outputs a model generated,
                             // reused as that endpoint's thumbnail (never copied art)
            };
        }
        function saveVM() { try { localStorage.setItem(VM_KEY, JSON.stringify(VM)); } catch (e) {} }
        const VM = loadVM(); saveVM();

        // ================= app catalog (docker images) ====================
        const APP_CATS = [
            { key: 'image',     name: 'Image' },
            { key: 'video',     name: 'Video' },
            { key: 'audio',     name: 'Audio' },
            { key: 'language',  name: 'Language' },
            { key: 'embedding', name: 'Embedding' },
            { key: 'dev',       name: 'Dev' },
        ];
        const APPS = [
            // Image
            { key: 'comfyui',   cat: 'image',     name: 'ComfyUI',                icon: 'fa-image',        image: 'ghcr.io/comfyanonymous/comfyui',                size: 6.4, kind: 'image', version: '5.8.6',  pub: 'cloudiy-workers', stars: 710,  desc: 'Generate images with ComfyUI using FLUX.1-dev (fp8).' },
            { key: 'sdxl',      cat: 'image',     name: 'SDXL (Stable Diffusion XL)', icon: 'fa-wand-magic-sparkles', image: 'cloudiy/worker-sdxl',           size: 8.2, kind: 'image', version: '2.1.1',  pub: 'cloudiy-workers', stars: 443,  desc: 'Generate images with Stable Diffusion XL.' },
            { key: 'esrgan',    cat: 'image',     name: 'Real-ESRGAN (Upscaler)', icon: 'fa-up-right-and-down-left-from-center', image: 'cloudiy/worker-esrgan', size: 1.4, kind: 'image', version: '2.0.5',  pub: 'community',       stars: 126,  desc: 'High-performance image upscaling worker.' },
            // Video
            { key: 'wan',       cat: 'video',     name: 'Wan 2.2 with LoRA',      icon: 'fa-clapperboard', image: 'cloudiy/worker-wan22',                          size: 12.8, kind: 'image', version: '1.1.0', pub: 'community',      stars: 232,  desc: 'Generate high-quality videos from images with natural motion. Up to 3 LoRA pairs.' },
            { key: 'ltx',       cat: 'video',     name: 'LTX-Video',              icon: 'fa-film',         image: 'cloudiy/worker-ltx-video',                      size: 9.6,  kind: 'image', version: '0.9.7', pub: 'cloudiy-workers', stars: 187,  desc: 'Real-time text-to-video generation, 5-second clips.' },
            // Audio
            { key: 'whisper',   cat: 'audio',     name: 'Whisper Large v3',       icon: 'fa-microphone',   image: 'onerahmet/openai-whisper-asr-webservice',       size: 2.8,  kind: 'audio', version: '1.9.2', pub: 'cloudiy-workers', stars: 341,  desc: 'Speech-to-text inference in 100 languages, word-level timestamps.' },
            { key: 'musicgen',  cat: 'audio',     name: 'MusicGen',               icon: 'fa-music',        image: 'cloudiy/worker-musicgen',                       size: 4.1,  kind: 'audio', version: '1.2.0', pub: 'community',       stars: 158,  desc: 'Text-to-music generation, 15-second clips.' },
            // Language
            { key: 'vllm',      cat: 'language',  name: 'vLLM',                   icon: 'fa-bolt-lightning', image: 'cloudiy/worker-vllm',                         size: 7.9,  kind: 'chat',  version: '2.22.5', pub: 'cloudiy-workers', stars: 455, desc: 'Deploy OpenAI-compatible blazing-fast LLM endpoints powered by vLLM.' },
            { key: 'ollama',    cat: 'language',  name: 'Ollama Worker',          icon: 'fa-robot',        image: 'ollama/ollama',                                  size: 1.9,  kind: 'chat',  version: '0.30.8', pub: 'community',      stars: 296,  desc: 'A serverless Ollama worker — chat with Llama, Qwen, Mistral…' },

            // Embedding
            { key: 'infinity',  cat: 'embedding', name: 'Infinity Embedding',     icon: 'fa-diagram-project', image: 'cloudiy/worker-infinity',                    size: 3.4,  kind: 'shell', version: '1.1.4', pub: 'cloudiy-workers', stars: 147,  desc: 'High-throughput, OpenAI-compatible text embedding & reranker.' },
            // Dev environments
            { key: 'pytorch',   cat: 'dev',       name: 'PyTorch',                icon: 'fa-fire',         image: 'pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime', size: 7.1,  kind: 'shell', version: '2.4.0', pub: 'cloudiy-workers', stars: 389,  desc: 'CUDA notebook / training environment.' },
            { key: 'jupyter',   cat: 'dev',       name: 'Jupyter',                icon: 'fa-book',         image: 'jupyter/scipy-notebook',                         size: 3.2,  kind: 'shell', version: '7.2.1', pub: 'community',       stars: 204,  desc: 'Notebooks with the scipy stack.' },
            { key: 'node',      cat: 'dev',       name: 'Node.js',                icon: 'fa-node-js',      image: 'node:22-slim',                                   size: 0.2,  kind: 'shell', version: '22.11', pub: 'community',       stars: 92,   desc: 'JavaScript runtime environment.' },
            { key: 'postgres',  cat: 'dev',       name: 'Postgres',               icon: 'fa-database',     image: 'postgres:16',                                    size: 0.4,  kind: 'svc',   version: '16.4',  pub: 'community',       stars: 171,  desc: 'Relational database service.' },
            { key: 'ffmpeg',    cat: 'dev',       name: 'FFmpeg',                 icon: 'fa-sliders',      image: 'linuxserver/ffmpeg',                             size: 0.6,  kind: 'shell', version: '7.0.2', pub: 'community',       stars: 88,   desc: 'Video/audio transcoding toolbox.' },
            { key: 'ubuntu',    cat: 'dev',       name: 'Ubuntu',                 icon: 'fa-cube',         image: 'ubuntu:24.04',                                   size: 0.1,  kind: 'shell', version: '24.04', pub: 'cloudiy-workers', stars: 512,  desc: 'Ubuntu 24.04 LTS base environment.' },
            { key: 'filebrowser', cat: 'dev',     name: 'File Browser',           icon: 'fa-folder-open',  image: 'filebrowser/filebrowser:v2.63.5',                size: 0.09, kind: 'shell', version: '2.63.5', pub: 'cloudiy-workers', stars: 264, desc: 'Web file manager for your network volume.' },
        ];
        const appOf = k => APPS.find(a => a.key === k);
        let storeCat = 'all', storeQuery = '', storeSort = 'popular';

        // Official brand marks via Simple Icons (CC0 icon collection), used
        // wherever an app has one; the rest keep their generic glyph. Rendered
        // white so every logo stays legible on the dark theme.
        const APP_LOGO = {
            // Simple Icons slugs (CC0) — rendered as monochrome white marks.
            ollama: 'ollama', whisper: 'openai', vllm: 'vllm',
            pytorch: 'pytorch', jupyter: 'jupyter', node: 'nodedotjs',
            postgres: 'postgresql', ffmpeg: 'ffmpeg', ubuntu: 'ubuntu',
            filebrowser: 'files',
            // Full-color official logos served from each project's own repo
            // (jsDelivr) or its official org avatar. Every URL was verified to
            // return a real image. Where a project ships no square logo of its
            // own, its parent brand's official mark is used.
            comfyui:  'https://avatars.githubusercontent.com/u/166579949?v=4',              // Comfy-Org mark
            esrgan:   'https://cdn.jsdelivr.net/gh/xinntao/Real-ESRGAN@master/assets/realesrgan_logo.png',
            wan:      'https://cdn.jsdelivr.net/gh/Wan-Video/Wan2.2@main/assets/logo.png',
            axolotl:  'https://cdn.jsdelivr.net/gh/axolotl-ai-cloud/axolotl@main/image/axolotl_symbol_digital_white.svg',
            sdxl:     'https://cdn-avatars.huggingface.co/v1/production/uploads/643feeb67bc3fbde1385cc25/7vmYr2XwVcPtkLzac_jxQ.png', // Stability AI
            ltx:      'https://cdn-avatars.huggingface.co/v1/production/uploads/669524bcbcd81f395e8f60f6/0ynfqKEWMh_dn3h4ff1K5.png', // Lightricks
            musicgen: 'https://avatars.githubusercontent.com/u/16943930?v=4',               // Meta Research
            infinity: 'https://avatars.githubusercontent.com/u/63565275?v=4',               // Infinity maintainer
        };
        /// Icon markup for an app: the official logo `<img>`. The APP_LOGO value
        /// is either a full logo URL (used as-is) or a Simple Icons slug (built
        /// into a white monochrome mark). `imgSize` sizes the logo; a rare load
        /// failure falls back to the app's white FA glyph.
        function appGlyph(app, imgSize, faSize) {
            const logo = APP_LOGO[app.key];
            if (logo) {
                const src = logo.startsWith('http') ? logo : `https://cdn.simpleicons.org/${logo}/ffffff`;
                return `<img src="${src}" alt="${app.name}" `
                    + `class="${imgSize} object-contain" `
                    + `onerror="this.outerHTML='&lt;i class=\\'fa-solid ${app.icon} text-white ${faSize || ''}\\'&gt;&lt;/i&gt;'">`;
            }
            return `<i class="fa-solid ${app.icon} text-white ${faSize || ''}"></i>`;
        }
        let hubTab = 'templates'; // 'templates' | 'repos' | 'endpoints'

        // Pod Templates: preconfigured environments deployed in one click.
        // Tier mirrors who maintains them — Cloudiy (official), a verified
        // publisher, or the community.
        const TPL_TIERS = [
            { key: 'all',       name: 'All' },
            { key: 'official',  name: 'Official' },
            { key: 'verified',  name: 'Verified' },
            { key: 'community', name: 'Community' },
        ];
        const TIER_META = {
            official:  { name: 'Official',  icon: 'fa-circle-check',  cls: 'text-[#ccff33] border-[#ccff33]/40 bg-[#ccff33]/10' },
            verified:  { name: 'Verified',  icon: 'fa-shield-halved', cls: 'text-sky-400 border-sky-400/40 bg-sky-400/10' },
            community: { name: 'Community', icon: 'fa-users',         cls: 'text-zinc-400 border-zinc-700 bg-zinc-900' },
        };
        let storeTier = 'all';
        // `apps` are catalog keys — deploying a template pulls every image in
        // order and installs them to the VM volume.
        // Templates deploy base environments / dev pods. Their images are kept
        // DISJOINT from Serverless Repos (REPOS): every app key used here is an
        // environment image, never a model-worker image, so no picture appears
        // in both tabs.
        // Each template carries detail-page content (base label, what's
        // included, specs) so clicking a card opens a full page in the same
        // window, like the reference Pod Template layout. `group` clusters
        // siblings shown under "All templates in this group".
        const TEMPLATES = [
            // Official — maintained by Cloudiy
            { key: 'tpl-ubuntu', tier: 'official', apps: ['ubuntu'], name: 'Cloudiy Ubuntu 24.04', pub: 'cloudiy', deploys: 15302,
              desc: 'Official Ubuntu 24.04 LTS base template.', group: 'base', base: 'Cloudiy Base 1.0.2', version: '1.0.2', compute: 'CPU', disk: '10 GB', updated: '14 hours ago',
              intro: 'This template includes Ubuntu 24.04. JupyterLab is enabled by default, but you can disable it by setting `JUPYTER_PASSWORD` to an empty string when you deploy your pod.',

            const closeBtn = mkBtn('<i class="fa-solid fa-xmark"></i>', 'hover:bg-rose-500/20 hover:text-rose-400', 'Close');
            minBtn.onclick = e => { e.stopPropagation(); minimizeWindow(id); };
            maxBtn.onclick = e => { e.stopPropagation(); toggleMaximize(id); };
            closeBtn.onclick = e => { e.stopPropagation(); closeWindow(id); };
            controls.append(minBtn, maxBtn, closeBtn);
            bar.appendChild(controls);
            win.appendChild(bar);

            const body = document.createElement('div');
            body.className = (opts.plain ? 'overflow-hidden' : 'p-5 overflow-y-auto') + ' flex-1 min-h-0 rounded-b-2xl';
            if (opts.height) body.style.height = Math.min(opts.height, window.innerHeight - 170) + 'px';
            win.appendChild(body);

            // -- move (disabled while maximized; double-click toggles) ------
            bar.addEventListener('mousedown', e => {
                if (e.target.closest('button')) return;
                focusWindow(id);
                if (openWindows[id]?.maximized) return;
                openWindows[id].userTouched = true;
                const start = { dx: e.clientX - win.offsetLeft, dy: e.clientY - win.offsetTop };
                dragOperation(ev => {
                    win.style.left = Math.max(0, ev.clientX - start.dx) + 'px';
                    win.style.top = Math.max(0, Math.min(ev.clientY - start.dy, window.innerHeight - TASKBAR_H - 40)) + 'px';
                });
            });
            bar.addEventListener('dblclick', e => {
                if (e.target.closest('button')) return;
                toggleMaximize(id);
            });
            win.addEventListener('mousedown', () => focusWindow(id));

            // -- resize handles: 4 edges + 4 corners -------------------------
            [['n','wh-n'],['s','wh-s'],['e','wh-e'],['w','wh-w'],
             ['ne','wh-ne'],['nw','wh-nw'],['se','wh-se'],['sw','wh-sw']].forEach(([dir, cls]) => {
                const h = document.createElement('div');
                h.className = 'win-handle ' + cls;
                h.addEventListener('mousedown', e => {
                    e.preventDefault(); e.stopPropagation();
                    if (openWindows[id]?.maximized) return;
                    focusWindow(id);
                    openWindows[id].userTouched = true;
                    lockSize(win);
                    const start = {
                        x: e.clientX, y: e.clientY,
                        l: win.offsetLeft, t: win.offsetTop,
                        w: win.offsetWidth, h: win.offsetHeight,
                    };
                    dragOperation(ev => {
                        const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
                        let l = start.l, t = start.t, w2 = start.w, h2 = start.h;
                        if (dir.includes('e')) w2 = start.w + dx;
                        if (dir.includes('s')) h2 = start.h + dy;
                        if (dir.includes('w')) { w2 = start.w - dx; l = start.l + dx; }
                        if (dir.includes('n')) { h2 = start.h - dy; t = start.t + dy; }
                        if (w2 < MIN_W) { if (dir.includes('w')) l -= MIN_W - w2; w2 = MIN_W; }
                        if (h2 < MIN_H) { if (dir.includes('n')) t -= MIN_H - h2; h2 = MIN_H; }
                        win.style.left = l + 'px';
                        win.style.top = Math.max(0, t) + 'px';
                        win.style.width = w2 + 'px';
                        win.style.height = h2 + 'px';
                    });
                });
                win.appendChild(h);
            });

            // Born invisible: the window is positioned only after callers
            // fill the body (real height known). Revealing it then removes
            // the top-left flash that a visible-but-unpositioned window causes.
            win.style.visibility = 'hidden';
            document.getElementById('windows').appendChild(win);
            const cascade = ((winCount - 1) % 5) * 24;
            setTimeout(() => {
                centerWindow(id, cascade);
                win.style.visibility = '';
            }, 0);
            openWindows[id] = { el: win, title, icon, minimized: false, maximized: false, prevRect: null, maxBtn };
            renderTaskbar();
            return body;
        }

        function viewportSize() {
            return {
                w: window.innerWidth || document.documentElement.clientWidth || 1280,
                h: window.innerHeight || document.documentElement.clientHeight || 800,
            };
        }
        function centerWindow(id, cascade = 0) {
            const w = openWindows[id];
            if (!w || w.maximized || w.minimized) return;
            const vp = viewportSize();
            w.cascade = cascade || w.cascade || 0;
            w.el.style.left = Math.max(8, (vp.w - w.el.offsetWidth) / 2 + w.cascade) + 'px';
            w.el.style.top = Math.max(8, (vp.h - TASKBAR_H - w.el.offsetHeight) / 2 + w.cascade) + 'px';
        }
        // Windows the user hasn't repositioned stay centered on viewport
        // changes (also fixes environments that lay out after first paint).
        window.addEventListener('resize', () => {
            Object.entries(openWindows).forEach(([id, w]) => {
                if (!w.userTouched) centerWindow(id);
            });
        });

        function focusWindow(id) { const w = openWindows[id]; if (w) w.el.style.zIndex = ++zTop; }
        // Focus a field just after the window is revealed (windows are born
        // visibility:hidden and centered on the next tick — focusing before
        // that no-ops), so text/terminal windows are ready to type into.
        const focusSoon = el => setTimeout(() => { try { el && el.focus(); } catch (e) {} }, 70);
        function closeWindow(id) { const w = openWindows[id]; if (!w) return; w.el.remove(); delete openWindows[id]; renderTaskbar(); }

        function minimizeWindow(id) {
            const w = openWindows[id]; if (!w) return;
            w.minimized = true;
            w.el.style.display = 'none';
            renderTaskbar();
        }
        function restoreWindow(id) {
            const w = openWindows[id]; if (!w) return;
            if (w.minimized) { w.minimized = false; w.el.style.display = ''; }
            focusWindow(id);
            renderTaskbar();
        }
        function toggleMaximize(id) {
            const w = openWindows[id]; if (!w) return;
            const win = w.el;
            if (!w.maximized) {
                lockSize(win);
                w.prevRect = {
                    left: win.style.left, top: win.style.top,
                    width: win.style.width, height: win.style.height,
                };
                win.style.left = '8px';
                win.style.top = '8px';
                win.style.width = (window.innerWidth - 16) + 'px';
                win.style.height = (window.innerHeight - TASKBAR_H - 16) + 'px';
                w.maximized = true;
                w.maxBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                w.maxBtn.setAttribute('aria-label', 'Restore');
            } else {
                Object.assign(win.style, w.prevRect);
                w.maximized = false;
                w.maxBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                w.maxBtn.setAttribute('aria-label', 'Maximize');
            }
            focusWindow(id);
        }

        function renderTaskbar() {
            const bar = document.getElementById('taskbar-apps');
            bar.innerHTML = '';
            Object.entries(openWindows).forEach(([id, w]) => {
                const b = document.createElement('button');
                b.className = w.minimized
                    ? 'px-3 py-1.5 rounded-xl bg-zinc-950 border border-zinc-800 text-xs text-zinc-500 hover:border-[#ccff33]/50 whitespace-nowrap'
                    : 'px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-700 text-xs hover:border-[#ccff33]/50 whitespace-nowrap';
                b.innerHTML = `<i class="fa-solid ${w.icon} ${w.minimized ? 'text-zinc-600' : 'text-[#ccff33]'} mr-1.5"></i>${w.title}`;
                b.onclick = () => w.minimized ? restoreWindow(id) : (minimizeWindow(id));
                bar.appendChild(b);
            });
        }

        // ================= desktop icons ==================================
        function desktopIcon(icon, label, onclick, app) {

        // ================= My Virtual Machine =============================
        function openMyVM() {
            hideStart();

            // Hardware Store, per resource kind.
            const all = VM.parts.map(partOf).filter(Boolean);
            const attached = kindKey => all.filter(p => p.kind === kindKey);
            // Base = current spec minus everything attached (parts AND whole
            // machines), so a rented machine never inflates the "base" chip.
            const sumField = field => all.reduce((s, p) => s + (p.add[field] || 0), 0);
            const chip = (label, accent) =>

            // A whole machine contributes to several categories at once; show it

                <div class="text-[10px] tracking-widest text-zinc-500 mb-2">COMPUTE POWER · SELECTED BY YOU</div>
                <div class="grid sm:grid-cols-2 gap-3 mb-4">
                    ${catCard('fa-microchip', 'COMPUTE', VM.cpu, 'vCPU',
                        chip(`base ${baseCpu} vCPU`) + cpuParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('cpu', 'vCPU'))}
                    ${catCard('fa-memory', 'MEMORY', VM.ram, 'GB',
                        chip(`base ${baseRam} GB`) + ramParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('ram', 'GB'))}
                    ${catCard('fa-bolt', 'GRAPHICS', VM.vram, 'GB VRAM',
                        (baseVram > 0 ? chip(`base ${baseVram} GB`) : (gpuParts.length || machines.some(m => m.add.vram) ? '' : chip('no GPU — attach one')))
                        + gpuParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('vram', 'GB'))}
                    ${catCard('fa-hard-drive', 'STORAGE', VM.disk, 'GB',
                        chip(`base ${baseDisk} GB`) + diskParts.map(p => chip(`${p.name} · $${p.price.toFixed(2)}/h`, true)).join('') + mChip('disk', 'GB'))}
                </div>

                <div class="mb-1 flex justify-between text-xs text-zinc-400"><span>Volume usage (${VM.installed.length} images)</span><span class="font-mono">${used.toFixed(1)} / ${VM.disk} GB</span></div>
                <div class="h-2 bg-zinc-950 border border-zinc-800 rounded-full overflow-hidden">

            const search = body.querySelector('#store-search');

        function renderStoreGrid(body) {

            let items;

                if (storeSort === 'name')    items = [...items].sort((a, b) => (a.vendor + a.model).localeCompare(b.vendor + b.model));

                items.forEach(ep => grid.appendChild(endpointCard(ep)));

        // Keyless community inference relay (pollinations.ai) — free tier, no
        // signup. Used as the image fallback when no local `cloudiy os`
        // gateway is serving real network inference, so image endpoints
        // generate for real even on the static deploy. Loaded as an <img>
        // subresource: the relay Turnstile-blocks scripted fetch() but serves
        // plain tag loads.
        const RELAY_IMG = 'https://image.pollinations.ai/prompt/';

        // --- Untrusted-string guards -------------------------------------
        // Model endpoints and provider announcements come from remote nodes
        // over the gateway; anything from them that lands in the DOM must be
        // treated as hostile. `escAttr` neutralizes an HTML-attribute break-out;
        // `safeMediaUrl` allows only http(s)/data URLs free of markup chars.
        function escAttr(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function safeMediaUrl(u) {
            if (typeof u !== 'string' || u.length > 2048) return false;
            if (/["'<>`\s]/.test(u)) return false;
            return /^(https?:|data:|\/)/i.test(u);
        }

        // Procedural thumbnail — deterministic per endpoint (honest placeholder
        // until real sample outputs ship with the serverless runtime).
        function drawThumb(canvas, seedText) {
            const ctx = canvas.getContext('2d');
            let seed = [...seedText].reduce((a, c) => a + c.charCodeAt(0), 11);
            const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
            const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            g.addColorStop(0, `hsl(${rnd() * 360}, 45%, 13%)`);
            g.addColorStop(1, `hsl(${rnd() * 360}, 55%, 26%)`);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 26; i++) {
                ctx.beginPath();
                ctx.arc(rnd() * canvas.width, rnd() * canvas.height, rnd() * 34 + 3, 0, 7);
                ctx.fillStyle = `hsla(${68 + rnd() * 45}, 90%, ${48 + rnd() * 32}%, ${0.05 + rnd() * 0.14})`;
                ctx.fill();
            }
            ctx.strokeStyle = 'rgba(204,255,51,0.35)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * (0.3 + rnd() * 0.5));
            for (let x = 0; x <= canvas.width; x += 14) {
                ctx.lineTo(x, canvas.height * (0.25 + rnd() * 0.55));
            }
            ctx.stroke();
        }

        function endpointCard(ep) {
            const card = document.createElement('div');
            card.className = 'bg-zinc-950 border border-zinc-800 hover:border-zinc-600 rounded-2xl p-3 flex flex-col transition-all cursor-pointer';
            // Thumbnail = a real output this model generated (cached after a run
            // on a GPU node), otherwise a placeholder. Never external sample art.
            // `sample.src` may be a cached gateway/relay URL from an earlier
            // run (possibly a stale, pre-validation localStorage entry), so
            // gate the scheme and escape before it re-enters the DOM.
            const sample = VM.samples[ep.key];
            let thumb;
            if (sample && sample.type === 'image' && safeMediaUrl(sample.src)) {
                thumb = `<img src="${escAttr(sample.src)}" alt="${escAttr(ep.model)} sample" class="w-full h-40 object-cover rounded-xl mb-3">`;
            } else if (sample && sample.type === 'video' && safeMediaUrl(sample.src)) {
                thumb = `<video src="${escAttr(sample.src)}" muted playsinline preload="metadata" class="w-full h-40 object-cover rounded-xl mb-3"></video>`;
            } else {
                thumb = `<canvas width="340" height="160" class="w-full rounded-xl mb-3"></canvas>`;
            }
            card.innerHTML = `

            btn.className = 'mt-3 w-full py-2 rounded-xl bg-[#ccff33] hover:bg-white text-black text-xs font-semibold';
            btn.textContent = 'Run';
            btn.onclick = (e) => { e.stopPropagation(); openEndpoint(ep); };
            card.onclick = () => openEndpoint(ep);
            card.appendChild(btn);
            return card;
        }

        // Endpoint playground: prompt in, x402 per request, output by task type.
        function openEndpoint(ep) {
            hideStart();
            // Chat models keep the conversational window; image/video/audio
            // get the full playground (Input | Result, like the reference).
            if (TASK_KIND(ep.task) === 'chat') {
                const body = createWindow('ep-' + ep.key, `${ep.vendor} / ${ep.model}`, 'fa-wand-magic-sparkles', 560);
                if (!body) return;
                chatUI(body, { name: `${ep.vendor} / ${ep.model}`, kind: 'chat', key: ep.key });
                return;
            }
            const body = createWindow('ep-' + ep.key, `${ep.vendor} / ${ep.model}`, 'fa-wand-magic-sparkles', 920);
            if (!body) return;
            playgroundUI(body, ep);
            focusSoon(body.querySelector('#ep-prompt'));
        }

        // ---- endpoint playground: Input | Result, tabs Playground/API ----
        // Per-endpoint usage receipts (persisted). Written on each completed
        // run; power the playground analytics strip and the wallet Activity tab.
        function recordReceipt(kind, ref, price, latencyMs, warm) {
            if (!Array.isArray(VM.receipts)) VM.receipts = [];
            VM.receipts.push({ kind, ref, price: +price || 0, at: nowMs(), latency: latencyMs | 0, warm: !!warm });
            if (VM.receipts.length > 500) VM.receipts = VM.receipts.slice(-500);
            saveVM();
        }
        function endpointStats(key) {
            const rs = (VM.receipts || []).filter(r => r.kind === 'endpoint' && r.ref === key);
            const lat = rs.filter(r => r.latency > 0).map(r => r.latency);
            return {
                runs: rs.length,
                spent: rs.reduce((s, r) => s + r.price, 0),
                avgLat: lat.length ? Math.round(lat.reduce((a, b) => a + b, 0) / lat.length) : 0,
            };
        }
        // Millisecond clock (kept as one call site so it's easy to reason about).
        function nowMs() { return new Date().getTime(); }

                    <div class="text-[10px] text-zinc-600 mt-3 font-mono">no API key · pay per ${ep.unit || 'request'} in USDC (x402) · $${ep.price} · escrow 9zMB…c1TN · Solana</div>

                        Centralized serverless GPU makes you pick: pay for idle capacity, or eat cold-start latency. Here you do neither —
                        <span class="text-zinc-300">you pay per request in USDC, so there is no idle to bill.</span> The scheduler places each call on a live node and settles on-chain; nothing runs, and nothing is charged, between calls.

            const q = sel => body.querySelector(sel);

            // ---- API tab: language-switchable samples, copy, keyless x402 ----
            (function initApi() {
                const url = `https://node.cloudiy/v1/${ep.key}`;
                const refField = isI2 ? (ep.task === 'speech-to-text' ? 'audio' : 'image') : null;
                // Build the example request body from this endpoint's shape.
                const payload = { prompt: 'a solarpunk city at golden hour' };
                if (refField) payload[refField] = 'https://…';
                if (durations) payload.duration = 5;
                if (sizes) payload.size = 1024;
                const pretty = JSON.stringify(payload, null, 2);
                const min = JSON.stringify(payload);
                // Payload is plain strings/numbers, so its JSON is also valid
                // Python — reuse `pretty` for the requests example.
                const samples = {
                    curl:
`curl -X POST ${url} \\
  -H "Content-Type: application/json" \\
  -d '${min}'`,
                    python:
`import requests

r = requests.post(
    "${url}",
    json=${pretty.replace(/\n/g, '\n    ')},
)
print(r.json())`,
                    js:
`const r = await fetch("${url}", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(${pretty.replace(/\n/g, '\n  ')}),
});
console.log(await r.json());`,
                };
                // Lightweight, injection-safe highlighter: escape first, then
                // colour string literals and numbers (ep fields are our own
                // trusted catalog data, but escaping keeps this robust).
                const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                // Single pass: each token is consumed once, so the number rule
                // can never mangle the class name of a string span (and vice
                // versa). Strings green, numbers amber, everything else plain.
                const hl = code => esc(code).replace(
                    /('[^']*'|"[^"]*")|(\b\d+\b)/g,
                    (_, str, num) => str
                        ? `<span class="text-emerald-400">${str}</span>`
                        : `<span class="text-amber-400">${num}</span>`
                );
                let lang = 'curl';
                const render = () => { q('#ep-code').innerHTML = hl(samples[lang]); };
                q('#ep-lang').onchange = e => { lang = e.target.value; render(); };
                q('#ep-copy').onclick = async () => {
                    try { await navigator.clipboard.writeText(samples[lang]); } catch (e) {}
                    const i = q('#ep-copy').querySelector('i');
                    i.className = 'fa-solid fa-check text-[#ccff33]';
                    setTimeout(() => { i.className = 'fa-regular fa-copy'; }, 1200);
                };
                q('#ep-deposit').onclick = () => openEscrowDeposit(ep);
                render();
            })();

            // tabs Playground | API
            const setTab = t => {
                q('#ep-pg').classList.toggle('hidden', t !== 'pg');
                q('#ep-api').classList.toggle('hidden', t !== 'api');
                body.querySelectorAll('.ep-tab').forEach(b => {
                    const on = b.dataset.t === t;
                    b.className = 'ep-tab pb-2 border-b-2 ' + (on
                        ? 'text-[#ccff33] border-[#ccff33]'
                        : 'text-zinc-400 border-transparent hover:text-white');
                });
            };
            body.querySelectorAll('.ep-tab').forEach(b => b.onclick = () => setTab(b.dataset.t));
            setTab('pg');

            // result tabs Preview | JSON
            const setRTab = t => {
                q('#ep-preview').classList.toggle('hidden', t !== 'preview');
                q('#ep-json').classList.toggle('hidden', t !== 'json');
                body.querySelectorAll('.ep-rtab').forEach(b => {
                    const on = b.dataset.r === t;
                    b.className = 'ep-rtab px-3 py-1.5 rounded-xl text-[11px] border ' + (on
                        ? 'bg-zinc-900 border-zinc-600 text-white'
                        : 'bg-zinc-950 border-zinc-800 text-zinc-500 hover:border-zinc-600');
                });
            };
            body.querySelectorAll('.ep-rtab').forEach(b => b.onclick = () => setRTab(b.dataset.r));
            setRTab('preview');
            renderEpStats();

            // chip selectors (duration / size)
            const chips = (holder, values, unit) => {
                const el = q(holder);
                if (!el) return () => null;
                let sel = values[0];
                const render = () => {
                    el.innerHTML = '';
                    values.forEach(v => {
                        const b = document.createElement('button');
                        b.className = v === sel
                            ? 'px-3.5 py-1.5 rounded-xl text-xs bg-[#ccff33]/10 border border-[#ccff33] text-[#ccff33]'
                            : 'px-3.5 py-1.5 rounded-xl text-xs bg-zinc-950 border border-zinc-700 text-zinc-400 hover:border-zinc-500';
                        b.textContent = v + (unit || '');
                        b.onclick = () => { sel = v; render(); };
                        el.appendChild(b);
                    });
                };
                render();
                return () => sel;
            };
            const getDuration = durations ? chips('#ep-durations', durations) : () => null;
            const getSize = sizes ? chips('#ep-sizes', sizes, 'px') : () => null;

            q('#ep-logs-btn').onclick = () => q('#ep-log').classList.toggle('hidden');
            q('#ep-extra-btn').onclick = () => q('#ep-extra').classList.toggle('hidden');
            q('#ep-reset').onclick = () => {
                q('#ep-prompt').value = '';
                if (q('#ep-ref')) q('#ep-ref').value = '';
                q('#ep-preview').innerHTML = '<span class="text-xs text-zinc-600">Run to generate a result</span>';
                q('#ep-json').textContent = '';
                q('#ep-log').innerHTML = '';
                setStatus('Idle');
                q('#ep-dl').disabled = true;
                q('#ep-dl').className = 'ml-auto px-3 py-1.5 rounded-xl bg-zinc-950 border border-zinc-800 text-[11px] text-zinc-600';
            };

            const setStatus = st => {
                const el = q('#ep-status');
                if (st === 'Running') el.className = 'px-2 py-0.5 rounded-lg bg-[#ccff33]/10 border border-[#ccff33]/50 text-[10px] text-[#ccff33] animate-pulse';
                else if (st === 'Complete') el.className = 'px-2 py-0.5 rounded-lg bg-emerald-500/10 border border-emerald-500/40 text-[10px] text-emerald-400';
                else el.className = 'px-2 py-0.5 rounded-lg bg-zinc-950 border border-zinc-800 text-[10px] text-zinc-400';
                el.textContent = '● ' + st;
                // A completed run is a paid request — record one receipt for it
                // (guarded so the several Complete call sites don't double-count).
                if (st === 'Complete' && !runRecorded) {
                    runRecorded = true;
                    recordReceipt('endpoint', ep.key, ep.price, runStart ? nowMs() - runStart : 0, (VM.warm || []).includes(ep.key));
                    renderEpStats();
                }
            };

            const logLine2 = (t, accent) => {
                const log = q('#ep-log');
                log.classList.remove('hidden');
                const d = document.createElement('div');
                d.textContent = t;
                if (accent) d.className = 'text-[#ccff33]';
                log.appendChild(d);
                log.scrollTop = 1e6;
            };

            // Keyless fallback: real image generation through the community
            // relay — no gateway needed, works on the static deploy. Video,
            // audio and chat still need a node via the local gateway. Returns
            // true when it rendered a real result (preview, JSON, download and
            // thumbnail all set).
            const relaySupported = ep.cat === 'image';
            async function runRelay(prompt) {
                if (!relaySupported) return false;
                logLine2('· routed to community inference relay (keyless, free tier)');
                const size = +(getSize() || 1024);
                const ref = (q('#ep-ref')?.value || '').trim();
                const useRef = /^https?:/.test(ref);
                const url = RELAY_IMG + encodeURIComponent(prompt)
                    + `?width=${size}&height=${size}&nologo=true&seed=${Math.floor(Math.random() * 1e9)}`
                    + `&model=${useRef ? 'kontext' : 'flux'}`
                    + (useRef ? '&image=' + encodeURIComponent(ref) : '');
                const ok = await new Promise(res => {
                    const img = new Image();
                    img.className = 'w-full rounded-xl';
                    img.alt = prompt;
                    img.onload = () => { const p = q('#ep-preview'); p.innerHTML = ''; p.appendChild(img); res(true); };
                    img.onerror = () => res(false);
                    img.src = url;
                });
                if (!ok) { logLine2('⚠ community relay unreachable — showing demo preview'); return false; }
                // The relay URL is deterministic (prompt+seed) — store it as
                // this endpoint's card thumbnail.
                VM.samples[ep.key] = { type: 'image', src: url }; saveVM();
                const dl = q('#ep-dl');
                dl.disabled = false;
                dl.className = 'ml-auto px-3 py-1.5 rounded-xl bg-zinc-950 border border-[#ccff33]/50 text-[11px] text-[#ccff33] hover:bg-zinc-900';
                dl.onclick = () => window.open(url, '_blank');
                logLine2('← 200 OK · generated via community relay · cached as thumbnail', true);
                q('#ep-json').textContent = JSON.stringify({
                    model: `${ep.vendor}/${ep.model}`,
                    task: ep.task,
                    input: { prompt, ...(getSize() ? { size: getSize() + 'px' } : {}), ...(useRef ? { reference: ref } : {}) },
                    price_usdc: ep.price,
                    settled_via: 'community-relay (free tier — no escrow charged)',
                    kind: 'image',
                    served_by: useRef ? 'kontext (community relay)' : 'flux (community relay)',
                    output: url,
                }, null, 2);
                setStatus('Complete');
                return true;
            }

            q('#ep-run').onclick = async () => {
                if (!walletPubkey) { loginConnect ? alert('Connect your wallet first.') : null; }
                const prompt = q('#ep-prompt').value.trim();
                if (!prompt) { q('#ep-prompt').focus(); return; }
                const btn = q('#ep-run');
                runStart = nowMs(); runRecorded = false;
                btn.disabled = true; btn.textContent = 'Running…';
                setStatus('Running');
                q('#ep-log').innerHTML = '';

                logLine2(`→ POST /v1/${ep.key} · ${ep.task}`);
                await sleep(350);
                logLine2(`← Payment · $${ep.price}/${ep.unit || 'request'} · USDC`);
                await sleep(400);
                logLine2(`→ paid · scheduler matched a GPU node (${ep.gpu || 'network'})`, true);

                // Real generation when a local gateway is serving us: the
                // model's own output renders in the Result pane AND becomes this
                // endpoint's thumbnail. On a CPU/macOS host the gateway returns
                // an honest "needs a GPU node" here.
                if (GATEWAY_OK) {
                    try {
                        const res = await fetch('/api/endpoint', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ key: ep.key, prompt }),
                        });
                        const d = await res.json();
                        const preview = q('#ep-preview'); preview.innerHTML = '';
                        const dl = q('#ep-dl');
                        // Gateway output is provider-controlled — build media
                        // nodes via the DOM (never innerHTML interpolation) and
                        // allow only safe URL schemes, so a hostile provider
                        // can't inject markup into the wallet-connected origin.
                        if (d.image_b64) {
                            const src = 'data:image/png;base64,' + String(d.image_b64).replace(/[^A-Za-z0-9+/=]/g, '');
                            preview.innerHTML = '';
                            const img = document.createElement('img');
                            img.src = src; img.className = 'w-full rounded-xl';
                            preview.appendChild(img);
                            VM.samples[ep.key] = { type: 'image', src }; saveVM();
                            dl.disabled = false;
                            dl.className = 'ml-auto px-3 py-1.5 rounded-xl bg-zinc-950 border border-[#ccff33]/50 text-[11px] text-[#ccff33] hover:bg-zinc-900';
                            dl.onclick = () => { const a = document.createElement('a'); a.href = src; a.download = ep.key + '.png'; a.click(); };
                            logLine2(`← 200 OK · image generated on ${d.settled_via} · cached as thumbnail`, true);
                            setStatus('Complete');
                        } else if (d.media_url && safeMediaUrl(d.media_url)) {
                            const url = d.media_url;
                            preview.innerHTML = '';
                            const video = document.createElement('video');
                            video.src = url; video.controls = true; video.className = 'w-full rounded-xl';
                            preview.appendChild(video);
                            VM.samples[ep.key] = { type: 'video', src: url }; saveVM();
                            dl.disabled = false;
                            dl.className = 'ml-auto px-3 py-1.5 rounded-xl bg-zinc-950 border border-[#ccff33]/50 text-[11px] text-[#ccff33] hover:bg-zinc-900';
                            dl.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = ep.key + '.mp4'; a.click(); };
                            logLine2(`← 200 OK · video generated on ${d.settled_via} · cached as thumbnail`, true);
                            setStatus('Complete');
                        } else {
                            // Gateway present but this node can't serve the
                            // model (e.g. no GPU) — fall back to the relay
                            // before giving up.
                            logLine2(`← ${d.error || 'error'}`);
                            if (await runRelay(prompt)) { btn.disabled = false; btn.textContent = 'Run'; return; }
                            preview.innerHTML = `<div class="text-sm text-rose-400 leading-relaxed">⚠ ${(d.error || 'error').replace(/</g,'&lt;')}</div>`;
                            setStatus('Idle');
                        }

                        btn.disabled = false; btn.textContent = 'Run';
                        return;
                    } catch (e) {
                        logLine2('⚠ gateway unreachable — trying the community relay');
                    }
                }

                // No gateway (static deploy): generate for real via the relay.
                if (await runRelay(prompt)) { btn.disabled = false; btn.textContent = 'Run'; return; }

                // cold start: first run pulls the model on the node, then warm
                if (!VM.warm.includes(ep.key)) {
                    logLine2(`· cold start: provisioning model on node…`);
                    const layers = 4 + Math.floor(ep.price * 10) % 4;
                    for (let i = 1; i <= layers; i++) {
                        logLine2(`  pulling layer ${i}/${layers}`);

                            const bar = document.createElement('div');

                            bar.className = 'flex-1 bg-[#ccff33]/70 rounded-sm';
                            wave.appendChild(bar);
                        }
                        wrap.appendChild(wave);
                    }
                    const barUi = document.createElement('div');
                    barUi.className = 'flex items-center gap-x-2 mt-3 text-xs text-zinc-500';
                    barUi.innerHTML = '<i class="fa-solid fa-play text-[#ccff33]"></i><div class="flex-1 h-1 bg-zinc-800 rounded"></div><span class="font-mono">0:00 / 0:15</span>';
                    wrap.appendChild(barUi);
                    preview.appendChild(wrap);
                } else {
                    const canvas = document.createElement('canvas');
                    canvas.width = 560; canvas.height = 315;
                    canvas.className = 'w-full rounded-xl';
                    let seed = [...prompt].reduce((a, c) => a + c.charCodeAt(0), 7);
                    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
                    const ctx = canvas.getContext('2d');
                    const g = ctx.createLinearGradient(0, 0, 560, 315);
                    g.addColorStop(0, `hsl(${rnd() * 360},45%,12%)`);
                    g.addColorStop(1, `hsl(${rnd() * 360},60%,24%)`);
                    ctx.fillStyle = g; ctx.fillRect(0, 0, 560, 315);
                    for (let i = 0; i < 40; i++) {
                        ctx.beginPath();
                        ctx.arc(rnd() * 560, rnd() * 315, rnd() * 58 + 4, 0, 7);
                        ctx.fillStyle = `hsla(${68 + rnd() * 40},90%,${50 + rnd() * 30}%,${0.05 + rnd() * 0.12})`;
                        ctx.fill();
                    }
                    ctx.fillStyle = 'rgba(204,255,51,.85)'; ctx.font = '11px monospace';
                    ctx.fillText(isVideo ? '▶ demo frame · live model soon' : '✦ demo render · live model soon', 12, 300);
                    preview.appendChild(canvas);

        }

        // Simple JSON highlighter for repo READMEs: escape first, then colour

        function hlJson(code) {

            return esc(code).replace(
                /("[^"]*")|(\b\d+(?:\.\d+)?\b)/g,

        const DEPLOY_ENV = {
            ubuntu:        [{ name: 'JUPYTER_PASSWORD', ph: 'empty = disable JupyterLab', secret: true }],

        // ================= Hardware Store =================================

            { key: 'ram-128', kind: 'RAM', name: '+128 GB module', spec: '128 GB', icon: 'fa-memory', price: 0.33, add: { ram: 128 }, node: 'f0b3…9d27', uptime: 98.5 },

            { key: 'disk-100', kind: 'STORAGE', name: '+100 GB volume', spec: '100 GB NVMe', icon: 'fa-hard-drive', price: 0.02, add: { disk: 100 },  node: '77af…0c31', uptime: 98.8 },
            { key: 'disk-250', kind: 'STORAGE', name: '+250 GB volume', spec: '250 GB NVMe', icon: 'fa-hard-drive', price: 0.04, add: { disk: 250 },  node: '77af…0c31', uptime: 98.8 },
            { key: 'disk-500', kind: 'STORAGE', name: '+500 GB volume', spec: '500 GB NVMe', icon: 'fa-hard-drive', price: 0.07, add: { disk: 500 },  node: 'b1e9…77f2', uptime: 97.4 },
            { key: 'disk-1t',  kind: 'STORAGE', name: '+1 TB volume',   spec: '1 TB NVMe',   icon: 'fa-hard-drive', price: 0.12, add: { disk: 1024 }, node: 'e3d0…4b9a', uptime: 99.9 },
        ];
        // Whole machines — dedicated nodes rented as one exclusive unit, a
        // bundle of GPU + CPU + RAM + storage priced slightly below the sum of

        const MACHINES = [
            { key: 'rig-4090', kind: 'MACHINE', name: 'RTX 4090 Rig',  gpuName: 'NVIDIA RTX 4090',  spec: 'RTX 4090 24GB · 16 vCPU · 64 GB · 1 TB NVMe',  icon: 'fa-server', price: 1.15, add: { vram: 24, cpu: 16, ram: 64,  disk: 1024 }, node: '9846…b1ec', uptime: 99.2 },
            { key: 'rig-3090', kind: 'MACHINE', name: 'RTX 3090 Rig',  gpuName: 'NVIDIA RTX 3090',  spec: 'RTX 3090 24GB · 8 vCPU · 32 GB · 500 GB NVMe',  icon: 'fa-server', price: 0.66, add: { vram: 24, cpu: 8,  ram: 32,  disk: 500  }, node: 'b1e9…77f2', uptime: 97.4 },

        function refreshMyVM() {

        let hwTab = 'rent';

        function openHardwareStore() {

            // The CSS auto-fill grid reflows columns on its own as the window
            // resizes; re-render (debounced) on a real width change so the 3D
            // card canvases re-init crisply at their new size.
            if (hwResizeObs) hwResizeObs.disconnect();
            let lastW = 0, t = null;
            hwResizeObs = new ResizeObserver(entries => {
                const w = Math.round(entries[0].contentRect.width);

        function refreshHardware() {

        const PART_KINDS = [
            { key: 'GPU',     name: 'Graphics',  icon: 'fa-bolt' },

        // Marketplace-style card: animated 3D part + name + price + action.
        function rentCard(part) {
            const attached = VM.parts.includes(part.key);
