                        <div class="text-sm font-semibold">${part.name}</div>
                        <div class="text-[11px] text-zinc-500 font-mono">${part.spec}</div>
                        <div class="text-[10px] text-zinc-600 font-mono mt-0.5">node ${part.node} · ${part.uptime}% uptime</div>
                    </div>
                    ${attached ? '<div class="text-[#ccff33] text-[10px] font-medium mt-0.5">● ATTACHED</div>' : ''}
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-[10px] text-zinc-400">Price per hour</div>
                        <div class="font-mono text-lg text-[#ccff33]">$${part.price.toFixed(2)}</div>
                    </div>
                </div>`;
            const btn = document.createElement('button');
            btn.className = attached
                ? 'px-5 py-2 rounded-2xl bg-zinc-800 hover:bg-rose-500/20 hover:text-rose-400 text-zinc-300 text-xs font-semibold'
                : 'px-5 py-2 rounded-2xl bg-[#ccff33] hover:bg-white text-black text-xs font-semibold';
            btn.textContent = attached ? 'Detach' : 'Attach';
            btn.onclick = () => attached ? detachPart(part.key) : attachPart(part.key);
            card.querySelector('.flex.justify-between.items-center').appendChild(btn);
            return card;
        }

        // Whole-machine card: a dedicated node rented as one exclusive unit.
        function rentMachineCard(machine) {
            const attached = VM.parts.includes(machine.key);
            const card = document.createElement('div');
            card.className = 'gpu-card bg-zinc-900 border rounded-3xl p-4 ' + (attached ? 'border-[#ccff33]/50' : 'border-zinc-800');
            card.innerHTML = `
                <canvas class="gpu-canvas w-full h-28 mb-3" data-kind="GPU"></canvas>
                <div class="flex items-start justify-between mb-1">
                    <div class="text-sm font-semibold">${machine.name}</div>
                    ${attached
                        ? '<div class="text-[#ccff33] text-[10px] font-medium">● RENTED</div>'
                        : '<span class="text-[9px] tracking-widest text-zinc-500 border border-zinc-700 rounded px-1.5 py-0.5">DEDICATED</span>'}
                </div>
                <div class="text-[11px] text-zinc-500 font-mono leading-relaxed mb-1">${machine.spec}</div>
                <div class="text-[10px] text-zinc-600 font-mono mb-3">node ${machine.node} · ${machine.uptime}% uptime · whole machine</div>
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-[10px] text-zinc-400">Price per hour</div>
                        <div class="font-mono text-lg text-[#ccff33]">$${machine.price.toFixed(2)}</div>
                    </div>
                </div>`;
            const btn = document.createElement('button');
            btn.className = attached
                ? 'px-5 py-2 rounded-2xl bg-zinc-800 hover:bg-rose-500/20 hover:text-rose-400 text-zinc-300 text-xs font-semibold'
                : 'px-5 py-2 rounded-2xl bg-[#ccff33] hover:bg-white text-black text-xs font-semibold';
            btn.textContent = attached ? 'Release' : 'Rent machine';
            btn.onclick = () => attached ? detachPart(machine.key) : attachPart(machine.key);
            card.querySelector('.flex.justify-between.items-center').appendChild(btn);
            return card;
        }

        // ---- three.js part models (GPU ported from the marketplace) -------
        // ONE shared WebGL context for all card thumbnails. A renderer per card
        // exhausted the browser's ~16-context limit — contexts were lost and the
        // animation loops froze the page (inputs stopped responding). Each model
        // is now rendered once into this shared renderer and copied onto the
        // card's own 2D canvas.
        let sharedGL = null;
        function getSharedGL() {
            if (!sharedGL) {
                sharedGL = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                sharedGL.setPixelRatio(1);
            }
            return sharedGL;
        }
        function part3DBase(canvas) {
            const renderer = getSharedGL();
            const w = canvas.offsetWidth || 280, h = canvas.offsetHeight || 112;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            renderer.setSize(w * dpr, h * dpr, false);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
            camera.position.set(0, 0.5, 4.4);
            const dir = new THREE.DirectionalLight(0xffffff, 1.25);
            dir.position.set(4, 6, 8);
            scene.add(dir);
            scene.add(new THREE.AmbientLight(0x222222));
            const rim = new THREE.DirectionalLight(0xccff33, 0.55);
            rim.position.set(0, -8, 3);
            scene.add(rim);
            return { renderer, scene, camera, canvas, w, h, dpr };
        }
        const glowMat = (i = 0.7) => new THREE.MeshPhongMaterial({ color: 0xccff33, emissive: 0xccff33, emissiveIntensity: i, shininess: 80 });
        const darkMat = (c = 0x1f2528) => new THREE.MeshPhongMaterial({ color: c, shininess: 25, specular: 0x111111 });

        function initPart3D(canvas, kind) {
            if (!canvas || typeof THREE === 'undefined') return;
            const base = part3DBase(canvas);
            const { renderer, scene, camera } = base;
            const root = new THREE.Group();
            scene.add(root);
            const spinners = [];

            if (kind === 'GPU') {
                // The marketplace reference card: long body, glow strip, 3 fans.
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.35, 0.55), darkMat());
                root.add(body);
                const accent = new THREE.Mesh(new THREE.BoxGeometry(3.45, 0.18, 0.6), glowMat(0.6));
                accent.position.y = -0.65;
                root.add(accent);
                [-0.95, 0.05, 1.05].forEach((x, index) => {
                    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.32, 32), darkMat(0x111111));
                    ring.rotation.x = Math.PI / 2;
                    ring.position.set(x, 0, 0.32);
                    root.add(ring);
                    const blades = new THREE.Group();
                    for (let i = 0; i < 7; i++) {
                        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.77, 0.08), glowMat(0.9));
                        blade.position.y = 0.22;
                        blade.rotation.z = i * (Math.PI * 2 / 7);
                        blades.add(blade);
                    }
                    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.35, 24), glowMat(0.7));
                    hub.rotation.x = Math.PI / 2;
                    blades.add(hub);
                    blades.position.set(x, 0, 0.32);
                    root.add(blades);
                    spinners.push({ obj: blades, speed: 0.12 + index * 0.02 });
                });
            } else if (kind === 'CPU') {
                // Substrate + heat-spreader lid + pulsing die + pin field.
                const pcb = new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.3, 0.12), darkMat(0x14210c));
                pcb.rotation.x = -0.9;
                root.add(pcb);
                const lid = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.7, 0.16), darkMat(0x3a4148));
                lid.rotation.x = -0.9;
                lid.position.z = 0.14; lid.position.y = 0.09;
                root.add(lid);
                const die = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.06), glowMat(0.8));
                die.rotation.x = -0.9;
                die.position.z = 0.26; die.position.y = 0.16;
                root.add(die);
                spinners.push({ obj: die, pulse: true });
                for (let i = -3; i <= 3; i++) {
                    const trace = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.28, 0.02), glowMat(0.25));
                    trace.rotation.x = -0.9;
                    trace.position.x = i * 0.31;
                    trace.position.z = -0.05; trace.position.y = -0.04;
                    root.add(trace);
                }
            } else if (kind === 'RAM') {
                // Standing stick: PCB, 8 memory chips, gold edge connector, glow top.
                const pcb = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.15, 0.1), darkMat(0x14210c));
                root.add(pcb);
                for (let i = 0; i < 8; i++) {
                    const chip = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.08), darkMat(0x0c0c0e));
                    chip.position.set(-1.5 + i * 0.43, 0.05, 0.09);
                    root.add(chip);
                }
                const edge = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.14, 0.12), new THREE.MeshPhongMaterial({ color: 0xd4af37, shininess: 90 }));
                edge.position.y = -0.62;
                root.add(edge);
                const glow = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 0.14), glowMat(0.9));
                glow.position.y = 0.62;
                root.add(glow);
                spinners.push({ obj: glow, pulse: true });
            } else {
                // STORAGE: NVMe-style slab with controller + pulsing activity LED.
                const slab = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.0, 0.14), darkMat(0x14210c));
                root.add(slab);
                const ctrl = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.1), darkMat(0x0c0c0e));
                ctrl.position.set(-1.0, 0, 0.11);
                root.add(ctrl);
                [0.0, 0.7, 1.4].forEach(x => {
                    const nand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.09), darkMat(0x191a1d));
                    nand.position.set(x, 0, 0.11);
                    root.add(nand);
                });
                const led = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.1), glowMat(1.0));
                led.position.set(-1.52, 0.32, 0.12);
                root.add(led);
                spinners.push({ obj: led, pulse: true, fast: true });
            }

            // Pose it nicely, render one frame into the shared context, then
            // copy it onto the card's own 2D canvas. No per-card context, no
            // animation loop — the page stays responsive.
            spinners.forEach(s => { if (s.pulse) s.obj.material.emissiveIntensity = s.fast ? 1.0 : 0.85; });
            root.rotation.y = 0.5;
            root.rotation.x = 0.06;
            renderer.render(scene, camera);
            const cv = base.canvas;
            cv.width = base.w * base.dpr;
            cv.height = base.h * base.dpr;
            const ctx = cv.getContext('2d');
            if (ctx) ctx.drawImage(renderer.domElement, 0, 0, cv.width, cv.height);
            hwScenes.push(scene); // tracked so its GPU buffers free on re-render
        }

        // Network reference rates (from the rent listings), used only to
        // suggest a fair per-part price for an offer.
        const OFFER_RATE = { cpu: 0.011, ram: 0.0026 }; // USDC per core/h, per GB/h
        // Suggested hourly price for the detected GPU, matched by model family.
        function guessGpuPrice(name) {
            const n = (name || '').toLowerCase();
            if (n.includes('h100')) return 3.90;
            if (n.includes('a100')) return 2.60;
            if (n.includes('l40'))  return 1.95;
            if (n.includes('4090')) return 0.90;
            if (n.includes('4080')) return 0.62;
            if (n.includes('3090')) return 0.48;
            if (n.includes('7900')) return 0.40;
            return name ? 0.50 : 0;
        }

        // Best-effort read of THIS machine's hardware straight from the browser.
        // Values are approximate — the browser coarsens/masks them (Chrome caps
        // deviceMemory at 8 GB, the GPU comes from the WebGL renderer string,
        // other engines restrict both) — so they only PRE-FILL the offer; the
        // `cloudiy share` daemon measures the exact capacity when the node
        // actually comes online.
        function detectHardware() {
            const cores = navigator.hardwareConcurrency || 0;
            const ram = navigator.deviceMemory || 0; // GB, coarse
            let gpu = '';
            try {
                const cv = document.createElement('canvas');
                const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
                const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) {
                    gpu = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toString();
                    // Unwrap ANGLE strings: "ANGLE (NVIDIA, NVIDIA RTX 4090 Direct3D11 ...)".
                    const m = gpu.match(/ANGLE \([^,]+,\s*([^,)]+)/);
                    if (m) gpu = m[1].replace(/Direct3D.*$/i, '').replace(/\(0x[0-9a-f]+\)/i, '').trim();
                }
            } catch (e) { /* WebGL blocked — leave GPU unknown */ }
            return { cores, ram, gpu: gpu.slice(0, 48) };
        }

        function renderOffer(el) {
            const det = detectHardware();
            const saved = VM.offering || {};
            // Hard caps: you can't offer more than this machine actually has.
            // Cores (hardwareConcurrency) and the GPU (WebGL renderer) are read
            // straight from the device; RAM (deviceMemory) is coarse and can
            // only UNDER-report, so capping at it never lets you over-claim.
            // When a value can't be read, fall back to a ceiling and flag it
            // unverified — the `cloudiy share` daemon enforces the real limit.
            const cpuMax = det.cores > 0 ? det.cores : 32;
            const ramMax = det.ram   > 0 ? det.ram   : 128;
            const clamp = (v, max) => Math.max(0, Math.min(v, max));
            const seedCpu = clamp(saved.cpu != null ? saved.cpu : cpuMax, cpuMax);
            const seedRam = clamp(saved.ram != null ? saved.ram : ramMax, ramMax);
            // A GPU can only be offered if this machine reports one, and only
            // the one it reports; a stale saved choice is dropped.
            const detGpu = det.gpu || '';
            const seedGpu = saved.gpu && saved.gpu === detGpu ? saved.gpu : '';
            const hint = (txt, warn) => `<span class="text-[10px] ${warn ? 'text-amber-500/80' : 'text-zinc-600'} ml-2">${txt}</span>`;
            const cpuHint = det.cores > 0 ? hint('max ' + det.cores + ' cores · this machine') : hint('unverified — daemon enforces the limit', true);
            const ramHint = det.ram   > 0 ? hint('max ~' + det.ram + ' GB · this machine')     : hint('unverified — daemon enforces the limit', true);
            const gpuHint = detGpu ? hint('detected: ' + detGpu) : hint('no GPU detected on this machine', true);
            const gpuSelect = detGpu
                ? `<option value="">None — offer CPU/RAM only</option><option>${detGpu}</option>`
                : `<option value="">None — no GPU on this machine</option>`;
            const priceBox = id =>
                `<div class="flex items-center gap-2 mt-2"><span class="text-[11px] text-zinc-500">Price</span>`
                + `<input type="number" id="${id}" min="0" step="0.01" class="w-24 bg-zinc-950 border border-zinc-700 rounded-xl px-2 py-1 text-xs font-mono focus:outline-none focus:border-[#ccff33]">`
                + `<span class="text-[11px] text-zinc-500">USDC/h</span></div>`;
            el.innerHTML = `
                <div class="space-y-5">
                    <div>
                        <div class="flex justify-between text-sm mb-2"><span class="text-zinc-400"><i class="fa-solid fa-microchip mr-2 text-[#ccff33]"></i>CPU to offer${cpuHint}</span><span class="font-mono" id="off-cpu-val"></span></div>
                        <input type="range" id="off-cpu" min="0" max="${cpuMax}" value="${seedCpu}" class="w-full accent-[#ccff33]">
                        ${priceBox('off-cpu-price')}
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-2"><span class="text-zinc-400"><i class="fa-solid fa-memory mr-2 text-[#ccff33]"></i>RAM to offer${ramHint}</span><span class="font-mono" id="off-ram-val"></span></div>
                        <input type="range" id="off-ram" min="0" max="${ramMax}" value="${seedRam}" class="w-full accent-[#ccff33]">
                        ${priceBox('off-ram-price')}
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-1.5">GPU to offer <span class="text-zinc-600">(optional)</span>${gpuHint}</label>
                        <select id="off-gpu" ${detGpu ? '' : 'disabled'} class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#ccff33] disabled:opacity-50">
                            ${gpuSelect}
                        </select>
                        ${priceBox('off-gpu-price')}
                    </div>
                    <div class="flex justify-between items-center border-t border-zinc-800 pt-3">
                        <span class="text-xs text-zinc-400">Total offer price</span>
                        <span class="font-mono text-lg text-[#ccff33]" id="off-total">$0.00/h</span>
                    </div>
                    <div id="off-summary" class="text-[11px] font-mono text-zinc-400 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2"></div>
                    <button id="off-go" class="w-full py-3.5 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-2xl text-sm">Announce to the network</button>
                </div>`;
            const $ = s => el.querySelector(s);
            if (seedGpu) $('#off-gpu').value = seedGpu;
            const gpuPrice = () => guessGpuPrice($('#off-gpu').value);
            // Seed prices: a saved offer wins, else the suggestion from the rate.
            $('#off-cpu-price').value = saved.priceCpu != null ? saved.priceCpu : +(seedCpu * OFFER_RATE.cpu).toFixed(2);
            $('#off-ram-price').value = saved.priceRam != null ? saved.priceRam : +(seedRam * OFFER_RATE.ram).toFixed(2);
            $('#off-gpu-price').value = saved.priceGpu != null ? saved.priceGpu : +gpuPrice().toFixed(2);
            const upd = reprice => {
                const cpu = +$('#off-cpu').value, ram = +$('#off-ram').value, gpu = $('#off-gpu').value;
                $('#off-cpu-val').textContent = cpu ? cpu + ' cores' : 'None';
                $('#off-ram-val').textContent = ram ? ram + ' GB' : 'None';
                // Re-suggest a price when the amount changes, unless the user
                // has hand-edited that field.
                if (reprice === 'cpu' && !$('#off-cpu-price').dataset.touched) $('#off-cpu-price').value = +(cpu * OFFER_RATE.cpu).toFixed(2);
                if (reprice === 'ram' && !$('#off-ram-price').dataset.touched) $('#off-ram-price').value = +(ram * OFFER_RATE.ram).toFixed(2);
                if (reprice === 'gpu' && !$('#off-gpu-price').dataset.touched) $('#off-gpu-price').value = +gpuPrice().toFixed(2);
                const pc = cpu ? (+$('#off-cpu-price').value || 0) : 0;
                const pr = ram ? (+$('#off-ram-price').value || 0) : 0;
                const pg = gpu ? (+$('#off-gpu-price').value || 0) : 0;
                $('#off-total').textContent = '$' + (pc + pr + pg).toFixed(2) + '/h';
                $('#off-summary').textContent = `$ cloudiy share --share-cpu ${cpu * 1000} --share-memory ${ram * 1024}` + (gpu ? '   # + ' + gpu : '');
            };
            $('#off-cpu').oninput = () => upd('cpu');
            $('#off-ram').oninput = () => upd('ram');
            $('#off-gpu').onchange = () => upd('gpu');
            ['#off-cpu-price', '#off-ram-price', '#off-gpu-price'].forEach(id =>
                $(id).addEventListener('input', () => { $(id).dataset.touched = '1'; upd(); }));
            upd();
            $('#off-go').onclick = () => {
                const cpu = +$('#off-cpu').value, ram = +$('#off-ram').value, gpu = $('#off-gpu').value;
                const priceCpu = cpu ? (+$('#off-cpu-price').value || 0) : 0;
                const priceRam = ram ? (+$('#off-ram-price').value || 0) : 0;
                const priceGpu = gpu ? (+$('#off-gpu-price').value || 0) : 0;
                const total = priceCpu + priceRam + priceGpu;
                if (!cpu && !ram && !gpu) { alert('Offer at least one part — CPU, RAM or a GPU.'); return; }
                if (!(total > 0)) { alert('Set a price for at least one offered part.'); return; }
                VM.offering = { cpu, ram, gpu, priceCpu, priceRam, priceGpu }; saveVM();
                const lines = [];
                if (cpu) lines.push(`${cpu} CPU cores — $${priceCpu.toFixed(2)}/h`);
                if (ram) lines.push(`${ram} GB RAM — $${priceRam.toFixed(2)}/h`);
                if (gpu) lines.push(`${gpu} — $${priceGpu.toFixed(2)}/h`);
                alert(`Parts announced to the network!\n\n${lines.join('\n')}\n\nTotal $${total.toFixed(2)}/hour · payouts in USDC\n\nBring this machine online:\ncloudiy share --share-cpu ${cpu * 1000} --share-memory ${ram * 1024}`);
            };
        }

        // ================= running apps (compute bursts) ==================
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        async function x402Boot(logEl, app) {
            const line = t => { const d = document.createElement('div'); d.textContent = t; logEl.appendChild(d); logEl.scrollTop = 1e6; return d; };
            line(`→ workload: ${app.image} · from ${VM.name} volume`);
            await sleep(350);
            line(`← Payment required · USDC quote`);
            await sleep(450);
            const p = line(`→ paid · scheduler matched a node (${VM.vram}GB VRAM) · isolated runtime up`);
            p.className = 'text-[#ccff33]';
            await sleep(400);
        }
        function openApp(app) {
            hideStart();
            const body = createWindow('app-' + app.key, app.name, app.icon, app.kind === 'chat' ? 540 : 560);
            if (!body) return;
            body.innerHTML = '';
            const log = document.createElement('div');
            log.className = 'bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-[11px] font-mono text-zinc-500 max-h-24 overflow-y-auto mb-4';
            body.appendChild(log);

            const ui = document.createElement('div');
            body.appendChild(ui);

            x402Boot(log, app).then(() => {
                if (app.kind === 'chat') chatUI(ui, app);
                else if (app.kind === 'image') imageUI(ui, app);
                else if (app.kind === 'audio') audioUI(ui, app);
                else if (app.kind === 'svc') serviceUI(ui, app);
                else shellUI(ui, app);
            });
        }
        function demoNote(parent) {
            const p = document.createElement('p');
            p.className = 'text-[10px] text-zinc-600 mt-3';
            p.innerHTML = '<i class="fa-solid fa-flask mr-1"></i>Demo preview — payment/scheduling above is the real protocol flow; live inference ships with the serverless runtime.';
            parent.appendChild(p);
        }
        function chatUI(ui, app) {
            const epKey = app.key || null; // catalog key routed by the gateway
            ui.innerHTML = `
                <div class="space-y-2 mb-3 chat-log"></div>
                <div class="flex gap-x-2">
                    <input class="flex-1 bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-[#ccff33]" placeholder="Message ${app.name || 'the model'}…">
                    <button class="chat-send px-5 py-2.5 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-xl text-sm">Send</button>
                </div>`;
            const input = ui.querySelector('input'), send = ui.querySelector('.chat-send'), logC = ui.querySelector('.chat-log');
            focusSoon(input);
            const go = async () => {
                const q = input.value.trim(); if (!q) return;
                input.value = '';
                logC.innerHTML += `<div class="text-sm bg-zinc-800/60 rounded-xl px-3 py-2 ml-10">${q.replace(/</g,'&lt;')}</div>`;
                const bot = document.createElement('div');
                bot.className = 'text-sm bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 mr-10';
                bot.innerHTML = '<span class="text-zinc-500">…</span>';
                logC.appendChild(bot);
                logC.scrollTop = 1e6;

                // Real inference when a local Cloudiy gateway is serving us.
                if (GATEWAY_OK && epKey) {
                    try {
                        const res = await fetch('/api/endpoint', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ key: epKey, prompt: q }),
                        });
                        const d = await res.json();
                        if (d.output) {
                            bot.textContent = d.output;
                            const meta = document.createElement('div');
                            meta.className = 'text-[10px] text-zinc-500 font-mono mt-1';
                            meta.textContent = `${d.model} · ${d.tokens ?? '?'} tokens · ${d.cold_start ? 'cold start (pulled)' : 'warm'} · settled ${d.settled_via}`;
                            bot.appendChild(meta);
                        } else {
                            bot.innerHTML = `<span class="text-rose-400">⚠ ${(d.error || 'error').replace(/</g,'&lt;')}</span>`;
                        }
                    } catch (e) {
                        bot.innerHTML = '<span class="text-rose-400">⚠ gateway unreachable</span>';
                    }
                    logC.scrollTop = 1e6;
                    return;
                }

                // Demo fallback (served statically, no local node).

        // ================= My Wallet =====================================
        // A security-hardened crypto wallet app. Threat model: a malicious
        // user tampering with the DOM/fields/buttons to (a) inject markup

        // Mitigations:

        //     innerHTML; user input is set via .value / .textContent, never
        //     interpolated raw.
        //   • Recipient addresses are validated as real Solana public keys
        //     (base58 + 32 bytes, via web3 PublicKey when available).
        //   • Amounts are parsed in integer base units (BigInt), strictly

        //   • Every action (send/swap) RE-VALIDATES at click time, so a

        function openWallet() {

                { key: 'usdt', symbol: 'USDT', name: 'Tether',   decimals: 6, mint: 'Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB',   cg: 'tether',                    color: '#26A17B', demo: 500000000n },

                { key: 'bonk', symbol: 'BONK', name: 'Bonk',     decimals: 5, mint: 'DezXAZ8z7PnrnRJjz3wXBoRgmBRT13KKz2FnE7dVsp',     cg: 'bonk',                      color: '#F5A623', demo: 1520000000000n },

            const changeOf = {}; REG.forEach(t => changeOf[t.key] = 0);

            function rpcList() {

            // ---- formatting / parsing / validation (security core) --------
            const usd = n => { n = Number(n) || 0; if (n > 0 && n < 0.01) return '$' + n.toPrecision(2); return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
            const num = (n, dp = 4) => { n = Number(n) || 0; return n.toLocaleString('en-US', { maximumFractionDigits: dp }); };
            const fmtBal = ui => { ui = Number(ui) || 0; if (ui === 0) return '0'; if (ui >= 1000) return num(ui, 2); if (ui >= 1) return num(ui, 4); return num(ui, 6); };
            const shortAddr = a => a ? (a.slice(0, 4) + '…' + a.slice(-4)) : 'not connected';
            // RPC calls have no built-in timeout; race them so a slow/hung
            // endpoint can never leave the wallet stuck on "Loading…".
            const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

                return i.toString() + (fs ? ('.' + fs) : '');
            }
            function parseAmount(str, decimals, maxBase) {
                str = String(str == null ? '' : str).trim();
                if (str.length > 30) return { ok: false, err: 'Amount too large' };
                if (!/^\d*\.?\d*$/.test(str) || str === '' || str === '.') return { ok: false, err: 'Enter an amount' };
                let [i, f = ''] = str.split('.'); i = i || '0';
                if (f.length > decimals) return { ok: false, err: 'Max ' + decimals + ' decimals' };
                f = (f + '0'.repeat(decimals)).slice(0, decimals);
                let base;
                try { base = BigInt(i) * (10n ** BigInt(decimals)) + BigInt(f || '0'); } catch (e) { return { ok: false, err: 'Invalid amount' }; }
                if (base <= 0n) return { ok: false, err: 'Amount must be greater than 0' };

            // ---- data loading ---------------------------------------------
            // Read the connected wallet's REAL on-chain holdings. Falls back to
            // the demo set ONLY when there is no valid connected address — a real
            // wallet never silently shows demo numbers. RPC failures degrade
            // gracefully (partial data + a flag) instead of masking real balances.
            const DEMO_PK = 'DemoWa11etCLoUD1Yxxxxxxxxxxxxxxxxxxxxxxxxxxx';   // sentinel set by loginDemo()
            async function loadHoldings() {
                const isReal = state.pubkey && state.pubkey !== DEMO_PK && typeof solanaWeb3 !== 'undefined' && isValidAddress(state.pubkey);
                state.live = isReal; state.balError = false;
                if (!isReal) return REG.map(t => ({ key: t.key, mint: t.mint, base: t.demo, decimals: t.decimals, meta: t }));

                for (const url of rpcList()) {
                    let conn; try { conn = new solanaWeb3.Connection(url, 'confirmed'); } catch (e) { continue; }
                    if (lamports == null) { try { lamports = await withTimeout(conn.getBalance(owner), 5000); } catch (e) {} }
                    if (accounts == null) {
                        try {
                            const parts = await withTimeout(Promise.all(TOKEN_PROGRAMS.map(pid =>
                                conn.getParsedTokenAccountsByOwner(owner, { programId: new solanaWeb3.PublicKey(pid) }).then(x => x.value).catch(() => null))), 6000);
                            if (parts.some(p => p !== null)) accounts = parts.filter(Boolean).flat();
                        } catch (e) {}
                    }
                    if (lamports != null && accounts != null) break;
                }
                state.balError = (lamports == null && accounts == null);
                const holdings = [{ key: 'sol', mint: null, base: BigInt(lamports || 0), decimals: 9, meta: SOL_META }];
                const byMint = {}, decOf = {};
                (accounts || []).forEach(a => {
                    const info = a.account.data.parsed.info, amt = info.tokenAmount;
                    if (!amt || amt.amount == null || amt.amount === '0') return;
                    try { byMint[info.mint] = (byMint[info.mint] || 0n) + BigInt(amt.amount); } catch (e) { return; }
                    decOf[info.mint] = amt.decimals;
                });
                Object.keys(byMint).forEach(mint => {
                    const meta = META_BY_MINT[mint] || null;
                    holdings.push({ key: meta ? meta.key : mint, mint, base: byMint[mint], decimals: decOf[mint], meta });

            function buildTokens(holdings) {

                        symbol: m ? m.symbol : (h.mint ? h.mint.slice(0, 4).toUpperCase() : 'SOL'),
                        name: m ? m.name : (h.mint ? (h.mint.slice(0, 4) + '…' + h.mint.slice(-4)) : 'Solana'),

                // thousands of dust accounts can't flood (or hang) the UI.

            function ensureSwapDefaults() {

                if (!keys.includes(state.swap.toKey) || state.swap.toKey === state.swap.fromKey) state.swap.toKey = keys.find(k => k !== state.swap.fromKey) || keys[0];

            function rebuildDerived() {

            function swapQuote(fromKey, toKey, amountStr) {

                const root = state.root, amt = root.querySelector('#s-amt'), from = root.querySelector('#s-from'), to = root.querySelector('#s-to');
                if (amt) { amt.value = state.swap.amount || ''; amt.addEventListener('input', () => { let c = amt.value.replace(/[^\d.]/g, ''); const i = c.indexOf('.'); if (i >= 0) c = c.slice(0, i + 1) + c.slice(i + 1).replace(/\./g, ''); if (c !== amt.value) amt.value = c; state.swap.amount = c; refreshSwap(); }); }
                if (from) from.addEventListener('change', () => { if (from.value === state.swap.toKey) state.swap.toKey = state.swap.fromKey; state.swap.fromKey = from.value; render(); });
                if (to) to.addEventListener('change', () => { if (to.value === state.swap.fromKey) state.swap.fromKey = state.swap.toKey; state.swap.toKey = to.value; render(); });
                refreshSwap();
            }

            function goBack() {
                if (state.view === 'send' || state.view === 'receive') state.view = 'token';
                else state.view = 'portfolio';
                render();
            }
            function wire() {
                const root = state.root; if (!root) return;
                root.querySelectorAll('[data-act]').forEach(el => {
                    const act = el.dataset.act;
                    if (act === 'token') el.addEventListener('click', () => { state.active = el.dataset.key; state.view = 'token'; render(); });
                    else if (act === 'tab') el.addEventListener('click', () => { const v = el.dataset.tab; if (v === 'swap') resetSwap(); state.view = v; render(); });
                    else if (act === 'back') el.addEventListener('click', goBack);
                    else if (act === 'send') el.addEventListener('click', () => { resetSend(); state.view = 'send'; render(); });
                    else if (act === 'receive') el.addEventListener('click', () => { state.view = 'receive'; render(); });
                    else if (act === 'copy') el.addEventListener('click', () => copyAddr(el));
                    else if (act === 'refresh') el.addEventListener('click', () => refresh(el));
                    else if (act === 'send-review') el.addEventListener('click', () => { const v = validateSend(); if (v.ok) { state.send.step = 'confirm'; render(); } else refreshSend(); });
                    else if (act === 'send-edit') el.addEventListener('click', () => { state.send.step = 'form'; render(); });
                    else if (act === 'do-send') el.addEventListener('click', doSend);
                    else if (act === 'finish') el.addEventListener('click', () => { state.view = 'token'; render(); });
                    else if (act === 'max-send') el.addEventListener('click', () => { const t = tokenByKey(state.active); if (!t) return; state.send.amount = fmtUnits(t.base, t.decimals); const a = root.querySelector('#w-amt'); if (a) a.value = state.send.amount; refreshSend(); });
                    else if (act === 'swap-flip') el.addEventListener('click', () => { const a = state.swap.fromKey; state.swap.fromKey = state.swap.toKey; state.swap.toKey = a; render(); });
                    else if (act === 'do-swap') el.addEventListener('click', doSwap);
                    else if (act === 'swap-finish') el.addEventListener('click', () => { resetSwap(); render(); });
                    else if (act === 'max-swap') el.addEventListener('click', () => { const f = tokenByKey(state.swap.fromKey); if (!f) return; state.swap.amount = fmtUnits(f.base, f.decimals); const a = root.querySelector('#s-amt'); if (a) a.value = state.swap.amount; refreshSwap(); });
                });
                if (state.view === 'send' && state.send.step === 'form') wireSendForm();
                if (state.view === 'swap' && state.swap.step === 'form') wireSwapForm();
                if (state.view === 'receive') drawQR();
            }
            function render() {
                const r = state.root; if (!r) return;
                let inner = '';
                if (state.view === 'portfolio') inner = viewPortfolio();
                else if (state.view === 'activity') inner = viewActivity();
                else if (state.view === 'swap') inner = viewSwap();
                else if (state.view === 'token') inner = viewToken();
                else if (state.view === 'send') inner = viewSend();
                else if (state.view === 'receive') inner = viewReceive();
                r.innerHTML = `<div class="flex flex-col h-full bg-zinc-950 text-white">${inner}</div>`;
                wire();
            }

            async function mount(body) {
                state.root = body; state.view = 'portfolio'; state.active = null; state.busy = false;
                resetSend(); resetSwap();
                state.pubkey = (typeof walletPubkey !== 'undefined' && walletPubkey) ? walletPubkey : '';
                body.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-zinc-500 text-sm gap-y-2"><i class="fa-solid fa-spinner fa-spin text-lg"></i>Loading wallet…</div>';
                const holdings = await loadHoldings();
                await loadPrices(holdings);
                buildTokens(holdings);
                ensureSwapDefaults();
                render();
            }
            async function refresh(btn) {
                if (state.busy) return; state.busy = true;
                if (btn) { const ic = btn.querySelector('i'); if (ic) ic.classList.add('fa-spin'); }
                const holdings = await loadHoldings();
                await loadPrices(holdings);
                buildTokens(holdings);
                ensureSwapDefaults();
                state.busy = false;
                render();
            }
            return { mount };
        })();

        // ================= start menu / clock / wallet ====================
        function toggleStart(e) { e.stopPropagation(); document.getElementById('start-menu').classList.toggle('hidden'); }
        function hideStart() { document.getElementById('start-menu').classList.add('hidden'); }
        document.addEventListener('click', hideStart);
        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);
        document.getElementById('vm-chip').textContent = 'vm://' + VM.name;

        // True when a local Cloudiy gateway (`cloudiy os`) is serving this page:
        // its /api/* is same-origin, so model endpoints run for real. Served
        // statically (Vercel), this stays false and playgrounds show the demo.
        let GATEWAY_OK = false;
        (async () => {
            try {
                const r = await fetch('/api/id');
                GATEWAY_OK = r.ok && !!(await r.json()).id;
            } catch (e) { GATEWAY_OK = false; }
        })();

        let walletPubkey = null;
        window.addEventListener('load', async () => {
            const provider = window.phantom?.solana || window.solana;
            if (provider) {
                try { const r = await provider.connect({ onlyIfTrusted: true }); walletPubkey = r.publicKey.toString(); } catch (e) {}
            }
        });

        // ============ On-chain USDC escrow, signed in the browser ============
        // A faithful JS port of `create_job` from crates/cloudiy/src/solana.rs
        // (devnet-tested): identical PDA seeds, account order and instruction
        // data, against the deployed escrow program. Phantom signs; the wallet
        // never leaves the user. The provider verifies the Job on-chain (its
        // --require-payment mode) before running the workload.
        const ESCROW = {
            programId:         '9zMBC7JDA8SJ2mk3ATYqRuJvn14MQyZVg9q3XPnzc1TN',
            rpcUrl:            'https://api.devnet.solana.com',
            mint:              '7E2fxsgWJiXGyFtLuybzhEavKXPkuCXMyqdW8GaZegRw', // devnet USDC test mint
            tokenProgram:      'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA',
            assocTokenProgram: 'ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL',
            systemProgram:     '11111111111111111111111111111111',
        };
        const hasWeb3 = () => typeof solanaWeb3 !== 'undefined';
        function hexToBytes(hex) {
            hex = (hex || '').replace(/^0x/, '').trim();
            if (hex.length % 2) throw new Error('odd-length hex');
            const out = new Uint8Array(hex.length / 2);
            for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
            return out;
        }
        const bytesToHex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
        function writeIntLE(buf, off, value, bytes) {
            let v = BigInt(value);
            for (let i = 0; i < bytes; i++) { buf[off + i] = Number(v & 0xffn); v >>= 8n; }
        }
        async function anchorDiscriminator(name) {
            const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('global:' + name)));
            return hash.slice(0, 8);
        }
        function ataFor(owner, mint) {
            const w = solanaWeb3;
            return w.PublicKey.findProgramAddressSync(
                [owner.toBytes(), new w.PublicKey(ESCROW.tokenProgram).toBytes(), mint.toBytes()],
                new w.PublicKey(ESCROW.assocTokenProgram))[0];
        }
        // Lock `amountMicro` (micro-USDC) for a provider. `providerPayout` is the
        // provider's payout pubkey; `providerNodeKeyHex` its 32-byte node identity.
        async function escrowCreateJob({ providerPayout, providerNodeKeyHex, amountMicro, timeoutSecs = 3600, mint: mintStr, programId: programStr }) {
            if (!hasWeb3()) throw new Error('Solana web3 not loaded (offline?).');
            const w = solanaWeb3;
            const wallet = window.phantom?.solana || window.solana;
            if (!wallet) throw new Error('No Solana wallet found.');
            const { publicKey: consumer } = await wallet.connect();
            const programId = new w.PublicKey(programStr || ESCROW.programId);
            const provider = new w.PublicKey(providerPayout);
            const mint = new w.PublicKey(mintStr || ESCROW.mint);
            const nodeKey = hexToBytes(providerNodeKeyHex);
            if (nodeKey.length !== 32) throw new Error('provider node key must be 32 bytes (64 hex chars).');
            const jobId = crypto.getRandomValues(new Uint8Array(16));
            const enc = new TextEncoder();
            const [job]   = w.PublicKey.findProgramAddressSync([enc.encode('job'), consumer.toBytes(), jobId], programId);
            const [vault] = w.PublicKey.findProgramAddressSync([enc.encode('vault'), job.toBytes()], programId);
            const consumerToken = ataFor(consumer, mint);
            // data = disc(8) ++ job_id(16) ++ amount(u64 LE) ++ timeout(i64 LE) ++ node_key(32)
            const disc = await anchorDiscriminator('create_job');
            const data = new Uint8Array(8 + 16 + 8 + 8 + 32);
            let o = 0;
            data.set(disc, o); o += 8;
            data.set(jobId, o); o += 16;
            writeIntLE(data, o, amountMicro, 8); o += 8;
            writeIntLE(data, o, timeoutSecs, 8); o += 8;
            data.set(nodeKey, o);
            const keys = [
                { pubkey: consumer,     isSigner: true,  isWritable: true  },
                { pubkey: provider,     isSigner: false, isWritable: false },
                { pubkey: mint,         isSigner: false, isWritable: false },
                { pubkey: job,          isSigner: false, isWritable: true  },
                { pubkey: vault,        isSigner: false, isWritable: true  },
                { pubkey: consumerToken, isSigner: false, isWritable: true },
                { pubkey: new w.PublicKey(ESCROW.tokenProgram),  isSigner: false, isWritable: false },
                { pubkey: new w.PublicKey(ESCROW.systemProgram), isSigner: false, isWritable: false },
            ];
            const ix = new w.TransactionInstruction({ programId, keys, data });
            const conn = new w.Connection(ESCROW.rpcUrl, 'confirmed');
            const { blockhash, lastValidBlockHeight } = await conn.getLatestBlockhash();
            const tx = new w.Transaction({ feePayer: consumer, blockhash, lastValidBlockHeight });
            tx.add(ix);
            const sent = await wallet.signAndSendTransaction(tx);
            const signature = sent.signature || sent;
            await conn.confirmTransaction({ signature, blockhash, lastValidBlockHeight }, 'confirmed');
            return { jobAccount: job.toBase58(), jobId: bytesToHex(jobId), signature };
        }

        // Ask the gateway for a real provider to pay (payout + node key + mint +
        // price). Returns null when no gateway or no field — the deposit modal
        // then lets the user fill a devnet target by hand.
        async function gatewayProvider(epKey) {
            if (!GATEWAY_OK) return null;
            try {
                const r = await fetch('/api/providers');
                if (!r.ok) return null;
                const list = await r.json();
                const arr = Array.isArray(list) ? list : (list.providers || []);
                const p = arr[0];
                // ProviderAnnouncement.identity is the node's hex EndpointId.
                const id = p && (typeof p.identity === 'string' ? p.identity : (p.identity && p.identity[0]));
                if (!id) return null;
                // Pull the node's full quote: payout, mint, price, node key.
                const ir = await fetch('/api/info?to=' + encodeURIComponent(id));
                if (!ir.ok) return null;
                const info = await ir.json();
                return {
                    payout:    info.solana_pubkey || '',
                    nodeKey:   info.endpoint_id || id,   // hex 32-byte node identity
                    mint:      info.usdc_mint || null,
                    programId: info.escrow_program || null,
                    price:     info.price_usdc != null ? info.price_usdc : null,
                };
            } catch (e) { return null; }
        }

        // Per-endpoint escrow session the user has funded (key -> {jobAccount…}).
        VM.sessions = VM.sessions || {};
        // A small modal: connect wallet, confirm amount + provider, sign create_job.
        async function openEscrowDeposit(ep) {
            const body = createWindow('escrow-' + (ep.key || 'x'), 'Deposit USDC · escrow', 'fa-lock', 460);
            if (!body) return;
            const gp = await gatewayProvider(ep.key);
            const price = (gp && gp.price != null) ? gp.price : (ep && ep.price ? ep.price : 0.05);
            const suggested = Math.max(price * 20, 0.10); // ~20 requests of headroom
            const useProgram = (gp && gp.programId) || ESCROW.programId;
            const useMint = (gp && gp.mint) || ESCROW.mint;
            const short = s => s ? s.slice(0, 4) + '…' + s.slice(-4) : '—';
            body.innerHTML = `
                <p class="text-xs text-zinc-500 mb-4">Lock USDC in the on-chain escrow (devnet). The provider verifies the deposit before running, and you release payment as you consume. Phantom signs — your keys never leave the wallet.</p>
                <label class="text-[11px] text-zinc-400 block mb-1">Amount to deposit (USDC)</label>
                <input id="esc-amt" type="number" min="0" step="0.01" value="${suggested.toFixed(2)}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm font-mono mb-3 focus:outline-none focus:border-[#ccff33]">
                <label class="text-[11px] text-zinc-400 block mb-1">Provider payout address</label>
                <input id="esc-prov" placeholder="provider USDC wallet (base58)" value="${escAttr(gp?.payout)}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs font-mono mb-3 focus:outline-none focus:border-[#ccff33]">
                <label class="text-[11px] text-zinc-400 block mb-1">Provider node key <span class="text-zinc-600">(64 hex)</span></label>
                <input id="esc-node" placeholder="32-byte node identity, hex" value="${escAttr(gp?.nodeKey)}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs font-mono mb-4 focus:outline-none focus:border-[#ccff33]">
                <button id="esc-go" class="w-full py-3 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-xl text-sm">Sign & deposit with Phantom</button>
                <div id="esc-out" class="text-[11px] font-mono mt-4"></div>
                <p class="text-[10px] text-zinc-600 mt-3"><i class="fa-solid fa-circle-info mr-1"></i>${gp ? 'Provider auto-filled from the gateway. ' : ''}Program <span class="text-zinc-400">${short(useProgram)}</span>, mint <span class="text-zinc-400">${short(useMint)}</span>. Fund your wallet with the matching USDC first.</p>`;
            const out = body.querySelector('#esc-out');
            body.querySelector('#esc-go').onclick = async () => {
                const amount = parseFloat(body.querySelector('#esc-amt').value);
                const providerPayout = body.querySelector('#esc-prov').value.trim();
                const providerNodeKeyHex = body.querySelector('#esc-node').value.trim();
                if (!(amount > 0)) { out.innerHTML = '<span class="text-rose-400">Set an amount.</span>'; return; }
                if (!providerPayout || !providerNodeKeyHex) { out.innerHTML = '<span class="text-rose-400">Provider payout and node key are required.</span>'; return; }
                out.innerHTML = '<span class="text-zinc-400">Awaiting Phantom signature…</span>';
                try {
                    const r = await escrowCreateJob({
                        providerPayout, providerNodeKeyHex,
                        amountMicro: Math.round(amount * 1e6),
                        mint: (gp && gp.mint) || undefined,
                        programId: (gp && gp.programId) || undefined,
                    });
                    if (ep && ep.key) { VM.sessions[ep.key] = { jobAccount: r.jobAccount, jobId: r.jobId, remaining: amount }; saveVM(); }
                    recordReceipt('deposit', (ep && ep.key) || 'escrow', amount, 0);
                    out.innerHTML = `<span class="text-[#ccff33]">✓ Deposited $${amount.toFixed(2)} USDC</span>`
                        + `<div class="text-zinc-500 mt-1 break-all">job ${r.jobAccount}</div>`
                        + `<div class="text-zinc-500 break-all">tx ${r.signature}</div>`
                        + `<a class="text-[#ccff33] hover:text-white" target="_blank" href="https://explorer.solana.com/tx/${r.signature}?cluster=devnet">view on explorer →</a>`;
                } catch (e) {
                    out.innerHTML = `<span class="text-rose-400">⚠ ${(e.message || e).toString().replace(/</g, '&lt;')}</span>`;
                }
            };
        }

        // ================= boot ===========================================
        // Build marker — check the console to confirm you're on the latest
        // deploy (not a cached/old version).
        console.info('%cCloudiyOS%c build 2026-07-08 · pay-per-message · no upfront deposit',
            'color:#ccff33;font-weight:bold', 'color:#888');
        (async () => {
            const bar = document.getElementById('boot-bar'), msg = document.getElementById('boot-msg');
            const steps = [
                ['mounting encrypted volume…', 30],
                ['verifying identity…', 55],
                [`restoring ${VM.installed.length} installed image${VM.installed.length === 1 ? '' : 's'}…`, 80],
                ['connecting to compute network…', 100],
            ];
            for (const [m, p] of steps) { msg.textContent = m; bar.style.width = p + '%'; await sleep(380); }
            document.getElementById('boot').style.transition = 'opacity .4s';
            document.getElementById('boot').style.opacity = '0';
            setTimeout(() => document.getElementById('boot').remove(), 450);
            showLogin();
        })();

        // ---------- login: the machine unlocks with a Solana identity ------
        function showLogin() {
            document.getElementById('login-vm').textContent = 'vm://' + VM.name;
            if (walletPubkey) {
                // Wallet already trusted this site: one click to enter.
                document.getElementById('login-avatar').src =
                    'https://api.dicebear.com/7.x/identicon/svg?seed=' + walletPubkey;
                document.getElementById('login-hint').textContent = 'Welcome back.';
                document.getElementById('login-btn').innerHTML =
                    `<i class="fa-solid fa-wallet mr-2"></i>Enter as ${walletPubkey.slice(0, 4)}…${walletPubkey.slice(-4)}`;
            }
            const login = document.getElementById('login');
            login.classList.remove('hidden');
            login.classList.add('flex');
        }

        async function loginConnect() {
            if (walletPubkey) { enterDesktop(); return; }
            const provider = window.phantom?.solana || window.solana;
            if (provider) {
                try {
                    const resp = await provider.connect();
                    walletPubkey = resp.publicKey.toString();
                    try { localStorage.setItem('cloudiy_wallet', walletPubkey); } catch (e) {}
                    enterDesktop();
                } catch (err) {
                    console.warn('Wallet connection rejected:', err);
                }
                return;
            }
            if (confirm('No Solana wallet detected.\n\nOK: install Phantom\nCancel: continue in demo mode')) {
                window.open('https://phantom.com/', '_blank');
            } else {
                loginDemo();
            }
        }

        function loginDemo() {
            walletPubkey = 'DemoWa11etCLoUD1Yxxxxxxxxxxxxxxxxxxxxxxxxxxx';
            enterDesktop();
        }

        function enterDesktop() {
            const login = document.getElementById('login');
            login.style.transition = 'opacity .35s';
            login.style.opacity = '0';
            setTimeout(() => login.remove(), 400);
            const walletShort = walletPubkey.slice(0, 4) + '…' + walletPubkey.slice(-4);
            document.getElementById('vm-chip').textContent =
                'vm://' + VM.name + ' · ' + walletShort;
            // Start menu header = the user's wallet: identicon avatar + short address.
            document.getElementById('start-avatar').src =
                'https://api.dicebear.com/7.x/identicon/svg?seed=' + walletPubkey;
            document.getElementById('start-username').textContent = walletShort;
            renderDesktop();
        }
    </script>
</body>
</html>
