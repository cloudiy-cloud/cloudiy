<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Machine • Cloudiy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ccff33'/%3E%3Cpath fill='%23000' d='M22.5 22h-11a4.5 4.5 0 0 1-.7-8.95 6 6 0 0 1 11.53 1.62A3.94 3.94 0 0 1 22.5 22z'/%3E%3C/svg%3E">
    <!-- Third-party scripts are pinned to exact versions and carry Subresource
         Integrity hashes: this is the origin that connects the wallet and
         builds the signed escrow transaction, so a CDN compromise or MITM must
         not be able to swap the code. (Tailwind's CDN is an unversioned dev
         build with no stable hash — replace with a compiled stylesheet before
         a production launch; see docs/SECURITY-AUDIT.md.) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Real terminal emulator for the live VM shell (via the `cloudiy os` gateway) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
            integrity="sha384-J4qzUjBl1FxyLsl/kQPQIOeINsmp17OHYXDOMpMxlKX53ZfYsL+aWHpgArvOuof9" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
            integrity="sha384-XGqKrV8Jrukp1NITJbOEHwg01tNkuXr6uB6YEj69ebpYU3v7FvoGgEg23C1Gcehk" crossorigin="anonymous"></script>
    <!-- Solana web3 for wallet-signed USDC escrow (create_job) in the browser.
         Deferred so a slow/unavailable CDN can never block the app from booting. -->
    <script defer src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.min.js"
            integrity="sha384-ujeTtvHxhu2g5lnu14Roii2ajvVKJ74KQ6eo6GGfAi0IrKZ1YkF8N68Iw5VmIJO0" crossorigin="anonymous"></script>
    <!-- QR code generator for the wallet's Receive page (renders locally; the
         public address never leaves the browser). -->
    <script defer src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
        /* Fluorescent-green scrollbars with black borders, OS-wide */
        * { scrollbar-width: thin; scrollbar-color: #ccff33 #000; }
        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-track { background: #000; border-radius: 8px; }
        *::-webkit-scrollbar-thumb { background: #ccff33; border: 2px solid #000; border-radius: 8px; }
        *::-webkit-scrollbar-thumb:hover { background: #e2ff70; }
        *::-webkit-scrollbar-corner { background: #000; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
        .desktop-icon { transition: background 0.15s ease; }
        .desktop-icon:hover { background: rgba(204, 255, 51, 0.08); }

        /* ── macOS-style dock ──────────────────────────────────────────────
           A translucent, blurred, rounded card floating at the bottom; app
           icons live here (not on the desktop). Icons are solid 3D tiles that
           magnify on hover; a dot under a tile marks a running app. */
        #dock {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: flex-end; gap: 7px;
            padding: 8px 12px; border-radius: 24px;
            background: rgba(28, 28, 34, 0.42);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 16px 48px -10px rgba(0,0,0,0.65),
                        inset 0 1px 0 rgba(255,255,255,0.18);
            /* overflow MUST stay visible on both axes so a magnified icon can
               pop above/beyond the card edge on hover (a single axis set to
               auto would force the other to clip per the CSS spec). Narrow
               screens are handled by shrinking the tiles below, macOS-style —
               the dock never scrolls. */
            z-index: 100; max-width: calc(100vw - 16px); overflow: visible;
        }
        .dock-item {
            position: relative; flex: 0 0 auto;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: transparent; padding: 0; cursor: pointer;
        }
        .dock-icon {
            width: 46px; height: 46px; border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 20px;
            transition: transform 0.18s cubic-bezier(.2,.8,.2,1);
            box-shadow: 0 5px 12px -2px rgba(0,0,0,0.55),
                        inset 0 1px 0 rgba(255,255,255,0.45),
                        inset 0 -4px 8px rgba(0,0,0,0.28);
            transform-origin: bottom center;
        }
        .dock-icon img { width: 26px; height: 26px; border-radius: 6px; object-fit: contain; }
        .dock-item:hover .dock-icon { transform: translateY(-9px) scale(1.22); }
        .dock-item:active .dock-icon { transform: translateY(-3px) scale(1.08); }
        .dock-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.85); }
        .dock-dot.off { background: transparent; }
        .dock-sep { width: 1px; align-self: stretch; margin: 6px 3px; background: rgba(255,255,255,0.14); }
        .dock-tip {
            /* Sit clear ABOVE the magnified tile (which, scaled+lifted, reaches
               ~72px) so the name never ends up behind the enlarged icon. */
            position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%);
            z-index: 20; white-space: nowrap; padding: 3px 9px; border-radius: 8px;
            background: rgba(20,20,24,0.92); border: 1px solid rgba(255,255,255,0.12);
            font-size: 11px; color: #e5e7eb; opacity: 0; pointer-events: none;
            transition: opacity 0.12s ease; box-shadow: 0 6px 16px -4px rgba(0,0,0,0.6);
        }
        .dock-item:hover .dock-tip { opacity: 1; }
        @media (prefers-reduced-motion: reduce) {
            .dock-item:hover .dock-icon { transform: none; }
            .dock-tip { transition: none; }
        }
        /* Narrow screens: shrink the tiles so the dock fits without scrolling. */
        @media (max-width: 480px) {
            #dock { gap: 5px; padding: 7px 9px; }
            .dock-icon { width: 38px; height: 38px; border-radius: 11px; font-size: 17px; }
            .dock-icon img { width: 22px; height: 22px; }
            .dock-item:hover .dock-icon { transform: translateY(-7px) scale(1.18); }
        }
        #menubar {
            position: fixed; top: 0; inset-inline: 0; height: 28px; z-index: 90;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; font-size: 12px;
            background: rgba(20,20,24,0.55); backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-bottom: 1px solid rgba(255,255,255,0.08); color: #d1d5db;
        }
        .vm-window { box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7); }
        /* Marketplace card aesthetic inside the Hardware Store */
        .gpu-card { transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1); }
        .gpu-card:hover { transform: translateY(-3px); box-shadow: 0 0 20px rgba(204,255,51,0.2); }
        .gpu-canvas { border-radius: 14px; background: #111; }
        .titlebar { cursor: grab; user-select: none; }
        .titlebar:active { cursor: grabbing; }
        /* Resize handles: 4 edges + 4 corners. They straddle the window border
           (a few px outside, a few in) so hovering the visible edge changes the
           cursor. The window no longer clips overflow, so titlebar/body carry
           the rounded corners instead. Corners win via higher z-index. */
        .win-handle { position: absolute; z-index: 40; }
        .wh-n  { top: -4px; left: 16px; right: 16px; height: 10px; cursor: n-resize; }
        .wh-s  { bottom: -4px; left: 16px; right: 16px; height: 10px; cursor: s-resize; }
        .wh-e  { right: -4px; top: 16px; bottom: 16px; width: 10px; cursor: e-resize; }
        .wh-w  { left: -4px; top: 16px; bottom: 16px; width: 10px; cursor: w-resize; }
        .wh-ne { top: -4px; right: -4px; width: 20px; height: 20px; cursor: ne-resize; z-index: 41; }
        .wh-nw { top: -4px; left: -4px; width: 20px; height: 20px; cursor: nw-resize; z-index: 41; }
        .wh-se { bottom: -4px; right: -4px; width: 22px; height: 22px; cursor: se-resize; z-index: 41; }
        .wh-sw { bottom: -4px; left: -4px; width: 20px; height: 20px; cursor: sw-resize; z-index: 41; }
        /* Store card grid: fills as many columns as the window width allows
           (2 in a small window, more as it grows / maximizes) and the cards
           flex in size with it. Responds to the window, not the viewport. */
        .hw-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        #wallpaper {
            background:
                radial-gradient(ellipse at 70% 20%, rgba(204,255,51,0.07), transparent 55%),
                radial-gradient(ellipse at 20% 85%, rgba(204,255,51,0.05), transparent 50%),
                linear-gradient(160deg, #09090b 0%, #101012 55%, #0b0d08 100%);
        }
        @keyframes bootpulse { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
        .bootpulse { animation: bootpulse 1.2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-black text-white h-screen">

    <!-- Boot screen -->
    <!-- Login (after loading): connect a Solana wallet to enter -->
    <div id="login" class="fixed inset-0 z-[190] bg-black hidden flex-col items-center justify-center" style="background: radial-gradient(ellipse at 50% 30%, rgba(204,255,51,0.06), transparent 60%), #000;">
        <div class="w-full max-w-sm mx-4 text-center">
            <div class="w-16 h-16 bg-[#ccff33] rounded-2xl flex items-center justify-center mx-auto mb-5">
                <i class="fa-solid fa-cloud text-black text-3xl"></i>
            </div>
            <div class="font-display text-2xl tracking-tighter mb-1">CloudiyOS</div>
            <div class="text-xs text-zinc-500 font-mono mb-8" id="login-vm">vm://…</div>

            <div class="bg-zinc-900/80 border border-zinc-800 rounded-3xl p-6">
                <div class="w-16 h-16 rounded-2xl overflow-hidden ring-1 ring-zinc-700 mx-auto mb-4 bg-zinc-800">
                    <img id="login-avatar" src="https://api.dicebear.com/7.x/identicon/svg?seed=cloudiy" class="w-full h-full object-cover">
                </div>
                <div class="text-sm text-zinc-400 mb-5" id="login-hint">Your machine follows your identity. Connect to unlock it.</div>
                <button id="login-btn" onclick="loginConnect()"
                        class="w-full py-3.5 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-2xl text-sm transition-all">

    <div id="boot" class="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center">

            <i class="fa-solid fa-cloud text-black text-3xl"></i>
        </div>
        <div class="font-display text-2xl tracking-tighter mb-6">CloudiyOS</div>
        <div class="w-56 h-1 bg-zinc-900 rounded overflow-hidden">

    <!-- Menu bar (macOS-style): brand left, clock right -->

        <button onclick="toggleStart(event)" aria-label="Apps" class="w-6 h-6 flex items-center justify-center rounded-md hover:bg-white/10 transition-colors">

    <!-- Desktop -->
    <div id="wallpaper" class="fixed inset-0"></div>

    <div id="desktop" class="fixed inset-0 top-7 bottom-24 p-5">
        <div id="icon-grid" class="flex flex-col flex-wrap gap-2 h-full content-start"></div>
    </div>

    <!-- Windows layer -->
    <div id="windows"></div>

    <!-- Dock: the apps live here (rendered by renderDock) -->

    <!-- Start menu (Launchpad) — opened from the dock's cloud tile -->
    <div id="start-menu" class="hidden fixed top-9 left-3 w-64 bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl z-[150]">
        <div class="px-4 py-3 border-b border-zinc-800 flex items-center gap-x-3">
            <img id="start-avatar" alt="" class="w-9 h-9 rounded-full bg-zinc-800 border border-zinc-700 object-cover shrink-0">
            <div class="text-sm font-semibold font-mono truncate" id="start-username">—</div>
        </div>
        <button onclick="openMyVM()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-zinc-800"><i class="fa-solid fa-computer mr-2 text-[#ccff33]"></i>My Virtual Machine</button>
        <button onclick="openMyNodes()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-zinc-800"><i class="fa-solid fa-server mr-2 text-[#ccff33]"></i>My Nodes</button>
        <button onclick="openWallet()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-zinc-800"><i class="fa-solid fa-wallet mr-2 text-[#ccff33]"></i>My Wallet</button>
        <button onclick="openSettings()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-zinc-800"><i class="fa-solid fa-gear mr-2 text-[#ccff33]"></i>Settings</button>
        <div class="border-t border-zinc-800">
            <a href="index.html" class="block px-4 py-2.5 text-sm hover:bg-zinc-800 text-zinc-400"><i class="fa-solid fa-power-off mr-2"></i>Shut down (exit)</a>
        </div>
    </div>

    <script>
        // ================= VM state — the machine IS this state ==========
        // Persisted per user (localStorage stands in for the encrypted,
        // replicated network volume). No provider ever hosts the VM: state
        // lives outside providers; compute bursts onto the network per run.
        // Each wallet gets its OWN VM. The storage
        // key is namespaced by wallet pubkey and only settled once a wallet
        // connects (see bindWalletVM), so two wallets in the same browser never
        // share a VM. Before login, an unbound placeholder is used for the
        // boot/login chrome only.
        const VM_BASE_KEY = 'cloudiy_vm_v1';
        let VM_KEY = VM_BASE_KEY;
        function normalizeVM(vm) {
            vm.installed = [...new Set(Array.isArray(vm.installed) ? vm.installed : [])];
            if (!Array.isArray(vm.parts)) vm.parts = [];
            if (!Array.isArray(vm.warm)) vm.warm = [];
            if (!Array.isArray(vm.custom)) vm.custom = [];
            if (!vm.samples || typeof vm.samples !== 'object') vm.samples = {};
            return vm;
        }
        function freshVM(pk) {
            // Name derived from the wallet so the same identity always maps to
            // the same VM name and different identities differ visibly. Use the
            // start AND end of the key so wallets that share a prefix still
            // produce distinct names.
            const clean = pk ? pk.replace(/[^A-Za-z0-9]/g, '') : '';
            const slug = clean
                ? (clean.slice(0, 4) + clean.slice(-4)).toLowerCase()
                : Math.random().toString(36).slice(2, 8);
            return {
                name: 'vm-' + slug,
                created: new Date().toISOString(),
                cpu: 8, ram: 32, vram: 24, disk: 50,
                installed: [],
                parts: [],   // hardware attached from the Hardware Store
                warm: [],    // endpoints already provisioned on a node (cold start done)
                custom: [],  // user-deployed workloads (own OCI image / weights)
                samples: {}, // key → { type, src }: real outputs a model generated,
                             // reused as that endpoint's thumbnail (never copied art)
            };
        }
        function loadVM() {
            try {
                const vm = JSON.parse(localStorage.getItem(VM_KEY) || 'null');
                if (vm && Array.isArray(vm.installed)) return normalizeVM(vm);
            } catch (e) {}
            return freshVM(null);
        }
        function saveVM() {
            try { localStorage.setItem(VM_KEY, JSON.stringify(VM)); } catch (e) {}
            // Mirror the small manifest to the on-chain account (best-effort,
            // debounced; a no-op until the program is deployed + configured).
            try { if (window.CloudiyVM) CloudiyVM.schedulePush(); } catch (e) {}
        }
        // Point VM state at THIS wallet's namespace and load (or create) it.
        // First wallet to log in on a browser that still has a pre-namespacing
        // VM inherits it once; every other wallet gets a fresh VM.
        function bindWalletVM(pk) {
            if (!pk) return;
            VM_KEY = VM_BASE_KEY + ':' + pk;
            let loaded = null;
            try { loaded = JSON.parse(localStorage.getItem(VM_KEY) || 'null'); } catch (e) {}
            if (loaded && Array.isArray(loaded.installed)) { VM = normalizeVM(loaded); saveVM(); return; }
            let legacy = null;
            try { legacy = JSON.parse(localStorage.getItem(VM_BASE_KEY) || 'null'); } catch (e) {}
            if (legacy && Array.isArray(legacy.installed)) {
                VM = normalizeVM(legacy); saveVM();
                try { localStorage.removeItem(VM_BASE_KEY); } catch (e) {}
                return;
            }
            VM = freshVM(pk); saveVM();
        }
        let VM = loadVM();

        // ================= identity-portable VM state =====================
        // The small VM manifest (installed apps, rented machine, name) lives on
        // Solana in a per-identity PDA (program `cloudiy_vm`), so the SAME wallet
        // resumes on any browser/device — no central server. Large, regenerable
        // data (model output samples) stays local. Decentralised and keyless:
        // the PDA is derived from the owner and only the owner's signature can
        // write it. Dormant (localStorage-only, exactly like before) until the
        // program is deployed and CLOUDIY_VM_PROGRAM points at its real id.
        const CloudiyVM = (() => {
            const PLACEHOLDER = '11111111111111111111111111111111';
            // Deployed cloudiy_vm program (devnet). Overridable via ?vmprog= /
            // localStorage; set to PLACEHOLDER to fall back to localStorage-only.
            const DEFAULT_PROGRAM = '4mSKMwnL58DEUBR2ghvXgmVaJSqTTfD3MwboK4dAy6gv';
            let PROGRAM_ID = DEFAULT_PROGRAM;
            try {
                const q = new URLSearchParams(location.search).get('vmprog');
                if (q) { PROGRAM_ID = q; localStorage.setItem('cloudiy_vm_prog', q); }
                else PROGRAM_ID = localStorage.getItem('cloudiy_vm_prog') || DEFAULT_PROGRAM;
            } catch (e) {}
            const RPC = 'https://api.devnet.solana.com';
            const w3 = () => window.solanaWeb3;
            const enabled = () => PROGRAM_ID !== PLACEHOLDER && !!w3() && !!walletPubkey;

            // --- crypto seam: today a plaintext-JSON codec with a format byte,
            // so client-side encryption (format 1) can be added without a data
            // migration. deriveKey() is where a wallet-derived symmetric key
            // (via signMessage) will come from when encryption is turned on. ---
            const codec = {
                pack(manifest) {
                    const body = new TextEncoder().encode(JSON.stringify(manifest));
                    const out = new Uint8Array(body.length + 1);
                    out[0] = 0; out.set(body, 1); // format 0 = plaintext JSON
                    return out;
                },
                unpack(bytes) {
                    if (!bytes || !bytes.length || bytes[0] !== 0) return null;
                    try { return JSON.parse(new TextDecoder().decode(bytes.slice(1))); } catch (e) { return null; }
                },
            };
            async function deriveKey() { return null; } // future: wallet-derived key

            // --- blob store seam: the future home for large samples/artifacts
            // (encrypt via deriveKey(), upload to Arweave/Irys signed by the
            // Solana wallet, keep only the returned id + hash in the manifest).
            const blobStore = {
                async put() { throw new Error('no blob store configured (Arweave: future)'); },
                async get() { throw new Error('no blob store configured (Arweave: future)'); },
            };

            // Canonical (sorted) so equality checks don't false-trigger a push
            // just because array order differs between devices.
            // Custom deployments roam with the identity too, WITHOUT their env:
            // the manifest account is public, so secrets (HF_TOKEN…) never go
            // on-chain — env stays in this browser's localStorage only.
            const customForManifest = list => (list || [])
                .map(c => ({ key: c.key, name: c.name, image: c.image, gpu: c.gpu || '' }))
                .sort((a, b) => String(a.key).localeCompare(String(b.key)));
            const manifestFromVM = () => ({
                name: VM.name,
                installed: [...new Set(VM.installed || [])].sort(),
                parts: [...(VM.parts || [])].sort(),
                custom: customForManifest(VM.custom),
            });
            // Union-merge so an install on device A and a rent on device B both
            // survive when the two states meet.
            function mergeIntoVM(remote) {
                if (!remote) return false;
                const uni = (a, b) => [...new Set([...(a || []), ...(b || [])])];
                const bi = (VM.installed || []).length, bp = (VM.parts || []).length;
                VM.installed = uni(VM.installed, remote.installed);
                VM.parts = uni(VM.parts, remote.parts);
                if (!VM.name && remote.name) VM.name = remote.name;
                let changed = VM.installed.length !== bi || VM.parts.length !== bp;
                if (Array.isArray(remote.custom)) {
                    VM.custom = VM.custom || [];
                    const have = new Set(VM.custom.map(c => c.key));
                    remote.custom.forEach(c => {
                        if (c && c.key && c.image && !have.has(c.key)) {
                            VM.custom.push({ key: c.key, name: c.name || 'custom', image: c.image, gpu: c.gpu || '', env: {} });
                            changed = true;
                        }
                    });
                }
                if (changed) saveVM();
                return changed;
            }

            async function discriminator(name) {
                const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('global:' + name));
                return new Uint8Array(h).slice(0, 8);
            }
            const pda = owner => w3().PublicKey.findProgramAddressSync(
                [new TextEncoder().encode('vm'), owner.toBuffer()], new (w3().PublicKey)(PROGRAM_ID))[0];

            async function pull() {
                if (!enabled()) return null;
                try {
                    const conn = new (w3().Connection)(RPC, 'confirmed');
                    const owner = new (w3().PublicKey)(walletPubkey);
                    const acc = await conn.getAccountInfo(pda(owner));
                    if (!acc || !acc.data) return null;
                    const b = acc.data;
                    let o = 8 + 32 + 4 + 8 + 1; // disc, owner, version, updated_at, bump
                    const len = b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24); o += 4;
                    return codec.unpack(b.slice(o, o + len));
                } catch (e) { return null; }
            }

            async function push() {
                if (!enabled()) return false;
                try {
                    const provider = window.phantom?.solana || window.solana;
                    if (!provider) return false;
                    const W = w3();
                    const conn = new W.Connection(RPC, 'confirmed');
                    const owner = new W.PublicKey(walletPubkey);
                    const programId = new W.PublicKey(PROGRAM_ID);
                    const data = codec.pack(manifestFromVM());
                    if (data.length > 1024) return false;
                    const disc = await discriminator('set_manifest');

            { icon: 'fa-wallet',     label: 'My Wallet',          open: () => openWallet(),        id: 'wallet', dark: true, grad: 'linear-gradient(160deg,#d9ff5c,#a4dc00)' },
            { icon: 'fa-terminal',   label: 'Terminal',           open: () => openTerminal(),      id: 'term',   dark: true, grad: 'linear-gradient(160deg,#d9ff5c,#a4dc00)' },
        ];

        function dockIcon({ icon, label, onclick, id, grad, dark, app }) {
            const running = id && !!openWindows[id];
            const b = document.createElement('button');
            b.className = 'dock-item';
            b.setAttribute('aria-label', label);
            b.dataset.dockId = id || '';
            const tip = document.createElement('span'); tip.className = 'dock-tip'; tip.textContent = label;
            const tile = document.createElement('span'); tile.className = 'dock-icon'; tile.style.background = grad;
            if (app) tile.innerHTML = appGlyph(app, 'w-6 h-6', 'text-lg');
            else tile.innerHTML = `<i class="fa-solid ${icon}" style="color:${dark ? '#0b0b0d' : '#fff'}"></i>`;
            const dot = document.createElement('span'); dot.className = 'dock-dot' + (running ? '' : ' off'); dot.dataset.dot = id || '';
            b.append(tip, tile, dot);
            b.onclick = onclick;
            return b;
        }
        function dockSep() { const s = document.createElement('div'); s.className = 'dock-sep'; return s; }

        function renderDock() {
            const dock = document.getElementById('dock');
            if (!dock) return;
            dock.innerHTML = '';
            // The app-list menu opens from the cloud in the header (menubar);
            // the dock holds the apps directly, starting with the core set.
            DOCK_CORE.forEach(a => dock.appendChild(dockIcon({ ...a, onclick: a.open })));
            // Installed + user-deployed apps, after a separator.
            const extras = [];
            (VM.installed || []).forEach(k => { const app = appOf(k); if (app) extras.push(app); });
            (VM.custom || []).forEach(c => extras.push(customApp(c)));
            if (extras.length) {
                dock.appendChild(dockSep());
                extras.forEach(app => dock.appendChild(dockIcon({
                    label: app.name, app, id: 'app-' + app.key,
                    grad: 'linear-gradient(160deg,#3a3f4a,#1a1d24)',
                    onclick: () => openApp(app),
                })));
            }
        }

        // Window lifecycle only toggles the running dots — no full rebuild.
        function updateDockDots() {
            document.querySelectorAll('#dock .dock-dot').forEach(d => {
                const id = d.dataset.dot;
                d.classList.toggle('off', !(id && !!openWindows[id]));
            });
        }
        function renderTaskbar() { updateDockDots(); }

        // The desktop no longer holds app icons — they live in the dock.
        function renderDesktop() {
            const grid = document.getElementById('icon-grid');
            if (grid) grid.innerHTML = '';
            renderDock();
        }

        // Shape a custom deployment like a catalog app so openApp/appGlyph and
        // the rest of the app machinery work unchanged.
        function customApp(c) {
            return {
                key: c.key, name: c.name, image: c.image,
                icon: 'fa-cube', kind: 'shell', size: c.size || 1,
                custom: true, env: c.env || {}, gpu: c.gpu || '',
            };
        }


        // ================= My Virtual Machine =============================
        function openMyVM() {
            hideStart();
            const body = createWindow('myvm', 'My Virtual Machine', 'fa-computer', 520);
            if (!body) return;
            const used = VM.installed.reduce((s, k) => s + (appOf(k)?.size || 0), 0);
            const pct = Math.min(100, VM.disk ? used / VM.disk * 100 : 0).toFixed(0);

            // What the VM genuinely has: a persistent volume, installed apps,
            // and (if rented) a dedicated node. Compute for a run is NOT owned —
            // it is placed per run on a matching provider, so we never present a
            // fixed CPU/GPU spec as if the VM held that hardware.
            const parts = VM.parts.map(partOf).filter(Boolean);
            const machine = parts.find(p => p.kind === 'MACHINE');
            const volumes = parts.filter(p => p.kind === 'STORAGE');
            const chip = label =>
                `<span class="px-2 py-0.5 rounded-lg bg-zinc-950 border border-[#ccff33]/40 text-zinc-200 text-[10px] font-mono">${label}</span>`;

            body.innerHTML = `
                <div class="flex items-center gap-x-4 mb-5">
                    <div class="w-14 h-14 rounded-2xl bg-[#ccff33] flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-computer text-black text-2xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-display text-xl truncate">${VM.name}</div>
                        <div class="text-xs text-zinc-500 font-mono">CloudiyOS 0.1</div>
                    </div>
                    <button onclick="openHardwareStore()" class="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold shrink-0">
                        <i class="fa-solid fa-microchip text-[#ccff33] mr-1.5"></i>Hardware
                    </button>
                </div>

                <div class="text-[10px] tracking-widest text-zinc-500 mb-2">WHERE COMPUTE RUNS</div>
                ${machine ? `
                <div class="bg-zinc-950 border border-[#ccff33]/30 rounded-2xl p-4 mb-4">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-sm text-zinc-200"><i class="fa-solid fa-server text-[#ccff33] mr-2"></i>Dedicated node: ${machine.name}</span>
                        <span class="font-mono text-sm text-[#ccff33]">$${machine.price.toFixed(2)}/h</span>
                    </div>
                    <div class="text-xs text-zinc-500">${machine.spec}</div>
                    <div class="flex items-center justify-between mt-2">
                        <div class="text-[10px] text-zinc-600">Yours for the lease · node ${machine.node}</div>
                        <button onclick="detachPart('${machine.key}')" class="px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-rose-500/20 hover:text-rose-400 text-zinc-300 text-[11px] font-semibold shrink-0"><i class="fa-solid fa-plug-circle-xmark mr-1.5"></i>Disconnect</button>
                    </div>
                </div>` : `
                <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 mb-4 text-xs text-zinc-400 leading-relaxed">
                    <i class="fa-solid fa-network-wired text-[#ccff33] mr-1.5"></i>No dedicated node. Compute bursts onto the network per run: each workload is placed on a provider that has the resources it needs, runs in isolation, and settles in USDC. Nothing is owned or idle between runs.
                    <button onclick="openHardwareStore()" class="block mt-2 text-[#ccff33] hover:underline">Rent a dedicated machine →</button>
                </div>`}

                <div class="text-[10px] tracking-widest text-zinc-500 mb-2">PERSISTENT VOLUME</div>
                <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4">
                    <div class="text-[11px] text-zinc-500 leading-relaxed mb-3">Encrypted, replicated network volume. No provider hosts your VM: the state lives outside them and is restored on whichever node runs your next workload.</div>
                    <div class="mb-1 flex justify-between text-xs text-zinc-400"><span>${VM.installed.length} image${VM.installed.length === 1 ? '' : 's'} installed</span><span class="font-mono">${used.toFixed(1)} / ${VM.disk} GB</span></div>
                    <div class="h-2 bg-black border border-zinc-800 rounded-full overflow-hidden">
                        <div class="h-full bg-[#ccff33]" style="width:${pct}%"></div>
                    </div>
                    ${volumes.length ? `<div class="flex flex-wrap gap-1 mt-3">${volumes.map(v => chip(`${v.name} · $${v.price.toFixed(2)}/h`)).join('')}</div>` : ''}
                </div>`;
        }

        // ================= My Nodes (provider dashboard) ==================
        // The heart of the future desktop app: this machine AS A PROVIDER.
        // Node identity, earnings and — the opt-in part — which model endpoints
        // are installed to host locally (install = pull a public worker image +
        // announce; uninstall = stop + reclaim disk). Talks to the local
        // gateway's provider API (/api/node, /api/models[/install|uninstall]).
        const ENDPOINT_BY_KEY = Object.fromEntries(ENDPOINTS.map(e => [e.key, e]));
        const CAT_ICON = { image: 'fa-image', video: 'fa-clapperboard', audio: 'fa-wave-square', language: 'fa-comment-dots' };
        const gbytes = n => n ? (n / 1e9).toFixed(2) + ' GB' : '—';

        function openMyNodes() {
            hideStart();
            const body = createWindow('mynodes', 'My Nodes', 'fa-server', 620);
            if (!body) return;
            renderMyNodes(body);
        }

        async function renderMyNodes(body) {
            body.innerHTML = `<div class="text-center text-sm text-zinc-500 py-10"><i class="fa-solid fa-circle-notch fa-spin text-[#ccff33] mr-2"></i>Reading your node…</div>`;
            let node = null;
            try { node = await (await fetch('/api/node')).json(); } catch (e) {}
            if (!node || node.node_id === undefined || node.node_id === null) {
                body.innerHTML = `<div class="text-sm text-zinc-400 leading-relaxed bg-zinc-950 border border-zinc-800 rounded-2xl p-4">
                    <i class="fa-solid fa-server text-[#ccff33] mr-1.5"></i>My Nodes manages <span class="text-zinc-200">this machine as a provider</span>.
                    Run <code class="text-[#ccff33]">cloudiy os</code> on the computer you want to provide with, then reopen this app.</div>`;
                return;
            }
            const earned = (node.earned_micro_usdc || 0) / 1e6;
            body.innerHTML = `
                <div class="flex items-center gap-x-4 mb-5">
                    <div class="w-14 h-14 rounded-2xl bg-[#ccff33] flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-server text-black text-2xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-display text-xl truncate">My Nodes</div>
                        <div class="text-xs text-zinc-500 font-mono truncate">node ${(node.node_id || '').slice(0, 20)}…</div>
                    </div>
                    <span class="px-3 py-1 rounded-full bg-[#ccff33]/10 border border-[#ccff33]/40 text-[#ccff33] text-[11px] font-semibold shrink-0"><i class="fa-solid fa-circle text-[7px] mr-1.5 align-middle"></i>Online</span>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-5">
                    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-3">
                        <div class="text-[10px] tracking-widest text-zinc-500 mb-1">EARNED</div>
                        <div class="font-mono text-lg text-[#ccff33]">$${earned.toFixed(3)}</div>
                        <div class="text-[10px] text-zinc-600">${node.jobs} job${node.jobs === 1 ? '' : 's'} served</div>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-3">
                        <div class="text-[10px] tracking-widest text-zinc-500 mb-1">MODEL DISK</div>
                        <div class="font-mono text-lg text-zinc-100">${gbytes(node.disk_bytes)}</div>
                        <div class="text-[10px] text-zinc-600">${node.hosted_count} hosted</div>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-3">
                        <div class="text-[10px] tracking-widest text-zinc-500 mb-1">HARDWARE</div>
                        <div class="font-mono text-lg text-zinc-100">${node.gpu ? 'GPU' : 'CPU'}</div>
                        <div class="text-[10px] text-zinc-600">${node.gpu ? 'NVIDIA present' : 'no NVIDIA GPU'}</div>
                    </div>
                </div>

                <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 mb-4">
                    <div class="flex items-center justify-between mb-1">
                        <div class="text-[10px] tracking-widest text-zinc-500">AUTO-HOSTING</div>
                        <div class="flex bg-black border border-zinc-800 rounded-lg p-0.5 text-[11px]">
                            <button id="mn-mode-manual" class="px-2.5 py-1 rounded-md">Manual</button>
                            <button id="mn-mode-auto" class="px-2.5 py-1 rounded-md">Auto</button>
                        </div>
                    </div>
                    <p class="text-[11px] text-zinc-500 leading-relaxed">Let the node fill a disk budget with the most in-demand models, and reclaim idle ones. Your manual installs are always kept.</p>
                    <div id="mn-autobody" class="${node.mode === 'auto' ? '' : 'hidden'} mt-3">
                        <div class="flex items-center justify-between text-xs text-zinc-400 mb-1"><span>Disk budget</span><span class="font-mono text-[#ccff33]"><span id="mn-budget-val">${Math.max(2, Math.round((node.budget_bytes || 0) / 1e9))}</span> GB</span></div>
                        <input id="mn-budget" type="range" min="2" max="200" step="1" value="${Math.max(2, Math.round((node.budget_bytes || 8e9) / 1e9))}" class="w-full accent-[#ccff33]">
                        <button id="mn-apply" class="mt-2 w-full px-3 py-2 rounded-xl bg-[#ccff33] text-black text-[11px] font-semibold hover:brightness-110">Apply now — host the top in-demand models</button>
                        <div class="mt-3 ${(node.autohost_log && node.autohost_log.length) ? '' : 'hidden'}">
                            <div class="text-[10px] tracking-widest text-zinc-500 mb-1.5">RECENT ACTIVITY</div>
                            <div class="space-y-1">
                                ${(node.autohost_log || []).map(a => `<div class="text-[11px] flex items-start gap-x-1.5"><i class="fa-solid ${a.action === 'install' ? 'fa-circle-plus text-[#ccff33]' : 'fa-circle-minus text-zinc-600'} mt-0.5"></i><span class="text-zinc-300">${a.action === 'install' ? 'Installed' : 'Removed'} <span class="font-mono">${a.key}</span></span><span class="text-zinc-600">· ${a.reason}</span></div>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-2">
                    <div class="text-[10px] tracking-widest text-zinc-500">MODELS YOU HOST</div>
                    <button id="mn-refresh" class="text-[11px] text-zinc-400 hover:text-[#ccff33]"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button>
                </div>
                <p class="text-[11px] text-zinc-500 leading-relaxed mb-3">Installing pulls a public, digest-verifiable worker image to this machine and announces it to the network — you earn per request. Nothing is stored unless you choose it; uninstall reclaims the disk.</p>
                <div id="mn-grid" class="grid grid-cols-1 gap-2"></div>`;

            const rf = body.querySelector('#mn-refresh');
            if (rf) rf.onclick = () => renderMyNodes(body);

            // Auto-hosting controls (phase 3): mode toggle + budget + apply.
            const modeManual = body.querySelector('#mn-mode-manual');
            const modeAuto = body.querySelector('#mn-mode-auto');
            const autobody = body.querySelector('#mn-autobody');
            const paintMode = (m) => {
                modeManual.className = 'px-2.5 py-1 rounded-md ' + (m === 'manual' ? 'bg-[#ccff33] text-black font-semibold' : 'text-zinc-400');
                modeAuto.className = 'px-2.5 py-1 rounded-md ' + (m === 'auto' ? 'bg-[#ccff33] text-black font-semibold' : 'text-zinc-400');
                autobody.classList.toggle('hidden', m !== 'auto');
            };
            const setPolicy = (patch) => fetch('/api/node/policy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
            paintMode(node.mode || 'manual');
            modeManual.onclick = () => { node.mode = 'manual'; paintMode('manual'); setPolicy({ mode: 'manual' }); };
            modeAuto.onclick = () => { node.mode = 'auto'; paintMode('auto'); setPolicy({ mode: 'auto' }); };
            const budget = body.querySelector('#mn-budget');
            const budgetVal = body.querySelector('#mn-budget-val');
            if (budget) {
                budget.oninput = () => { budgetVal.textContent = budget.value; };
                budget.onchange = () => setPolicy({ budget_bytes: Math.round(budget.value * 1e9) });
            }
            const apply = body.querySelector('#mn-apply');
            if (apply) apply.onclick = async () => {
                apply.disabled = true; apply.textContent = 'Applying…';
                await setPolicy({ mode: 'auto', budget_bytes: Math.round((budget ? budget.value : 8) * 1e9) });
                try { await fetch('/api/node/autohost/run', { method: 'POST' }); } catch (e) {}
                renderMyNodes(body);
            };

            renderHostGrid(body.querySelector('#mn-grid'));
        }

        // Reusable install/uninstall grid — used by My Nodes and the App Store
        // "Host" tab. Joins /api/models host-status with the ENDPOINTS catalog.
        async function renderHostGrid(grid) {
            if (!grid) return;
            grid.innerHTML = `<div class="text-center text-xs text-zinc-500 py-6"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading catalog…</div>`;
            let data = null;
            try { data = await (await fetch('/api/models')).json(); } catch (e) {}
            if (!data || !data.models) {
                grid.innerHTML = `<div class="text-xs text-zinc-500 py-6 text-center">Couldn't reach the node API. Is <code class="text-[#ccff33]">cloudiy os</code> running here?</div>`;
                return;
            }
            grid.innerHTML = '';
            data.models.forEach(m => grid.appendChild(hostCard(m, grid)));
        }

        function hostCard(m, grid) {
            const meta = ENDPOINT_BY_KEY[m.key] || { model: m.key, cat: m.category };
            const card = document.createElement('div');
            card.className = 'bg-zinc-950 border border-zinc-800 rounded-2xl p-3 flex items-center gap-x-3';
            const blocked = m.gpu_required && !m.runnable_here;
            const sizeTxt = m.size_bytes ? gbytes(m.size_bytes) : (m.gpu_required ? 'GPU worker' : 'CPU worker');
            let btn;
            if (m.installed) {
                btn = `<button data-act="uninstall" class="px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-rose-500/20 hover:text-rose-400 text-zinc-300 text-[11px] font-semibold shrink-0">Uninstall</button>`;
            } else if (blocked) {
                btn = `<button disabled class="px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-600 text-[11px] font-semibold shrink-0 cursor-not-allowed">Needs NVIDIA</button>`;
            } else {
                btn = `<button data-act="install" class="px-3 py-1.5 rounded-xl bg-[#ccff33] text-black hover:brightness-110 text-[11px] font-semibold shrink-0">Install</button>`;
            }
            const status = m.installed
                ? `<span class="text-[#ccff33]">${m.warm ? '● Hosted · warm' : '● Hosted'}</span>`
                : (blocked ? '<span class="text-zinc-600">GPU-only</span>' : '<span class="text-zinc-500">Not installed</span>');
            card.innerHTML = `
                <div class="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center shrink-0"><i class="fa-solid ${CAT_ICON[meta.cat] || 'fa-brain'} text-[#ccff33]"></i></div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm text-zinc-100 truncate">${meta.model}${m.pinned ? ' <i class="fa-solid fa-shield-halved text-[#ccff33] text-[10px]" title="digest-pinned · pulled by sha256 and verified"></i>' : ''} <span class="text-[10px] text-zinc-500">· ${SERVED_BY[m.key] || meta.cat}</span></div>
                    <div class="text-[11px] text-zinc-500">${status} · <span class="font-mono">${sizeTxt}</span></div>
                </div>
                <div class="mn-btnwrap shrink-0">${btn}</div>`;
            const b = card.querySelector('button[data-act]');
            if (b) b.onclick = () => hostAction(m.key, b.dataset.act, card, grid);
            return card;
        }

        async function hostAction(key, act, card, grid) {
            const wrap = card.querySelector('.mn-btnwrap');
            wrap.innerHTML = `<span class="text-[11px] text-zinc-400"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>${act === 'install' ? 'Installing…' : 'Removing…'}</span>`;
            let r = null;
            try {
                r = await (await fetch('/api/models/' + act, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key }),
                })).json();
            } catch (e) {}
            if (!r || !r.ok) {
                const msg = (r && (r.hint || r.error)) || 'failed';
                wrap.innerHTML = `<span class="text-[11px] text-rose-400" title="${((r && r.error) || '').replace(/"/g, '')}">${msg.slice(0, 30)}</span>`;
                setTimeout(() => renderHostGrid(grid), 2800);
                return;
            }
            renderHostGrid(grid);
        }

        // ================= App Store ======================================
        function openStore() {
            hideStart();
            const body = createWindow('store', 'App Store', 'fa-store', 780);
            if (!body) return;
            renderStore(body);
        }
        function renderStore(body) {
            body.innerHTML = `
                <div class="flex items-center justify-center gap-x-6 mb-3" id="hub-tabs">
                    <button data-tab="templates" class="text-sm pb-1"></button>
                    <button data-tab="repos" class="text-sm pb-1"></button>
                    <button data-tab="host" class="text-sm pb-1"></button>
                </div>
                <p id="store-intro" class="text-xs text-zinc-500 leading-relaxed mb-3 text-center"><span class="text-zinc-300">Deploy and own a running instance</span> (your own weights, warm, private). Just want to call a model per request? <button id="store-gomodels" class="text-[#ccff33] hover:underline">Open Models →</button></p>
                <button id="store-deployown" class="w-full mb-4 flex items-center justify-between bg-zinc-950 border border-dashed border-zinc-700 hover:border-[#ccff33]/60 rounded-2xl px-4 py-3 text-left transition-colors">
                    <span class="text-sm text-zinc-200"><i class="fa-solid fa-cube text-[#ccff33] mr-2"></i>Deploy your own <span class="text-zinc-500 text-xs ml-1">bring an OCI image, or your own fine-tuned weights</span></span>
                    <i class="fa-solid fa-arrow-right text-zinc-500"></i>
                </button>
                <div class="flex gap-x-2 mb-4">
                    <div class="flex-1 relative">
                        <input id="store-search" placeholder="What are you looking for?" value="${storeQuery.replace(/"/g, '&quot;')}"
                               class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-4 pr-9 py-2.5 text-sm focus:outline-none focus:border-[#ccff33]">
                        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-zinc-600 text-xs"></i>
                    </div>
                    <select id="store-sort" class="bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-300 focus:outline-none focus:border-[#ccff33]">
                        <option value="popular">Most popular</option>
                        <option value="name">Name A–Z</option>
                        <option value="size">Smallest first</option>
                    </select>
                </div>
                <div id="store-tabs" class="flex gap-x-5 border-b border-zinc-800 mb-4 overflow-x-auto"></div>
                <div id="store-grid" class="grid grid-cols-2 gap-3"></div>
                <div id="store-empty" class="hidden text-center text-sm text-zinc-500 py-10">Nothing matches your search.</div>`;

            // Top-level hub tabs: templates (one-click pods) vs repos (install
            // to VM). Model endpoints live in their own Models window now.
            const HUB_LABEL = { templates: 'Templates', repos: 'Serverless Repos', host: 'Host on my node' };
            body.querySelectorAll('#hub-tabs button').forEach(b => {
                const active = hubTab === b.dataset.tab;
                b.className = active
                    ? 'text-sm pb-1 text-[#ccff33] border-b-2 border-[#ccff33] font-medium'
                    : 'text-sm pb-1 text-zinc-400 hover:text-white border-b-2 border-transparent';
                b.textContent = HUB_LABEL[b.dataset.tab];
                b.onclick = () => { hubTab = b.dataset.tab; storeCat = 'all'; renderStore(body); };
            });

            // Host tab: providers install model endpoints onto THIS machine.
            // Reuses the My Nodes install/uninstall grid; hides the deploy/search
            // chrome that only applies to the consumer-facing store tabs.

        function renderStoreGrid(body) {
            const grid = body.querySelector('#store-grid');

        // ================= Models =========================================

        // Keyless community inference relay (pollinations.ai) — free tier, no
        // signup. Used as the image fallback when no local `cloudiy os`
        // gateway is serving real network inference, so image endpoints
        // generate for real even on the static deploy. Loaded as an <img>
        // subresource: the relay Turnstile-blocks scripted fetch() but serves
        // plain tag loads.
        const RELAY_IMG = 'https://image.pollinations.ai/prompt/';

        // --- Untrusted-string guards -------------------------------------
        // Model endpoints and provider announcements come from remote nodes
        // over the gateway; anything from them that lands in the DOM must be
        // treated as hostile. `escAttr` neutralizes an HTML-attribute break-out;
        // `safeMediaUrl` allows only http(s)/data URLs free of markup chars.
        function escAttr(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function safeMediaUrl(u) {
            if (typeof u !== 'string' || u.length > 2048) return false;
            if (/["'<>`\s]/.test(u)) return false;
            return /^(https?:|data:|\/)/i.test(u);
        }

        // Procedural thumbnail — deterministic per endpoint (honest placeholder
        // until real sample outputs ship with the serverless runtime).
        function drawThumb(canvas, seedText) {
            const ctx = canvas.getContext('2d');
            let seed = [...seedText].reduce((a, c) => a + c.charCodeAt(0), 11);
            const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
            const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            g.addColorStop(0, `hsl(${rnd() * 360}, 45%, 13%)`);
            g.addColorStop(1, `hsl(${rnd() * 360}, 55%, 26%)`);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 26; i++) {
                ctx.beginPath();
                ctx.arc(rnd() * canvas.width, rnd() * canvas.height, rnd() * 34 + 3, 0, 7);
                ctx.fillStyle = `hsla(${68 + rnd() * 45}, 90%, ${48 + rnd() * 32}%, ${0.05 + rnd() * 0.14})`;
                ctx.fill();
            }
            ctx.strokeStyle = 'rgba(204,255,51,0.35)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * (0.3 + rnd() * 0.5));
            for (let x = 0; x <= canvas.width; x += 14) {
                ctx.lineTo(x, canvas.height * (0.25 + rnd() * 0.55));
            }
            ctx.stroke();
        }

        // Real run count for a model = how many times THIS wallet has actually
        // called it (from local receipts). There is no network-wide telemetry to
        // pull a global popularity number from, so we show the honest local count
        // (0 until you run it) rather than a fabricated marketplace figure.
        function epRuns(key) {
            try { return (VM.receipts || []).filter(r => r.kind === 'endpoint' && r.ref === key).length; }
            catch (e) { return 0; }
        }
        function endpointCard(ep) {
            const card = document.createElement('div');
            card.className = 'bg-zinc-950 border border-zinc-800 hover:border-zinc-600 rounded-2xl p-3 flex flex-col transition-all cursor-pointer';
            // Thumbnail = a real output this model generated (cached after a run
            // on a GPU node), otherwise a placeholder. Never external sample art.
            // `sample.src` may be a cached gateway/relay URL from an earlier
            // run (possibly a stale, pre-validation localStorage entry), so
            // gate the scheme and escape before it re-enters the DOM.
            const sample = VM.samples[ep.key];
            let thumb;
            if (sample && sample.type === 'image' && safeMediaUrl(sample.src)) {
                thumb = `<img src="${escAttr(sample.src)}" alt="${escAttr(ep.model)} sample" class="w-full h-40 object-cover rounded-xl mb-3">`;
            } else if (sample && sample.type === 'video' && safeMediaUrl(sample.src)) {
                thumb = `<video src="${escAttr(sample.src)}" muted playsinline preload="metadata" class="w-full h-40 object-cover rounded-xl mb-3"></video>`;
            } else {
                thumb = `<canvas width="340" height="160" class="w-full rounded-xl mb-3"></canvas>`;
            }
            card.innerHTML = `
                ${thumb}
                <div class="text-sm font-medium mb-1">${ep.vendor} <span class="text-zinc-500">/</span> ${ep.model}</div>
                <div class="text-xs text-zinc-500 leading-relaxed flex-1">${ep.desc}</div>
                ${SERVED_BY[ep.key] ? `<div class="text-[10px] text-zinc-600 mt-2"><i class="fa-solid fa-microchip mr-1"></i>runs on: <span class="text-zinc-400">${SERVED_BY[ep.key]}</span></div>` : ''}

                    <span class="text-[10px] text-zinc-500 font-mono">$${ep.price}/req · ${epRuns(ep.key).toLocaleString()} runs</span>
                </div>`;
            const cv = card.querySelector('canvas');
            if (cv) drawThumb(cv, ep.key + ep.model);
            const btn = document.createElement('button');
            btn.className = 'mt-3 w-full py-2 rounded-xl bg-[#ccff33] hover:bg-white text-black text-xs font-semibold';
            btn.textContent = 'Run';
            btn.onclick = (e) => { e.stopPropagation(); openEndpoint(ep); };
            card.onclick = () => openEndpoint(ep);
            card.appendChild(btn);
            return card;
        }

        // Endpoint playground: prompt in, x402 per request, output by task type.
        function openEndpoint(ep) {
            hideStart();

            // get the full playground (Input | Result, like the reference).
            if (TASK_KIND(ep.task) === 'chat') {

                if (!body) return;

            focusSoon(body.querySelector('#ep-prompt'));
        }

        // ---- endpoint playground: Input | Result, tabs Playground/API ----
        // Per-endpoint usage receipts (persisted). Written on each completed
        // run; power the playground analytics strip and the wallet Activity tab.
        function recordReceipt(kind, ref, price, latencyMs, warm) {
            if (!Array.isArray(VM.receipts)) VM.receipts = [];
            VM.receipts.push({ kind, ref, price: +price || 0, at: nowMs(), latency: latencyMs | 0, warm: !!warm });
            if (VM.receipts.length > 500) VM.receipts = VM.receipts.slice(-500);
            saveVM();
        }
        function endpointStats(key) {
            const rs = (VM.receipts || []).filter(r => r.kind === 'endpoint' && r.ref === key);
            const lat = rs.filter(r => r.latency > 0).map(r => r.latency);
            return {
                runs: rs.length,
                spent: rs.reduce((s, r) => s + r.price, 0),
                avgLat: lat.length ? Math.round(lat.reduce((a, b) => a + b, 0) / lat.length) : 0,
            };
        }
        // Millisecond clock (kept as one call site so it's easy to reason about).
        function nowMs() { return new Date().getTime(); }

r = requests.post(

                        for (let i = 0; i < 72; i++) {
                            const bar = document.createElement('div');
                            bar.style.height = (12 + Math.abs(Math.sin(i * 0.4 + prompt.length)) * 80) + '%';
                            bar.className = 'flex-1 bg-[#ccff33]/70 rounded-sm';
                            wave.appendChild(bar);
                        }
                        wrap.appendChild(wave);
                    }
                    const barUi = document.createElement('div');
                    barUi.className = 'flex items-center gap-x-2 mt-3 text-xs text-zinc-500';
                    barUi.innerHTML = '<i class="fa-solid fa-play text-[#ccff33]"></i><div class="flex-1 h-1 bg-zinc-800 rounded"></div><span class="font-mono">0:00 / 0:15</span>';
                    wrap.appendChild(barUi);
                    preview.appendChild(wrap);
                } else {
                    const canvas = document.createElement('canvas');
                    canvas.width = 560; canvas.height = 315;
                    canvas.className = 'w-full rounded-xl';
                    let seed = [...prompt].reduce((a, c) => a + c.charCodeAt(0), 7);
                    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
                    const ctx = canvas.getContext('2d');
                    const g = ctx.createLinearGradient(0, 0, 560, 315);
                    g.addColorStop(0, `hsl(${rnd() * 360},45%,12%)`);
                    g.addColorStop(1, `hsl(${rnd() * 360},60%,24%)`);
                    ctx.fillStyle = g; ctx.fillRect(0, 0, 560, 315);
                    for (let i = 0; i < 40; i++) {
                        ctx.beginPath();
                        ctx.arc(rnd() * 560, rnd() * 315, rnd() * 58 + 4, 0, 7);
                        ctx.fillStyle = `hsla(${68 + rnd() * 40},90%,${50 + rnd() * 30}%,${0.05 + rnd() * 0.12})`;
                        ctx.fill();
                    }
                    ctx.fillStyle = 'rgba(204,255,51,.85)'; ctx.font = '11px monospace';
                    ctx.fillText(isVideo ? '▶ demo frame · live model soon' : '✦ demo render · live model soon', 12, 300);
                    preview.appendChild(canvas);
                    if (isVideo) {
                        const player = document.createElement('div');
                        player.className = 'flex items-center gap-x-2 mt-3 text-xs text-zinc-500 w-full';
                        player.innerHTML = `<i class="fa-solid fa-play text-[#ccff33]"></i><div class="flex-1 h-1 bg-zinc-800 rounded"><div class="h-1 w-1/3 bg-[#ccff33] rounded"></div></div><span class="font-mono">0:0${Math.min(2, +(getDuration() || '5s').replace('s','') - 3)} / 0:0${(getDuration() || '5s').replace('s','')}</span>`;
                        preview.appendChild(player);
                    }
                    downloadUrl = canvas.toDataURL('image/png');
                    downloadName = ep.key + (isVideo ? '-frame.png' : '.png');
                }

                // JSON tab + download + status
                const receipt = { success: true, settledVia: 'usdc', payee: 'GnaU…sFJP' };
                q('#ep-json').textContent = JSON.stringify({
                    model: `${ep.vendor}/${ep.model}`,
                    task: ep.task,
                    input: {
                        prompt,
                        ...(getDuration() ? { duration: getDuration() } : {}),
                        ...(getSize() ? { size: getSize() + 'px' } : {}),
                        ...(q('#ep-ref')?.value ? { reference: q('#ep-ref').value } : {}),
                    },
                    price_usdc: ep.price,
                    receipt,
                    output: '[demo preview · live inference ships with the serverless runtime]',
                }, null, 2);

                const dl = q('#ep-dl');
                if (downloadUrl) {
                    dl.disabled = false;
                    dl.className = 'ml-auto px-3 py-1.5 rounded-xl bg-zinc-950 border border-[#ccff33]/50 text-[11px] text-[#ccff33] hover:bg-zinc-900';
                    dl.onclick = () => {
                        const a = document.createElement('a');
                        a.href = downloadUrl; a.download = downloadName; a.click();
                    };
                }
                setStatus('Complete');
                btn.disabled = false; btn.textContent = 'Run';
            };
        }
        // Pod Template card: tier badge + the docker image(s) it deploys.
        // Template card. Clicking it opens the template's detail page in the
        // same store window (see openTemplateDetail).
        // Real, local deploy counter — starts at 0 and grows with actual
        // completed deploys (no fabricated numbers). Swap for a backend metric
        // when the network tracks deploys centrally (handoff item E).
        function loadDeploys() { try { return JSON.parse(localStorage.getItem('cloudiy_deploys') || '{}'); } catch (e) { return {}; } }
        function deployCount(key) { return loadDeploys()[key] || 0; }
        function bumpDeploy(key) { const d = loadDeploys(); d[key] = (d[key] || 0) + 1; try { localStorage.setItem('cloudiy_deploys', JSON.stringify(d)); } catch (e) {} }

        function templateCard(tpl, storeBody) {
            const apps = tpl.apps.map(appOf).filter(Boolean);
            // Trust is shown two ways now: the author line tells you who made it
            // (official = Cloudiy, or a community author), and a green check next

            // is replaced by an inline Install/Uninstall action.

            card.innerHTML = `

        // Card-level Install/Uninstall for a template (stops the click from
        // opening the detail page). Install adds every app image to the VM;
        // Uninstall removes them. The grid re-renders so the border + button flip.
        function toggleTemplateInstall(tpl, storeBody, ev) {
            ev.stopPropagation();
            const apps = tpl.apps.map(appOf).filter(Boolean);
            if (!apps.length) return;
            const deployed = apps.every(a => VM.installed.includes(a.key));
            if (deployed) {
                VM.installed = VM.installed.filter(k => !apps.some(a => a.key === k));

            saveVM();
            renderDesktop();
            renderStoreGrid(storeBody);
        }

        // Inline `code` markup for template detail text: escape, then turn
        // markdown backticks into styled <code> (content is trusted, static).
        function mdCode(s) {
            const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return s.split('`').map((part, i) => i % 2
                ? `<code class="text-[#ccff33] bg-zinc-900 px-1 py-0.5 rounded text-[0.92em]">${esc(part)}</code>`
                : esc(part)).join('');
        }

        // Template detail page — rendered into the store window itself.
        function openTemplateDetail(tpl, storeBody) {
            const apps = tpl.apps.map(appOf).filter(Boolean);
            const deployed = apps.length > 0 && apps.every(a => VM.installed.includes(a.key));

                    <div class="text-sm font-medium mb-1">${t.name}</div>

            storeBody.innerHTML = `

                        <p class="text-zinc-300 text-sm leading-relaxed mb-4">${mdCode(tpl.intro || tpl.desc)}</p>
                        ${tpl.included ? `

                            <button id="tpl-browse" class="text-[#ccff33] hover:underline">Templates</button> section, or the

                        <div class="hidden h-1.5 bg-zinc-900 border border-zinc-800 rounded-full overflow-hidden mb-2 progress"><div class="h-full bg-[#ccff33] transition-all duration-200" style="width:0%"></div></div>
                        <div class="hidden text-[10px] text-zinc-500 font-mono mb-3 pull-log"></div>

                                ? 'Bundle of ' + apps.length + ' images. One-VM bundle deploy is on the way; today this records a preview.'

                        <div class="border-t border-zinc-800 mt-4 pt-2">

                ${siblings.length ? `

                </div>` : ''}`;

            storeBody.querySelector('#tpl-back').onclick = () => renderStore(storeBody);
            storeBody.querySelector('#tpl-browse').onclick = () => renderStore(storeBody);
            storeBody.querySelectorAll('.tpl-sib').forEach(el =>
                el.onclick = () => openTemplateDetail(TEMPLATES.find(t => t.key === el.dataset.key), storeBody));
            const btn = storeBody.querySelector('#tpl-deploy');
            btn.onclick = () => apps.every(a => VM.installed.includes(a.key))
                ? openApp(apps[0])

        // Deploy from the template detail page, progress under the button.
        async function deployTemplateDetail(tpl, btn, storeBody) {
            await deployTemplate(tpl, storeBody, btn);
            btn.className = 'w-full py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold text-sm mb-2';
            const apps = tpl.apps.map(appOf).filter(Boolean);
            btn.onclick = () => openApp(apps[0]);
        }
        async function deployTemplate(tpl, card, btn) {
            const apps = tpl.apps.map(appOf).filter(Boolean);
            if (!apps.length) return;
            const cfg = readDeployConfig(card);
            btn.disabled = true; btn.textContent = 'Deploying…';
            const bar = card.querySelector('.progress'), fill = bar.firstElementChild;
            const log = card.querySelector('.pull-log');
            bar.classList.remove('hidden'); log.classList.remove('hidden');
            if (cfg.version) { logDeployConfig(log, cfg); await sleep(400); }

            const finish = (msg) => {
                apps.forEach(app => { if (!VM.installed.includes(app.key)) VM.installed.push(app.key); });
                bumpDeploy(tpl.key);
                saveVM();
                log.textContent = msg;
                btn.disabled = false; btn.textContent = 'Open';
                btn.className = 'mt-3 w-full py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold';
                renderDesktop();
            };

            // Real path: a SINGLE-image template maps cleanly onto the one-container
            // VM, so with a gateway and a connected node we actually provision it
            // via /api/vm/up (the same call the terminal + custom deploy use).
            // Multi-image bundles have no one-VM mapping yet, and with no
            // gateway/node there is nothing to run — both fall back to a labeled
            // preview that only records the app on the VM manifest.
            const conn = JSON.parse(localStorage.getItem('cloudiy_conn') || '{}');
            const node = conn.node;
            if (GATEWAY_OK && node && apps.length === 1) {
                const app = apps[0];
                log.textContent = `→ vm up ${app.image} on ${node.slice(0, 4)}…${node.slice(-4)} via the local gateway`;
                try {
                    const r = await fetch(GW_HTTP + '/api/vm/up', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ to: node, image: app.image, cpu: 2, memory_mb: 2048, ports: [], token: (VM.token || conn.token || undefined) }),
                    });
                    const d = await r.json();
                    if (d.payment_required) { log.textContent = '← 402 Payment Required — fund an escrow for this provider'; openEscrowDeposit({ key: 'tpl-' + tpl.key }); btn.disabled = false; btn.textContent = 'Deploy'; return; }
                    if (d.error) { log.textContent = `← ${d.error}`; btn.disabled = false; btn.textContent = 'Deploy'; return; }
                    finish(`✓ ${d.state || 'running'} · vm ${d.vm_id || ''} · ${app.image}`);
                    return;
                } catch (e) { log.textContent = '⚠ gateway unreachable — preview install only'; await sleep(300); }
            }

            // Preview fallback (no gateway/node, or a multi-image bundle).
            if (GATEWAY_OK && node && apps.length > 1) {
                log.textContent = `⚠ "${tpl.name}" bundles ${apps.length} images; one-VM bundle deploy isn't wired yet — preview install`;
                await sleep(400);
                finish(`✓ preview installed to ${VM.name} — bundle deploy coming from the backend`);
                return;
            }
            const total = apps.reduce((s, a) => s + 4 + Math.floor(a.size), 0);
            let done = 0;
            for (const app of apps) {
                const layers = 4 + Math.floor(app.size);
                for (let i = 1; i <= layers; i++) {
                    log.textContent = `preview · pulling ${app.image} — layer ${i}/${layers}`;
                    fill.style.width = (++done / total * 100) + '%';
                    await sleep(220);
                }
            }
            finish(GATEWAY_OK
                ? `✓ preview installed to ${VM.name} — connect a node (Terminal) to run it for real`
                : `✓ preview installed to ${VM.name} (${apps.map(a => a.name).join(', ')}) — demo mode, no gateway`);
        }
        // Serverless-repo card. Clicking it opens the repo's detail page in the
        // same store window (a repo detail with README/Releases tabs).
        function repoCard(repo, storeBody) {
            const app = appOf(repo.app);

            const card = document.createElement('div');

            card.innerHTML = `
                <div class="flex items-start justify-between mb-3">
                    <div class="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-700 flex items-center justify-center">
                        ${app ? appGlyph(app, 'w-6 h-6') : '<i class="fa-solid fa-cube text-white"></i>'}
                    </div>
                    ${repo.soon
                        ? '<span class="text-[9px] px-2 py-0.5 rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-400 font-semibold whitespace-nowrap">Coming soon</span>'
                        : `<button class="repo-install shrink-0 text-[9px] px-2.5 py-1 rounded-lg font-semibold border ${deployed ? 'border-red-500/40 bg-red-500/10 text-red-400 hover:bg-red-500/20' : 'border-transparent bg-[#ccff33] text-black hover:bg-white'}">${deployed ? 'Uninstall' : 'Install'}</button>`}
                </div>
                <div class="text-sm font-medium mb-1">${repo.name}</div>
                <div class="text-[10px] text-zinc-600 font-mono mb-1 truncate">${repo.org} · v${repo.version}</div>
                <div class="text-xs text-zinc-500 leading-relaxed flex-1">${repo.desc}</div>
                <div class="flex items-center justify-between mt-3 pt-3 border-t border-zinc-800/70 text-[10px] text-zinc-500">
                    <span><i class="fa-solid fa-circle-user mr-1.5 text-zinc-600"></i>${repo.pub}</span>
                    <span><i class="fa-solid fa-rocket mr-1"></i>${deployCount(repo.key)} deploys</span>
                </div>`;
            const ib = card.querySelector('.repo-install');
            if (ib) ib.onclick = e => toggleRepoInstall(repo, storeBody, e);
            card.onclick = () => openRepoDetail(repo, storeBody);
            return card;
        }

        // Card-level Install/Uninstall for a repo — mirrors the template action:
        // toggles the repo's app on the VM manifest without opening the detail
        // page (real provisioning still lives in the detail Deploy button).
        function toggleRepoInstall(repo, storeBody, ev) {
            ev.stopPropagation();
            const app = appOf(repo.app);
            if (!app) return;
            if (VM.installed.includes(app.key)) VM.installed = VM.installed.filter(k => k !== app.key);
            else VM.installed.push(app.key);
            saveVM();
            renderDesktop();
            renderStoreGrid(storeBody);
        }

        // Simple JSON highlighter for repo READMEs: escape first, then colour
        // string literals (emerald) and numbers (amber) in a single pass so a
        // number rule can never mangle a colour class from the string rule.
        function hlJson(code) {
            const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return esc(code).replace(
                /("[^"]*")|(\b\d+(?:\.\d+)?\b)/g,
                (_, str, num) => str
                    ? `<span class="text-emerald-400">${str}</span>`
                    : `<span class="text-amber-400">${num}</span>`
            );
        }

        // ---- Deploy configuration (env vars / version / GPU / disk) --------
        // Before the image pull, the user can pin a version, choose GPU/disk,
        // and set environment variables. Env
        // defaults per image/repo (kept here so the big catalogs stay clean).
        const DEPLOY_GPUS = ['None (CPU)', 'RTX 4090 · 24 GB', 'A100 · 40 GB', 'A100 · 80 GB', 'H100 · 80 GB'];
        const DEPLOY_ENV = {
            ubuntu:        [{ name: 'JUPYTER_PASSWORD', ph: 'empty = disable JupyterLab', secret: true }],
            pytorch:       [{ name: 'JUPYTER_PASSWORD', ph: 'empty = disable JupyterLab', secret: true }],
            jupyter:       [{ name: 'JUPYTER_PASSWORD', ph: 'set a token, or leave empty', secret: true }],
            'repo-axolotl':[{ name: 'HF_TOKEN', ph: 'hf_… (for gated models/datasets)', secret: true },
                            { name: 'WANDB_API_KEY', ph: 'optional — training logs', secret: true }],
            'repo-vllm':   [{ name: 'HF_TOKEN', ph: 'hf_… (for gated models)', secret: true }],
            'repo-whisper':[{ name: 'HF_TOKEN', ph: 'optional', secret: true }],
        };
        // Env keys to try for an entry, in order (repo key, then each app key).
        function deployEnvFor(keys) {
            for (const k of keys) if (DEPLOY_ENV[k]) return DEPLOY_ENV[k];
            return [];
        }
        function deployConfigMarkup(p) {
            // GPU picker only for GPU workloads (offering it on a CPU-only app is
            // nonsense); Version collapses to a static line when there's one.
            const showGpu = p.compute === 'GPU';
            const gpuOpts = DEPLOY_GPUS.map((g, i) =>
                `<option ${i === 1 ? 'selected' : ''}>${g}</option>`).join('');
            const env = deployEnvFor(p.envKeys || []);
            const inp = 'w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-[#ccff33]';
            const versions = p.versions || [];
            const versionField = versions.length > 1
                ? `<label class="text-[11px] text-zinc-400 block mb-1">Version</label>
                   <select data-cfg="version" class="${inp} mb-2">${versions.map((v, i) => `<option ${i === 0 ? 'selected' : ''}>v${v}</option>`).join('')}</select>`
                : versions.length === 1
                    ? `<input type="hidden" data-cfg="version" value="v${versions[0]}">
                       <div class="text-[11px] text-zinc-400 mb-2">Version <span class="text-zinc-200 font-mono">v${versions[0]}</span></div>`
                    : '';
            return `
                <div class="border border-zinc-800 rounded-2xl p-3 mb-3 bg-zinc-950/60">
                    <div class="text-[10px] tracking-widest text-zinc-500 mb-2">DEPLOY CONFIGURATION</div>
                    ${versionField}
                    ${showGpu ? `<label class="text-[11px] text-zinc-400 block mb-1">GPU</label>
                    <select data-cfg="gpu" class="${inp} mb-2">${gpuOpts}</select>` : ''}
