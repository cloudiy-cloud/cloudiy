                    <input data-cfg="disk" type="number" min="1" value="${p.disk}" class="${inp} font-mono">
                    ${env.length ? `
                    <div class="text-[11px] text-zinc-400 mt-3 mb-1">Environment variables</div>
                    ${env.map(e => `
                        <label class="text-[10px] text-zinc-500 block mb-0.5 font-mono">${e.name}</label>
                        <input data-env="${e.name}" type="${e.secret ? 'password' : 'text'}" placeholder="${e.ph}" class="${inp} font-mono mb-2">`).join('')}` : ''}
                    <div class="text-[10px] text-zinc-600 leading-relaxed mt-2 pt-2 border-t border-zinc-800/70"><i class="fa-solid fa-circle-info mr-1"></i>Resource and env overrides apply once the network supports per-deploy config.</div>
                </div>`;
        }
        function readDeployConfig(scope) {
            const g = s => scope.querySelector(`[data-cfg="${s}"]`);
            const env = {};
            scope.querySelectorAll('[data-env]').forEach(i => {
                if (i.value.trim()) env[i.getAttribute('data-env')] = i.value.trim();
            });
            return {
                version: g('version') ? g('version').value : '',
                gpu: g('gpu') ? g('gpu').value : 'None (CPU)',
                disk: g('disk') ? (parseInt(g('disk').value, 10) || 0) : 0,
                env,
            };
        }
        // Log the chosen config into a deploy progress element.
        function logDeployConfig(logEl, cfg) {
            logEl.textContent = `· ${cfg.version} · ${cfg.gpu} · ${cfg.disk} GB disk`;
            const keys = Object.keys(cfg.env);
            if (keys.length) logEl.textContent += ` · env: ${keys.join(', ')}`;
        }

        // ================= Deploy your own ================================
        // The way out of the curated catalog: bring any OCI image (including a
        // worker serving your own fine-tuned weights) and run it as YOUR app.
        // The protocol already accepts arbitrary images (RunWorkload / vm up /
        // cloudiy_deploy); this is the UI for it.

        // Mirror of the provider-side validate_image (vm.rs): plain reference,
        // no leading dash (flag injection), conservative charset.
        function validImageRef(image) {
            return !!image && image.length <= 256 && !image.startsWith('-')
                && /^[A-Za-z0-9_.\/:@-]+$/.test(image);
        }

        function openDeployYourOwn() {

                <label class="text-[11px] text-zinc-400 block mb-1">OCI image <span class="text-zinc-600">(required)</span></label>
                <input id="own-image" placeholder="ghcr.io/you/your-worker:v1" class="${inp} font-mono mb-2">

            const $ = s => body.querySelector(s);

            $('#own-go').onclick = async () => {

                const name = $('#own-name').value.trim() || image.split('/').pop().split(':')[0] || 'custom';
                const gpu = $('#own-gpu').value;
                const env = {};
                $('#own-env').value.split('\n').forEach(l => {
                    const i = l.indexOf('=');

                const node = $('#own-node').value.trim();
                const btn = $('#own-go');
                btn.disabled = true; btn.textContent = 'Deploying…';
                log(`· ${image} · ${gpu} · env: ${Object.keys(env).join(', ') || 'none'}`);

                // Real path: with a gateway and a target node, provision on the
                // network via the protocol (the same call the terminal uses).
                if (node && GATEWAY_OK) {
                    try {
                        log(`→ vm up on ${node.slice(0, 4)}…${node.slice(-4)} via the local gateway`);
                        const r = await fetch(GW_HTTP + '/api/vm/up', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ to: node, image, cpu: 2, memory_mb: 2048, ports: [], token: (VM.token || undefined) }),
                        });
                        const d = await r.json();
                        if (d.payment_required) { log('← 402 Payment Required — this provider requires a funded escrow'); openEscrowDeposit({ key: 'own-' + name }); btn.disabled = false; btn.textContent = 'Deploy'; return; }
                        if (d.error) { log(`← ${d.error}`); btn.disabled = false; btn.textContent = 'Deploy'; return; }
                        log(`✓ ${d.state || 'running'} · vm ${d.vm_id || ''} · volume ${d.volume || ''}`);

                } else {
                    // No target node: simulated provisioning (the placement
                    // happens for real when a run is dispatched).
                    for (const step of ['pulling manifest…', 'pulling layers…', 'verifying image…']) {

                }

                const key = 'custom-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 24) + '-' + Math.random().toString(36).slice(2, 6);
                VM.custom = VM.custom || [];
                VM.custom.push({ key, name, image, gpu, env, node: node || undefined });
                saveVM(); renderDesktop();
                log(`✓ deployed as "${name}" — on your desktop`);

        }

        // The repo detail page — rendered into the store window itself, so the
        // same window navigates from the grid to the repo and back.
        function openRepoDetail(repo, storeBody) {
            const app = appOf(repo.app);
            const rd = repo.readme || {};
            const deployed = app && VM.installed.includes(app.key);
            const stat = (label, val) => `<div><div class="text-[10px] tracking-widest text-zinc-500">${label}</div><div class="text-sm text-zinc-200 mt-0.5">${val}</div></div>`;

            const sectionTable = s => `

                        </tr></thead>
                        <tbody>${s.rows.map(r => `
                            <tr class="border-b border-zinc-800/60 last:border-0">
                                <td class="px-4 py-2.5 align-top"><code class="text-[#ccff33] text-xs whitespace-nowrap">${r[0]}</code></td>
                                <td class="px-4 py-2.5 align-top text-zinc-400">${r[1]}</td>
                                <td class="px-4 py-2.5 align-top text-zinc-400">${r[2]}</td>
                            </tr>`).join('')}</tbody>
                    </table>
                </div>`;

            // A plausible release history from the current version downward.
            const relDates = [repo.released, 'Apr 2, 2026', 'Feb 10, 2026', 'Dec 18, 2025'];
            const vv = repo.version.split('.').map(Number);
            const releases = relDates.map((d, i) => {
                const v = i === 0 ? repo.version : `${vv[0]}.${Math.max(0, vv[1] - i)}.0`;
                return { v, d, latest: i === 0 };
            });

            storeBody.innerHTML = `
                <button id="repo-back" class="text-xs text-zinc-400 hover:text-[#ccff33] mb-4"><i class="fa-solid fa-arrow-left mr-1.5"></i>Serverless Repos</button>
                <div class="grid lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 min-w-0">
                        <div class="flex items-start gap-x-3 mb-4">
                            <div class="w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-700 flex items-center justify-center shrink-0">
                                ${app ? appGlyph(app, 'w-6 h-6') : '<i class="fa-solid fa-cube text-white"></i>'}
                            </div>
                            <div>
                                <div class="font-display text-xl">${repo.name}</div>
                                <div class="text-xs text-zinc-500 leading-relaxed mt-1">${repo.desc}</div>
                            </div>
                        </div>
                        <div class="flex gap-x-5 border-b border-zinc-800 mb-5 text-sm">
                            <button data-rt="readme" class="repo-tab pb-2 border-b-2">README</button>
                            <button data-rt="releases" class="repo-tab pb-2 border-b-2">Releases</button>
                        </div>
                        <div id="repo-readme">
                            <h2 class="font-display text-2xl mb-3">${rd.title || 'Overview'}</h2>
                            <p class="text-zinc-400 text-sm leading-relaxed mb-5">${rd.intro || repo.desc}</p>
                            ${rd.input ? `
                            <h3 class="font-display text-lg mb-2">Usage</h3>
                            <p class="text-zinc-400 text-sm mb-2">Send this as the JSON request body:</p>
                            <pre class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-[11px] font-mono leading-relaxed overflow-x-auto"><code>${hlJson(rd.input)}</code></pre>` : ''}
                            ${(rd.sections || []).map(sectionTable).join('')}
                        </div>
                        <div id="repo-releases" class="hidden">
                            <div class="rounded-2xl border border-zinc-800 divide-y divide-zinc-800">
                                ${releases.map(r => `
                                    <div class="flex items-center justify-between px-4 py-3">
                                        <div class="flex items-center gap-x-3">
                                            <i class="fa-solid fa-tag text-zinc-500 text-xs"></i>
                                            <span class="font-mono text-sm text-zinc-200">v${r.v}</span>
                                            ${r.latest ? '<span class="text-[9px] px-2 py-0.5 rounded-lg bg-[#ccff33]/10 border border-[#ccff33]/40 text-[#ccff33]">Latest</span>' : ''}
                                        </div>
                                        <span class="text-xs text-zinc-500">${r.d}</span>
                                    </div>`).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-1">
                        <button id="repo-deploy" class="w-full py-2.5 rounded-xl ${repo.soon ? 'bg-zinc-900 border border-zinc-700 text-zinc-500 cursor-not-allowed' : deployed ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-200' : 'bg-[#ccff33] hover:bg-white text-black'} font-semibold text-sm mb-2"${repo.soon ? ' disabled' : ''}>${repo.soon ? 'Coming soon' : deployed ? 'Open' : 'Deploy v' + repo.version}</button>
                        ${repo.soon ? '<div class="text-[10px] text-amber-400/80 leading-relaxed mb-3"><i class="fa-solid fa-circle-info mr-1"></i>This worker image isn\'t published yet, deploy turns on once it ships.</div>' : ''}
                        <div class="hidden h-1.5 bg-zinc-900 border border-zinc-800 rounded-full overflow-hidden mb-2" id="repo-bar"><div class="h-full bg-[#ccff33] transition-all duration-200" style="width:0%"></div></div>
                        <div class="hidden text-[10px] text-zinc-500 font-mono mb-3" id="repo-log"></div>
                        ${app ? deployConfigMarkup({ versions: releases.map(r => r.v), compute: 'GPU', disk: Math.ceil(app.size) + 5, envKeys: [repo.key, repo.app] }) : ''}

                        <div class="text-[10px] tracking-widest text-zinc-500 mb-2 mt-4"><i class="fa-brands fa-github mr-1.5"></i>REPOSITORY</div>
                        <a href="https://github.com/${repo.org}" target="_blank" rel="noopener"
                           class="flex items-center gap-x-1.5 text-sm text-[#ccff33] break-all mb-4 hover:underline">
                            <span>${repo.org}</span><i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70 shrink-0"></i>
                        </a>

                        <div class="grid grid-cols-2 gap-y-4 gap-x-3 mb-5">
                            <div><div class="text-[10px] tracking-widest text-zinc-500">STARS</div><div class="text-sm text-zinc-200 mt-0.5" id="repo-stars">★ ${repo.stars.toLocaleString()}</div></div>
                            <div><div class="text-[10px] tracking-widest text-zinc-500">WATCHERS</div><div class="text-sm text-zinc-200 mt-0.5" id="repo-watchers">${repo.watchers.toLocaleString()}</div></div>
                            <div><div class="text-[10px] tracking-widest text-zinc-500">ISSUES</div><div class="text-sm text-zinc-200 mt-0.5" id="repo-issues">${repo.issues.toLocaleString()}</div></div>
                            <div><div class="text-[10px] tracking-widest text-zinc-500">DEPLOYS</div><div class="text-sm text-zinc-200 mt-0.5">🚀 ${deployCount(repo.key)}</div></div>
                        </div>

                        <div class="border-t border-zinc-800 pt-3">
                            ${metaRow('fa-user', repo.pub)}
                            <div class="flex items-center gap-x-2.5 text-sm text-zinc-300 py-1.5"><i class="fa-solid fa-calendar text-zinc-500 w-4 text-center"></i><span id="repo-created">Created ${repo.created}</span></div>
                            <div class="flex items-center gap-x-2.5 text-sm text-zinc-300 py-1.5"><i class="fa-solid fa-clock-rotate-left text-zinc-500 w-4 text-center"></i><span id="repo-updated">Last updated ${repo.released}</span></div>
                            <div class="flex items-center gap-x-2.5 text-sm text-zinc-300 py-1.5"><i class="fa-solid fa-code text-zinc-500 w-4 text-center"></i><span id="repo-lang">${repo.lang}</span></div>
                            <div class="flex items-center gap-x-2.5 text-sm text-zinc-300 py-1.5"><i class="fa-solid fa-scale-balanced text-zinc-500 w-4 text-center"></i><span id="repo-license">${repo.license}</span></div>
                        </div>
                        <div id="repo-gh-note" class="hidden text-[10px] text-zinc-600 leading-relaxed mt-3"></div>
                        <div class="text-[10px] tracking-widest text-zinc-500 mt-4 mb-2">TAGS</div>
                        <div class="flex flex-wrap gap-1.5">
                            ${(repo.tags || []).map(t => `<span class="text-[10px] px-2 py-1 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-400">${t}</span>`).join('')}
                        </div>
                    </div>
                </div>`;

            storeBody.querySelector('#repo-back').onclick = () => renderStore(storeBody);
            const setRTab = t => {
                storeBody.querySelector('#repo-readme').classList.toggle('hidden', t !== 'readme');
                storeBody.querySelector('#repo-releases').classList.toggle('hidden', t !== 'releases');
                storeBody.querySelectorAll('.repo-tab').forEach(b => {
                    const on = b.dataset.rt === t;
                    b.className = 'repo-tab pb-2 border-b-2 ' + (on
                        ? 'text-[#ccff33] border-[#ccff33]'
                        : 'text-zinc-400 border-transparent hover:text-white');
                });
            };
            storeBody.querySelectorAll('.repo-tab').forEach(b => b.onclick = () => setRTab(b.dataset.rt));
            setRTab('readme');

            const btn = storeBody.querySelector('#repo-deploy');
            btn.onclick = () => {
                if (repo.soon || !app) return;
                if (VM.installed.includes(app.key)) { openApp(app); return; }
                deployRepo(repo, btn, storeBody);
            };

            // Replace the baked-in numbers with live GitHub data (best effort).
            applyRepoGithub(repo, storeBody);
        }

        // Live GitHub metadata for a repo, cached in localStorage so we stay well
        // under the unauthenticated 60 req/hour limit. Returns null on any failure
        // (rate limit, offline, private/renamed repo), in which case the caller
        // keeps the static fallback already on screen.
        async function fetchRepoGithub(org) {
            const key = 'cloudiy-gh:' + org, TTL = 6 * 3600 * 1000;
            try {
                const c = JSON.parse(localStorage.getItem(key) || 'null');
                if (c && (Date.now() - c.t) < TTL) return c.d;
            } catch (e) {}
            try {
                const res = await fetch('https://api.github.com/repos/' + org, { headers: { Accept: 'application/vnd.github+json' } });
                if (!res.ok) return null;
                const j = await res.json();
                const d = {
                    stars: j.stargazers_count, watchers: j.subscribers_count, issues: j.open_issues_count,
                    created: j.created_at, pushed: j.pushed_at, language: j.language,
                    license: j.license && j.license.spdx_id,
                };
                try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); } catch (e) {}
                return d;
            } catch (e) { return null; }
        }

        async function applyRepoGithub(repo, root) {
            const d = await fetchRepoGithub(repo.org);
            if (!d || !root.isConnected) return;
            const set = (id, val) => { const el = root.querySelector('#' + id); if (el && val != null) el.textContent = val; };
            const fmt = iso => { try { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return null; } };
            if (d.stars != null) set('repo-stars', '★ ' + d.stars.toLocaleString());
            if (d.watchers != null) set('repo-watchers', d.watchers.toLocaleString());
            if (d.issues != null) set('repo-issues', d.issues.toLocaleString());
            if (d.created) set('repo-created', 'Created ' + fmt(d.created));
            if (d.pushed) set('repo-updated', 'Last updated ' + fmt(d.pushed));
            if (d.language) set('repo-lang', d.language);
            set('repo-license', d.license && d.license !== 'NOASSERTION' ? d.license : 'No license');
            const note = root.querySelector('#repo-gh-note');
            if (note) { note.textContent = 'Stars, watchers, issues, dates, language and license are live from GitHub. Deploys counts your completed deploys on this device.'; note.classList.remove('hidden'); }
        }

        // Deploy a repo's underlying image, with progress under the button.
        async function deployRepo(repo, btn, storeBody) {
            const app = appOf(repo.app);
            if (!app) return;
            const cfg = readDeployConfig(storeBody);
            btn.disabled = true; btn.textContent = 'Pulling…';
            const bar = storeBody.querySelector('#repo-bar'), fill = bar.firstElementChild;
            const log = storeBody.querySelector('#repo-log');
            bar.classList.remove('hidden'); log.classList.remove('hidden');
            logDeployConfig(log, cfg); await new Promise(r => setTimeout(r, 400));

            const finish = (msg) => {
                if (!VM.installed.includes(app.key)) VM.installed.push(app.key);
                bumpDeploy(repo.key);
                saveVM();
                log.textContent = msg;
                btn.disabled = false; btn.textContent = 'Open';
                btn.className = 'w-full py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold text-sm mb-2';
                btn.onclick = () => openApp(app);
                renderDesktop();
            };

            // Real path: a repo image is single-image, so with a gateway and a
            // connected node we provision it via /api/vm/up (same as templates).
            const conn = JSON.parse(localStorage.getItem('cloudiy_conn') || '{}');
            const node = conn.node;
            if (GATEWAY_OK && node) {
                log.textContent = `→ vm up ${app.image} on ${node.slice(0, 4)}…${node.slice(-4)} via the local gateway`;
                try {
                    const r = await fetch(GW_HTTP + '/api/vm/up', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ to: node, image: app.image, cpu: 2, memory_mb: 2048, ports: [], token: (VM.token || conn.token || undefined) }),
                    });
                    const d = await r.json();
                    if (d.payment_required) { log.textContent = '← 402 Payment Required — fund an escrow for this provider'; openEscrowDeposit({ key: 'repo-' + repo.key }); btn.disabled = false; btn.textContent = 'Deploy v' + repo.version; return; }
                    if (d.error) { log.textContent = `← ${d.error}`; btn.disabled = false; btn.textContent = 'Deploy v' + repo.version; return; }
                    finish(`✓ ${d.state || 'running'} · vm ${d.vm_id || ''} · ${app.image}`);
                    return;
                } catch (e) { log.textContent = '⚠ gateway unreachable — preview install only'; await new Promise(r => setTimeout(r, 300)); }
            }

            // Preview fallback (no gateway/node).
            const layers = 4 + Math.floor(app.size);
            for (let i = 1; i <= layers; i++) {
                log.textContent = `preview · pulling layer ${i}/${layers} — ${app.image}`;
                fill.style.width = (i / layers * 100) + '%';
                await new Promise(r => setTimeout(r, 240));
            }
            finish(GATEWAY_OK
                ? `✓ preview installed to ${VM.name} — connect a node (Terminal) to run it for real`
                : `✓ preview installed to ${VM.name} — demo mode, no gateway`);
        }
        // ================= Hardware Store =================================
        // Two sides of the protocol, one shop: RENT parts from the network
        // and attach them to your VM, or OFFER your machine's parts
        // (GPU/CPU/RAM) and earn USDC.
        // Hardware listed by the decentralized network: every part carries the
        // announcing node's identity and uptime (from signed announcements).
        const PARTS = [
            // Graphics
            { key: 'gpu-4090',    kind: 'GPU', name: 'NVIDIA RTX 4090',   spec: '24 GB VRAM', icon: 'fa-bolt', price: 0.90, add: { vram: 24 },  node: '9846…b1ec', uptime: 99.2 },

        ];
        // Whole machines — dedicated nodes rented as one exclusive unit, a
        // bundle of GPU + CPU + RAM + storage priced slightly below the sum of
        // the same parts. Same shape as PARTS (a single `add` covering every
        // resource) so attach/detach and pricing reuse the part machinery.
        const MACHINES = [
            { key: 'rig-4090', kind: 'MACHINE', name: 'RTX 4090 Rig',  gpuName: 'NVIDIA RTX 4090',  spec: 'RTX 4090 24GB · 16 vCPU · 64 GB · 1 TB NVMe',  icon: 'fa-server', price: 1.15, add: { vram: 24, cpu: 16, ram: 64,  disk: 1024 }, node: '9846…b1ec', uptime: 99.2 },

        // Real machines announced on the network (from /api/machines), loaded
        // when a gateway is present. null = not loaded; [] = none live.
        let netMachines = null;
        const partOf = k => PARTS.find(p => p.key === k)
            || MACHINES.find(m => m.key === k)
            || (netMachines || []).find(m => m.key === k);

        // Shape a verified provider announcement like a catalog MACHINE so the
        // existing rent/attach/My-VM machinery works unchanged.
        function mapNetMachine(m) {
            const vramGB = Math.round((m.vram_mb || 0) / 1024);
            const cpu = Math.round(m.cpu_cores || 0);
            const ramGB = Math.round((m.memory_mb || 0) / 1024);
            const diskGB = Math.round((m.storage_mb || 0) / 1024) || 100;
            const spec = [vramGB ? vramGB + 'GB VRAM' : '', cpu + ' vCPU', ramGB + ' GB', diskGB + ' GB NVMe']

            const node = String(m.node || '');
            return {
                key: 'net-' + node, kind: 'MACHINE',
                name: m.has_gpu ? (vramGB ? vramGB + 'GB GPU node' : 'GPU node') : 'CPU node',
                spec, price: m.price_per_hour || 0,
                node: node.length > 10 ? node.slice(0, 4) + '…' + node.slice(-4) : node,
                live: true, load: Math.round((m.utilization || 0) * 100),
                add: { vram: vramGB, cpu, ram: ramGB, disk: diskGB },

        }

        // Fetch live machines from the gateway's directory; re-render the store
        // if it's open. Leaves netMachines null on any failure (the store then
        // shows an honest "no machines" state — never mock listings).
        async function loadNetworkMachines() {
            if (!GATEWAY_OK) { netMachines = null; return; }
            try {
                const r = await fetch(GW_HTTP + '/api/machines');
                if (!r.ok) return;
                const d = await r.json();
                netMachines = Array.isArray(d.machines) ? d.machines.map(mapNetMachine) : [];
                if (document.getElementById('hw-body')) refreshHardware();
            } catch (e) { /* keep null → honest empty state, never mock */ }
        }

        function applyPart(part, sign) {
            if (part.add.cpu)  VM.cpu  = Math.max(1, VM.cpu  + sign * part.add.cpu);
            if (part.add.ram)  VM.ram  = Math.max(1, VM.ram  + sign * part.add.ram);
            if (part.add.vram) VM.vram = Math.max(0, VM.vram + sign * part.add.vram);
            if (part.add.disk) VM.disk = Math.max(10, VM.disk + sign * part.add.disk);
        }
        function attachPart(key) {
            const part = partOf(key);
            if (!part || VM.parts.includes(key)) return;
            // A VM runs on ONE dedicated machine: renting a machine releases any
            // previously rented one (no Frankenstein VM spanning nodes).
            if (part.kind === 'MACHINE') {
                VM.parts.filter(k => partOf(k)?.kind === 'MACHINE').forEach(detachPart);
            }
            VM.parts.push(key); applyPart(part, +1); saveVM();
            refreshHardware(); refreshMyVM();
        }
        function detachPart(key) {
            const part = partOf(key);
            const i = VM.parts.indexOf(key);
            if (!part || i < 0) return;
            VM.parts.splice(i, 1); applyPart(part, -1); saveVM();
            refreshHardware(); refreshMyVM();

        function refreshMyVM() {

        let hwTab = 'rent';

        function openHardwareStore() {
            hideStart();

            body.id = 'hw-body';
            renderHardware(body);
            loadNetworkMachines();
            // The CSS auto-fill grid reflows columns on its own as the window
            // resizes; re-render (debounced) on a real width change so the 3D
            // card canvases re-init crisply at their new size.
            if (hwResizeObs) hwResizeObs.disconnect();
            let lastW = 0, t = null;
            hwResizeObs = new ResizeObserver(entries => {
                const w = Math.round(entries[0].contentRect.width);
                if (lastW === 0) { lastW = w; return; } // baseline, don't re-render
                if (Math.abs(w - lastW) < 24) return;
                lastW = w;
                clearTimeout(t);
                t = setTimeout(() => { const b = document.getElementById('hw-body'); if (b) renderHardware(b); }, 120);
            });
            hwResizeObs.observe(body);

        function refreshHardware() {

        function renderHardware(body) {

            const tr = body.querySelector('#hw-tab-rent'), to = body.querySelector('#hw-tab-offer');

        // What the consumer can rent: a whole dedicated machine (their VM runs
        // on it) and portable network volumes. Individual GPU/CPU/RAM "parts"

        // Scenes rendered into the shared context — their GPU geometry/material

        // don't leak memory (the single shared WebGL context is kept alive).
        let hwScenes = [];
        function disposeHwScenes() {
            hwScenes.forEach(scene => scene.traverse(o => {

        // Marketplace-style card: animated 3D part + name + price + action.

        // Whole-machine card: a dedicated node rented as one exclusive unit.
        function rentMachineCard(machine) {

        // ---- three.js part models (GPU ported from the marketplace) -------
        // ONE shared WebGL context for all card thumbnails. A renderer per card
        // exhausted the browser's ~16-context limit — contexts were lost and the
        // animation loops froze the page (inputs stopped responding). Each model
        // is now rendered once into this shared renderer and copied onto the
        // card's own 2D canvas.
        let sharedGL = null;
        function getSharedGL() {
            if (!sharedGL) {
                sharedGL = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                sharedGL.setPixelRatio(1);
            }
            return sharedGL;
        }
        function part3DBase(canvas) {
            const renderer = getSharedGL();
            const w = canvas.offsetWidth || 280, h = canvas.offsetHeight || 112;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            renderer.setSize(w * dpr, h * dpr, false);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
            camera.position.set(0, 0.5, 4.4);
            const dir = new THREE.DirectionalLight(0xffffff, 1.25);
            dir.position.set(4, 6, 8);
            scene.add(dir);
            scene.add(new THREE.AmbientLight(0x222222));
            const rim = new THREE.DirectionalLight(0xccff33, 0.55);
            rim.position.set(0, -8, 3);
            scene.add(rim);
            return { renderer, scene, camera, canvas, w, h, dpr };
        }
        const glowMat = (i = 0.7) => new THREE.MeshPhongMaterial({ color: 0xccff33, emissive: 0xccff33, emissiveIntensity: i, shininess: 80 });
        const darkMat = (c = 0x1f2528) => new THREE.MeshPhongMaterial({ color: c, shininess: 25, specular: 0x111111 });

        function initPart3D(canvas, kind) {
            if (!canvas || typeof THREE === 'undefined') return;
            const base = part3DBase(canvas);
            const { renderer, scene, camera } = base;
            const root = new THREE.Group();
            scene.add(root);
            const spinners = [];

            if (kind === 'GPU') {
                // The marketplace reference card: long body, glow strip, 3 fans.
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.35, 0.55), darkMat());
                root.add(body);
                const accent = new THREE.Mesh(new THREE.BoxGeometry(3.45, 0.18, 0.6), glowMat(0.6));
                accent.position.y = -0.65;
                root.add(accent);
                [-0.95, 0.05, 1.05].forEach((x, index) => {
                    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.32, 32), darkMat(0x111111));
                    ring.rotation.x = Math.PI / 2;
                    ring.position.set(x, 0, 0.32);
                    root.add(ring);
                    const blades = new THREE.Group();
                    for (let i = 0; i < 7; i++) {
                        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.77, 0.08), glowMat(0.9));
                        blade.position.y = 0.22;
                        blade.rotation.z = i * (Math.PI * 2 / 7);
                        blades.add(blade);
                    }
                    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.35, 24), glowMat(0.7));
                    hub.rotation.x = Math.PI / 2;
                    blades.add(hub);
                    blades.position.set(x, 0, 0.32);
                    root.add(blades);
                    spinners.push({ obj: blades, speed: 0.12 + index * 0.02 });
                });
            } else if (kind === 'CPU') {
                // Substrate + heat-spreader lid + pulsing die + pin field.
                const pcb = new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.3, 0.12), darkMat(0x14210c));
                pcb.rotation.x = -0.9;
                root.add(pcb);
                const lid = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.7, 0.16), darkMat(0x3a4148));
                lid.rotation.x = -0.9;
                lid.position.z = 0.14; lid.position.y = 0.09;
                root.add(lid);
                const die = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.06), glowMat(0.8));
                die.rotation.x = -0.9;
                die.position.z = 0.26; die.position.y = 0.16;
                root.add(die);
                spinners.push({ obj: die, pulse: true });
                for (let i = -3; i <= 3; i++) {
                    const trace = new THREE.Mesh(new THREE.BoxGeometry(0.04, 2.28, 0.02), glowMat(0.25));
                    trace.rotation.x = -0.9;
                    trace.position.x = i * 0.31;
                    trace.position.z = -0.05; trace.position.y = -0.04;
                    root.add(trace);
                }
            } else if (kind === 'RAM') {
                // Standing stick: PCB, 8 memory chips, gold edge connector, glow top.
                const pcb = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.15, 0.1), darkMat(0x14210c));
                root.add(pcb);
                for (let i = 0; i < 8; i++) {
                    const chip = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.08), darkMat(0x0c0c0e));
                    chip.position.set(-1.5 + i * 0.43, 0.05, 0.09);
                    root.add(chip);
                }
                const edge = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.14, 0.12), new THREE.MeshPhongMaterial({ color: 0xd4af37, shininess: 90 }));
                edge.position.y = -0.62;
                root.add(edge);
                const glow = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 0.14), glowMat(0.9));
                glow.position.y = 0.62;
                root.add(glow);
                spinners.push({ obj: glow, pulse: true });
            } else {
                // STORAGE: NVMe-style slab with controller + pulsing activity LED.
                const slab = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.0, 0.14), darkMat(0x14210c));
                root.add(slab);
                const ctrl = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.1), darkMat(0x0c0c0e));
                ctrl.position.set(-1.0, 0, 0.11);
                root.add(ctrl);
                [0.0, 0.7, 1.4].forEach(x => {
                    const nand = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.09), darkMat(0x191a1d));
                    nand.position.set(x, 0, 0.11);
                    root.add(nand);
                });
                const led = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.1), glowMat(1.0));
                led.position.set(-1.52, 0.32, 0.12);
                root.add(led);
                spinners.push({ obj: led, pulse: true, fast: true });
            }

            // Pose it nicely, render one frame into the shared context, then
            // copy it onto the card's own 2D canvas. No per-card context, no
            // animation loop — the page stays responsive.
            spinners.forEach(s => { if (s.pulse) s.obj.material.emissiveIntensity = s.fast ? 1.0 : 0.85; });
            root.rotation.y = 0.5;
            root.rotation.x = 0.06;
            renderer.render(scene, camera);
            const cv = base.canvas;
            cv.width = base.w * base.dpr;
            cv.height = base.h * base.dpr;
            const ctx = cv.getContext('2d');
            if (ctx) ctx.drawImage(renderer.domElement, 0, 0, cv.width, cv.height);
            hwScenes.push(scene); // tracked so its GPU buffers free on re-render
        }

        // Network reference rates (from the rent listings), used only to
        // suggest a fair per-part price for an offer.
        const OFFER_RATE = { cpu: 0.011, ram: 0.0026 }; // USDC per core/h, per GB/h
        // Suggested hourly price for the detected GPU, matched by model family.
        function guessGpuPrice(name) {
            const n = (name || '').toLowerCase();
            if (n.includes('h100')) return 3.90;
            if (n.includes('a100')) return 2.60;
            if (n.includes('l40'))  return 1.95;
            if (n.includes('4090')) return 0.90;
            if (n.includes('4080')) return 0.62;
            if (n.includes('3090')) return 0.48;
            if (n.includes('7900')) return 0.40;
            return name ? 0.50 : 0;
        }

        // Best-effort read of THIS machine's hardware straight from the browser.
        // Values are approximate — the browser coarsens/masks them (Chrome caps
        // deviceMemory at 8 GB, the GPU comes from the WebGL renderer string,
        // other engines restrict both) — so they only PRE-FILL the offer; the
        // `cloudiy share` daemon measures the exact capacity when the node
        // actually comes online.
        function detectHardware() {
            const cores = navigator.hardwareConcurrency || 0;
            const ram = navigator.deviceMemory || 0; // GB, coarse
            let gpu = '';
            try {
                const cv = document.createElement('canvas');
                const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
                const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) {
                    gpu = (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toString();
                    // Unwrap ANGLE strings: "ANGLE (NVIDIA, NVIDIA RTX 4090 Direct3D11 ...)".
                    const m = gpu.match(/ANGLE \([^,]+,\s*([^,)]+)/);
                    if (m) gpu = m[1].replace(/Direct3D.*$/i, '').replace(/\(0x[0-9a-f]+\)/i, '').trim();
                }
            } catch (e) { /* WebGL blocked — leave GPU unknown */ }
            return { cores, ram, gpu: gpu.slice(0, 48) };
        }

        // The real `cloudiy share` invocation for an offer. Matches the CLI:
        // --share-cpu is in CORES (not millicores), memory is --share-memory-mb,
        // the GPU is shared by DEFAULT (so --no-gpu when none is offered), and
        // the hourly lease rate is --price-usdc-per-hour.
        function shareCommand(cpu, ram, gpu, total) {
            let c = 'cloudiy share';
            if (cpu) c += ' --share-cpu ' + cpu;
            if (ram) c += ' --share-memory-mb ' + (ram * 1024);
            c += gpu ? ' --gpu-model "' + gpu + '"' : ' --no-gpu';
            c += ' --price-usdc-per-hour ' + (total || 0).toFixed(2);
            return c;
        }

        function renderOffer(el) {
            const det = detectHardware();
            const saved = VM.offering || {};
            // Hard caps: you can't offer more than this machine actually has.
            // Cores (hardwareConcurrency) and the GPU (WebGL renderer) are read
            // straight from the device; RAM (deviceMemory) is coarse and can
            // only UNDER-report, so capping at it never lets you over-claim.
            // When a value can't be read, fall back to a ceiling and flag it
            // unverified — the `cloudiy share` daemon enforces the real limit.
            const cpuMax = det.cores > 0 ? det.cores : 32;
            const ramMax = det.ram   > 0 ? det.ram   : 128;
            const clamp = (v, max) => Math.max(0, Math.min(v, max));
            const seedCpu = clamp(saved.cpu != null ? saved.cpu : cpuMax, cpuMax);
            const seedRam = clamp(saved.ram != null ? saved.ram : ramMax, ramMax);
            // A GPU can only be offered if this machine reports one, and only
            // the one it reports; a stale saved choice is dropped.
            const detGpu = det.gpu || '';
            const seedGpu = saved.gpu && saved.gpu === detGpu ? saved.gpu : '';
            const hint = (txt, warn) => `<span class="text-[10px] ${warn ? 'text-amber-500/80' : 'text-zinc-600'} ml-2">${txt}</span>`;
            const cpuHint = det.cores > 0 ? hint('max ' + det.cores + ' cores · this machine') : hint('unverified — daemon enforces the limit', true);
            const ramHint = det.ram   > 0 ? hint('max ~' + det.ram + ' GB · this machine')     : hint('unverified — daemon enforces the limit', true);
            const gpuHint = detGpu ? hint('detected: ' + detGpu) : hint('no GPU detected on this machine', true);
            const gpuSelect = detGpu
                ? `<option value="">None — offer CPU/RAM only</option><option>${detGpu}</option>`
                : `<option value="">None — no GPU on this machine</option>`;
            const priceBox = id =>
                `<div class="flex items-center gap-2 mt-2"><span class="text-[11px] text-zinc-500">Price</span>`
                + `<input type="number" id="${id}" min="0" step="0.01" class="w-24 bg-zinc-950 border border-zinc-700 rounded-xl px-2 py-1 text-xs font-mono focus:outline-none focus:border-[#ccff33]">`
                + `<span class="text-[11px] text-zinc-500">USDC/h</span></div>`;
            el.innerHTML = `
                <div class="space-y-5">
                    <div>
                        <div class="flex justify-between text-sm mb-2"><span class="text-zinc-400"><i class="fa-solid fa-microchip mr-2 text-[#ccff33]"></i>CPU to offer${cpuHint}</span><span class="font-mono" id="off-cpu-val"></span></div>
                        <input type="range" id="off-cpu" min="0" max="${cpuMax}" value="${seedCpu}" class="w-full accent-[#ccff33]">
                        ${priceBox('off-cpu-price')}
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-2"><span class="text-zinc-400"><i class="fa-solid fa-memory mr-2 text-[#ccff33]"></i>RAM to offer${ramHint}</span><span class="font-mono" id="off-ram-val"></span></div>
                        <input type="range" id="off-ram" min="0" max="${ramMax}" value="${seedRam}" class="w-full accent-[#ccff33]">
                        ${priceBox('off-ram-price')}
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-1.5">GPU to offer <span class="text-zinc-600">(optional)</span>${gpuHint}</label>
                        <select id="off-gpu" ${detGpu ? '' : 'disabled'} class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#ccff33] disabled:opacity-50">
                            ${gpuSelect}
                        </select>
                        ${priceBox('off-gpu-price')}
                    </div>
                    <div class="flex justify-between items-center border-t border-zinc-800 pt-3">
                        <span class="text-xs text-zinc-400">Total offer price</span>
                        <span class="font-mono text-lg text-[#ccff33]" id="off-total">$0.00/h</span>
                    </div>
                    <div>
                        <div class="text-[10px] text-zinc-500 mb-1">Run this on the machine to bring it online and list it on the network:</div>
                        <div class="flex items-stretch gap-x-2">
                            <div id="off-summary" class="flex-1 min-w-0 text-[11px] font-mono text-zinc-300 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 overflow-x-auto whitespace-nowrap"></div>
                            <button id="off-copy" title="Copy command" class="shrink-0 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs"><i class="fa-solid fa-copy"></i></button>
                        </div>
                    </div>
                    <button id="off-go" class="w-full py-3.5 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-2xl text-sm">Save offer &amp; get command</button>
                </div>`;
            const $ = s => el.querySelector(s);
            if (seedGpu) $('#off-gpu').value = seedGpu;
            const gpuPrice = () => guessGpuPrice($('#off-gpu').value);
            // Seed prices: a saved offer wins, else the suggestion from the rate.
            $('#off-cpu-price').value = saved.priceCpu != null ? saved.priceCpu : +(seedCpu * OFFER_RATE.cpu).toFixed(2);
            $('#off-ram-price').value = saved.priceRam != null ? saved.priceRam : +(seedRam * OFFER_RATE.ram).toFixed(2);
            $('#off-gpu-price').value = saved.priceGpu != null ? saved.priceGpu : +gpuPrice().toFixed(2);
            const upd = reprice => {
                const cpu = +$('#off-cpu').value, ram = +$('#off-ram').value, gpu = $('#off-gpu').value;
                $('#off-cpu-val').textContent = cpu ? cpu + ' cores' : 'None';
                $('#off-ram-val').textContent = ram ? ram + ' GB' : 'None';
                // Re-suggest a price when the amount changes, unless the user
                // has hand-edited that field.
                if (reprice === 'cpu' && !$('#off-cpu-price').dataset.touched) $('#off-cpu-price').value = +(cpu * OFFER_RATE.cpu).toFixed(2);
                if (reprice === 'ram' && !$('#off-ram-price').dataset.touched) $('#off-ram-price').value = +(ram * OFFER_RATE.ram).toFixed(2);
                if (reprice === 'gpu' && !$('#off-gpu-price').dataset.touched) $('#off-gpu-price').value = +gpuPrice().toFixed(2);
                const pc = cpu ? (+$('#off-cpu-price').value || 0) : 0;
                const pr = ram ? (+$('#off-ram-price').value || 0) : 0;
                const pg = gpu ? (+$('#off-gpu-price').value || 0) : 0;
                $('#off-total').textContent = '$' + (pc + pr + pg).toFixed(2) + '/h';
                const cmd = shareCommand(cpu, ram, gpu, pc + pr + pg);
                const sum = $('#off-summary'); sum.dataset.cmd = cmd; sum.textContent = '$ ' + cmd;
            };
            $('#off-copy').onclick = async () => {
                try {
                    await navigator.clipboard.writeText($('#off-summary').dataset.cmd || '');
                    const b = $('#off-copy'), o = b.innerHTML;
                    b.innerHTML = '<i class="fa-solid fa-check text-[#ccff33]"></i>';
                    setTimeout(() => { b.innerHTML = o; }, 1200);
                } catch (e) {}
            };
            $('#off-cpu').oninput = () => upd('cpu');
            $('#off-ram').oninput = () => upd('ram');
            $('#off-gpu').onchange = () => upd('gpu');
            ['#off-cpu-price', '#off-ram-price', '#off-gpu-price'].forEach(id =>
                $(id).addEventListener('input', () => { $(id).dataset.touched = '1'; upd(); }));
            upd();
            $('#off-go').onclick = () => {
                const cpu = +$('#off-cpu').value, ram = +$('#off-ram').value, gpu = $('#off-gpu').value;
                const priceCpu = cpu ? (+$('#off-cpu-price').value || 0) : 0;
                const priceRam = ram ? (+$('#off-ram-price').value || 0) : 0;
                const priceGpu = gpu ? (+$('#off-gpu-price').value || 0) : 0;
                const total = priceCpu + priceRam + priceGpu;
                if (!cpu && !ram && !gpu) { alert('Offer at least one part — CPU, RAM or a GPU.'); return; }
                if (!(total > 0)) { alert('Set a price for at least one offered part.'); return; }
                VM.offering = { cpu, ram, gpu, priceCpu, priceRam, priceGpu }; saveVM();
                const lines = [];
                if (cpu) lines.push(`${cpu} CPU cores, $${priceCpu.toFixed(2)}/h`);
                if (ram) lines.push(`${ram} GB RAM, $${priceRam.toFixed(2)}/h`);
                if (gpu) lines.push(`${gpu}, $${priceGpu.toFixed(2)}/h`);
                // Honest: the browser can't announce — it hands you the exact
                // command that brings the node online and does the announcing.
                alert(`Offer saved. Run this on the machine to bring it online and announce it to the network:\n\n${shareCommand(cpu, ram, gpu, total)}\n\nSharing:\n${lines.join('\n')}\nTotal $${total.toFixed(2)}/hour · payouts in USDC`);
            };
        }

        // ================= running apps (compute bursts) ==================
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        async function x402Boot(logEl, app) {
            const line = t => { const d = document.createElement('div'); d.textContent = t; logEl.appendChild(d); logEl.scrollTop = 1e6; return d; };
            line(`→ workload: ${app.image} · from ${VM.name} volume`);
            await sleep(350);
            line(`← Payment required · USDC quote`);
            await sleep(450);
            const p = line(`→ paid · scheduler matched a node (${VM.vram}GB VRAM) · isolated runtime up`);
            p.className = 'text-[#ccff33]';
            await sleep(400);
        }
        function openApp(app) {
            hideStart();
            const body = createWindow('app-' + app.key, app.name, app.icon, app.kind === 'chat' ? 540 : 560);
            if (!body) return;
            body.innerHTML = '';
            const log = document.createElement('div');
            log.className = 'bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-[11px] font-mono text-zinc-500 max-h-24 overflow-y-auto mb-4';
            body.appendChild(log);

            const ui = document.createElement('div');
            body.appendChild(ui);

            x402Boot(log, app).then(() => {
                if (app.kind === 'chat') chatUI(ui, app);
                else if (app.kind === 'image') imageUI(ui, app);
                else if (app.kind === 'audio') audioUI(ui, app);
                else if (app.kind === 'svc') serviceUI(ui, app);
                else shellUI(ui, app);
                // User-deployed workloads can be removed (their image/env are
                // yours, not the catalog's).
                if (app.custom) {
                    const rm = document.createElement('button');
                    rm.className = 'mt-3 text-[11px] text-zinc-500 hover:text-rose-400';
                    rm.innerHTML = '<i class="fa-solid fa-trash-can mr-1.5"></i>Remove this deployment';
                    rm.onclick = () => {
                        VM.custom = (VM.custom || []).filter(c => c.key !== app.key);
                        saveVM(); renderDesktop(); closeWindow('app-' + app.key);
                    };
                    ui.appendChild(rm);
                }
            });
        }
        function demoNote(parent) {
            const p = document.createElement('p');
            p.className = 'text-[10px] text-zinc-600 mt-3';
            p.innerHTML = '<i class="fa-solid fa-flask mr-1"></i>Demo preview — payment/scheduling above is the real protocol flow; live inference ships with the serverless runtime.';
            parent.appendChild(p);
        }
        function chatUI(ui, app) {
            const epKey = app.key || null; // catalog key routed by the gateway
            ui.innerHTML = `
                <div class="space-y-2 mb-3 chat-log"></div>
                <div class="flex gap-x-2">
                    <input class="flex-1 bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-[#ccff33]" placeholder="Message ${app.name || 'the model'}…">
                    <button class="chat-send px-5 py-2.5 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-xl text-sm">Send</button>
                </div>`;
            const input = ui.querySelector('input'), send = ui.querySelector('.chat-send'), logC = ui.querySelector('.chat-log');
            focusSoon(input);
            const go = async () => {
                const q = input.value.trim(); if (!q) return;
                input.value = '';
                logC.innerHTML += `<div class="text-sm bg-zinc-800/60 rounded-xl px-3 py-2 ml-10">${q.replace(/</g,'&lt;')}</div>`;
                const bot = document.createElement('div');
                bot.className = 'text-sm bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 mr-10';
                bot.innerHTML = '<span class="text-zinc-500">…</span>';
                logC.appendChild(bot);
                logC.scrollTop = 1e6;

                // Real inference when a local Cloudiy gateway is serving us —
                // routed to the best announced provider when one serves this
                // model, with the funded escrow session attached if present.
                if (GATEWAY_OK && epKey) {
                    try {
                        const routeTo = await bestProviderFor(epKey);
                        // Local runs stream token-by-token so the answer types
                        // itself out instead of appearing all at once. Remote
                        // providers return a single signed response (below).
                        if (!routeTo) {
                            const streamed = await streamChat(epKey, q, bot, logC);
                            if (streamed) { logC.scrollTop = 1e6; return; }
                            // streaming unavailable — fall through to one call.
                        }
                        const res = await fetch(GW_HTTP + '/api/endpoint', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                key: epKey, prompt: q, token: (VM.token || undefined),
                                to: routeTo || undefined,
                                ...escrowPaymentFor(epKey),
                            }),
                        });
                        const d = await res.json();
                        if (d.payment_required) {
                            bot.innerHTML = '<span class="text-amber-400">402 Payment Required — this provider needs a funded escrow. Opening the deposit…</span>';
                            openEscrowDeposit({ key: epKey, price: 0.004 });
                        } else if (d.output) {
                            bot.textContent = d.output;
                            const meta = document.createElement('div');
                            meta.className = 'text-[10px] text-zinc-500 font-mono mt-1';
                            meta.textContent = `${d.model} · ${d.tokens ?? '?'} tokens · ${d.cold_start ? 'cold start (pulled)' : 'warm'} · settled ${d.settled_via}`
                                + (d.signed_by ? ` · signed by ${String(d.signed_by).slice(0, 8)}…` : '');
                            bot.appendChild(meta);
                        } else {
                            bot.innerHTML = `<span class="text-rose-400">⚠ ${(d.error || 'error').replace(/</g,'&lt;')}</span>`;
                        }
                    } catch (e) {
                        bot.innerHTML = '<span class="text-rose-400">⚠ gateway unreachable</span>';
                    }
                    logC.scrollTop = 1e6;
                    return;
                }

                // Demo fallback (served statically, no local node).
                await sleep(700);
                bot.textContent = '[demo] the model would answer here — connect a local node (cloudiy os) for real inference. This message would cost ~$0.002 in USDC.';
            };
            send.onclick = go; input.onkeydown = e => { if (e.key === 'Enter') go(); };
            if (!GATEWAY_OK) demoNote(ui);

            // Stream a local chat answer token-by-token into `bot`. Reads the
            // gateway's newline-delimited JSON (preamble / token / done lines)
            // and paints each token as it arrives. Returns true when it rendered
            // a complete reply; false to let the caller retry without streaming.
            async function streamChat(key, prompt, bot, logC) {
                bot.textContent = '';
                const caret = document.createElement('span');
                caret.className = 'inline-block w-1.5 h-4 align-text-bottom bg-[#ccff33] animate-pulse ml-0.5';
                bot.appendChild(caret);
                let acc = '', meta = {};
                try {
                    const res = await fetch(GW_HTTP + '/api/endpoint/stream', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key, prompt, token: (VM.token || undefined) }),
                    });
                    if (!res.ok || !res.body) throw new Error('stream unavailable');
                    const reader = res.body.getReader();
                    const dec = new TextDecoder();
                    let sbuf = '';
                    for (;;) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        sbuf += dec.decode(value, { stream: true });
                        let nl;
                        while ((nl = sbuf.indexOf('\n')) >= 0) {
                            const line = sbuf.slice(0, nl).trim(); sbuf = sbuf.slice(nl + 1);
                            if (!line) continue;
                            let o; try { o = JSON.parse(line); } catch { continue; }
                            if (o.error) throw new Error(o.error);
                            if (o.cold_start !== undefined) {
                                meta.model = o.model || meta.model; meta.cold = !!o.cold_start;
                                bot.textContent = o.cold_start ? 'provisioning worker + pulling model…' : 'thinking…';
                                bot.appendChild(caret);
                            }
                            // Provider data — textContent only, never markup.
                            if (o.token) { if (!acc) bot.textContent = ''; acc += o.token; bot.textContent = acc; bot.appendChild(caret); logC.scrollTop = 1e6; }
                            if (o.done) { meta.model = o.model || meta.model; meta.tokens = o.tokens; }
                        }
                    }
                    caret.remove();
                    bot.textContent = acc || '(no output)';
                    const m = document.createElement('div');
                    m.className = 'text-[10px] text-zinc-500 font-mono mt-1';
                    m.textContent = `${meta.model || 'model'} · ${meta.tokens ?? '?'} tokens · ${meta.cold ? 'cold start (pulled)' : 'warm'} · streamed · settled local-node`;
                    bot.appendChild(m);
                    return true;
                } catch (e) {
                    caret.remove();
                    return false; // caller falls back to the single-response path
                }
            }
        }

        // Gateway base: same-origin when CloudiyOS is served by `cloudiy os`

        // Gateway base URL. Order of precedence:
        //   1. ?gw=https://node.example  (also persisted for next load)

        // HTTPS and allow this origin via CORS, which the gateway now does).
        const GW_HTTP = (() => {
            let override = '';
            try {
                const p = new URLSearchParams(location.search).get('gw');
                if (p) { override = p; localStorage.setItem('cloudiy_gw', p); }
                else override = localStorage.getItem('cloudiy_gw') || '';
            } catch (e) {}
            if (override) return override.replace(/\/+$/, '');
            if (/^https?:\/\/(127\.0\.0\.1|localhost)/.test(location.origin)) return location.origin;
            return 'http://127.0.0.1:4600';

                // 2) provision (idempotent — returns the existing VM if running)
                setStatus('provisioning VM…');
                term.writeln('\r\n\x1b[90m● provisioning your VM…\x1b[0m');
                const up = await fetch(GW_HTTP + '/api/vm/up', {
                    method: 'POST', headers: { 'content-type': 'application/json' },

                }).then(r => r.json()).catch(() => ({ error: 'request failed' }));
                if (up.error) { setStatus('error'); term.writeln('\x1b[31m✗ ' + up.error + '\x1b[0m'); return; }
                if (up.payment_required) { setStatus('payment required'); term.writeln('\x1b[33mpayment required — provision via the CLI\x1b[0m'); return; }
                term.writeln('\x1b[38;2;204;255;51m● VM ' + up.state + ' — ' + up.image + ' · ' + (up.cpu_millis/1000) + ' vCPU · ' + up.memory_mib + ' MiB\x1b[0m');
                // 3) open the shell
                fit.fit();

                ws = new WebSocket(url); ws.binaryType = 'arraybuffer';
                setStatus('connecting…'); go.textContent = 'Disconnect';

                ws.onclose = () => { setStatus('idle'); ws = null; go.textContent = 'Connect'; };
                ws.onerror = () => term.writeln('\r\n\x1b[31mconnection error\x1b[0m');
            };

            term.onData(d => { if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
            term.onResize(({ cols, rows }) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ cols, rows })); });
            window.addEventListener('resize', () => { try { fit.fit(); } catch(e){} });
        }

        // ================= My Wallet =====================================
        // A security-hardened crypto wallet app. Threat model: a malicious
        // user tampering with the DOM/fields/buttons to (a) inject markup
        // (XSS) via token metadata or address fields, (b) overspend or send
        // negative/oversized amounts, or (c) send to a bogus address.
        // Mitigations:
        //   • esc() HTML-escapes EVERY dynamic value before it reaches
        //     innerHTML; user input is set via .value / .textContent, never
        //     interpolated raw.
        //   • Recipient addresses are validated as real Solana public keys
        //     (base58 + 32 bytes, via web3 PublicKey when available).
        //   • Amounts are parsed in integer base units (BigInt), strictly
        //     regex-gated, decimal-bounded and clamped to the live balance.
        //   • Every action (send/swap) RE-VALIDATES at click time, so a
        //     forced-enabled button or edited field can't bypass the checks.
        //   • A busy flag blocks double submits. Transfers are simulated
        //     inside CloudiyOS — no private key is ever touched.
        function openWallet() {
            hideStart();
            const body = createWindow('wallet', 'My Wallet', 'fa-wallet', 400, { plain: true, height: 640 });
            if (!body) return;
            Wallet.mount(body);
        }

        const Wallet = (() => {
            const esc = s => String(s == null ? '' : s).replace(/[&<>"'`=\/]/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;', '=': '&#61;', '/': '&#47;' }[c]));

            // Curated SPL registry (mainnet mints + CoinGecko ids). `demo`
            // balances are used when no real wallet/RPC is reachable.
            const REG = [
                { key: 'sol',  symbol: 'SOL',  name: 'Solana',   decimals: 9, mint: null,                                            cg: 'solana',                    color: '#14F195', demo: 12840000000n },
                { key: 'usdc', symbol: 'USDC', name: 'USD Coin', decimals: 6, mint: 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',   cg: 'usd-coin',                  color: '#2775CA', demo: 3250000000n },
                { key: 'usdt', symbol: 'USDT', name: 'Tether',   decimals: 6, mint: 'Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB',   cg: 'tether',                    color: '#26A17B', demo: 500000000n },
                { key: 'jup',  symbol: 'JUP',  name: 'Jupiter',  decimals: 6, mint: 'JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN',    cg: 'jupiter-exchange-solana',   color: '#C7F284', demo: 420500000n },
                { key: 'bonk', symbol: 'BONK', name: 'Bonk',     decimals: 5, mint: 'DezXAZ8z7PnrnRJjz3wXBoRgmBRT13KKz2FnE7dVsp',     cg: 'bonk',                      color: '#F5A623', demo: 1520000000000n },
            ];
            const priceOf = { sol: 172.4, usdc: 1, usdt: 1, jup: 0.92, bonk: 0.0000241 };
            const changeOf = {}; REG.forEach(t => changeOf[t.key] = 0);
            const priceByMint = {};                         // live prices for arbitrary held mints
            const SOL_META = REG[0];
            const META_BY_MINT = {}; REG.forEach(t => { if (t.mint) META_BY_MINT[t.mint] = t; });
            // Devnet USDC test mint (the escrow's ESCROW.mint) → show as USDC.
            META_BY_MINT['7E2fxsgWJiXGyFtLuybzhEavKXPkuCXMyqdW8GaZegRw'] = META_BY_MINT['EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'];
            const TOKEN_PROGRAMS = ['TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA', 'TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb'];
            // Read balances on the SAME cluster the app settles on: follow
            // ESCROW.rpcUrl (devnet today, mainnet later). Evaluated at call

            function rpcList() {
                let url = 'https://api.devnet.solana.com';
                try { if (typeof ESCROW !== 'undefined' && ESCROW && ESCROW.rpcUrl) url = ESCROW.rpcUrl; } catch (e) {}
                const fb = /devnet|testnet/.test(url) ? 'https://api.devnet.solana.com' : 'https://api.mainnet-beta.solana.com';
                return url === fb ? [url] : [url, fb];
            }

            const state = { root: null, pubkey: '', view: 'portfolio', active: null, tokens: [], total: 0, busy: false, live: false, balError: false, send: null, swap: null };
            const tokenByKey = k => state.tokens.find(t => t.key === k);

            // ---- formatting / parsing / validation (security core) --------
            const usd = n => { n = Number(n) || 0; if (n > 0 && n < 0.01) return '$' + n.toPrecision(2); return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
            const num = (n, dp = 4) => { n = Number(n) || 0; return n.toLocaleString('en-US', { maximumFractionDigits: dp }); };
            const fmtBal = ui => { ui = Number(ui) || 0; if (ui === 0) return '0'; if (ui >= 1000) return num(ui, 2); if (ui >= 1) return num(ui, 4); return num(ui, 6); };
            const shortAddr = a => a ? (a.slice(0, 4) + '…' + a.slice(-4)) : 'not connected';
            // RPC calls have no built-in timeout; race them so a slow/hung
            // endpoint can never leave the wallet stuck on "Loading…".
            const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

            function fmtUnits(base, decimals) {
                base = BigInt(base); if (base < 0n) base = 0n;
                const d = 10n ** BigInt(decimals);
                const i = base / d, f = base % d;
                let fs = f.toString().padStart(decimals, '0').replace(/0+$/, '');
                return i.toString() + (fs ? ('.' + fs) : '');
            }
            function parseAmount(str, decimals, maxBase) {
                str = String(str == null ? '' : str).trim();
                if (str.length > 30) return { ok: false, err: 'Amount too large' };
                if (!/^\d*\.?\d*$/.test(str) || str === '' || str === '.') return { ok: false, err: 'Enter an amount' };
                let [i, f = ''] = str.split('.'); i = i || '0';
                if (f.length > decimals) return { ok: false, err: 'Max ' + decimals + ' decimals' };
                f = (f + '0'.repeat(decimals)).slice(0, decimals);
                let base;
                try { base = BigInt(i) * (10n ** BigInt(decimals)) + BigInt(f || '0'); } catch (e) { return { ok: false, err: 'Invalid amount' }; }
                if (base <= 0n) return { ok: false, err: 'Amount must be greater than 0' };
                if (maxBase != null && base > maxBase) return { ok: false, err: 'Insufficient balance' };
                return { ok: true, base };
            }
            function base58Decode(str) {
                const A = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
                const bytes = [0];
                for (const ch of str) {
                    const val = A.indexOf(ch); if (val < 0) return null;
                    let carry = val;
                    for (let j = 0; j < bytes.length; j++) { carry += bytes[j] * 58; bytes[j] = carry & 0xff; carry >>= 8; }
                    while (carry) { bytes.push(carry & 0xff); carry >>= 8; }
                }
                for (let k = 0; k < str.length && str[k] === '1'; k++) bytes.push(0);
                return new Uint8Array(bytes.reverse());
            }
            function isValidAddress(a) {
                if (typeof a !== 'string' || !/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a)) return false;
                try { if (typeof solanaWeb3 !== 'undefined') { new solanaWeb3.PublicKey(a); return true; } } catch (e) { return false; }
                const b = base58Decode(a); return !!b && b.length === 32;
            }
            function fakeTxid() {
                const A = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
                const b = new Uint8Array(32); crypto.getRandomValues(b);
                let s = ''; for (const x of b) s += A[x % 58]; return s;
            }

            // ---- data loading ---------------------------------------------
            // Read the connected wallet's REAL on-chain holdings. Falls back to
            // the demo set ONLY when there is no valid connected address — a real
            // wallet never silently shows demo numbers. RPC failures degrade
            // gracefully (partial data + a flag) instead of masking real balances.
            const DEMO_PK = 'DemoWa11etCLoUD1Yxxxxxxxxxxxxxxxxxxxxxxxxxxx';   // sentinel set by loginDemo()
            async function loadHoldings() {
                const isReal = state.pubkey && state.pubkey !== DEMO_PK && typeof solanaWeb3 !== 'undefined' && isValidAddress(state.pubkey);
                state.live = isReal; state.balError = false;
                if (!isReal) return REG.map(t => ({ key: t.key, mint: t.mint, base: t.demo, decimals: t.decimals, meta: t }));
                const owner = new solanaWeb3.PublicKey(state.pubkey);
                let lamports = null, accounts = null;
                for (const url of rpcList()) {
                    let conn; try { conn = new solanaWeb3.Connection(url, 'confirmed'); } catch (e) { continue; }
                    if (lamports == null) { try { lamports = await withTimeout(conn.getBalance(owner), 5000); } catch (e) {} }
                    if (accounts == null) {
                        try {
                            const parts = await withTimeout(Promise.all(TOKEN_PROGRAMS.map(pid =>
                                conn.getParsedTokenAccountsByOwner(owner, { programId: new solanaWeb3.PublicKey(pid) }).then(x => x.value).catch(() => null))), 6000);
                            if (parts.some(p => p !== null)) accounts = parts.filter(Boolean).flat();
                        } catch (e) {}
                    }
                    if (lamports != null && accounts != null) break;

                state.balError = (lamports == null && accounts == null);

                    if (!amt || amt.amount == null || amt.amount === '0') return;

            function viewToken() {

            // ---- validation used by both display and action ---------------

                return { ok: true, base: p.base, addr };

            // ---- actions (re-validate at click time) ----------------------

                if (state.busy) return;

                const t = tokenByKey(state.active);

                state.busy = true;
                f.base = f.base - q.base; if (f.base < 0n) f.base = 0n;
                let addBase = 0n; try { addBase = BigInt(Math.round(q.outUi * Math.pow(10, t.decimals))); } catch (e) { addBase = 0n; }
                t.base = t.base + addBase;

            // ---- live-input wiring (no re-render → keeps input focus) ------

            function refreshSwap() {
                const root = state.root, q = swapQuote(state.swap.fromKey, state.swap.toKey, state.swap.amount);

            function wireSwapForm() {

                if (amt) { amt.value = state.swap.amount || ''; amt.addEventListener('input', () => { let c = amt.value.replace(/[^\d.]/g, ''); const i = c.indexOf('.'); if (i >= 0) c = c.slice(0, i + 1) + c.slice(i + 1).replace(/\./g, ''); if (c !== amt.value) amt.value = c; state.swap.amount = c; refreshSwap(); }); }

            function goBack() {

                    else if (act === 'tab') el.addEventListener('click', () => { const v = el.dataset.tab; if (v === 'swap') resetSwap(); state.view = v; render(); });
                    else if (act === 'back') el.addEventListener('click', goBack);
                    else if (act === 'send') el.addEventListener('click', () => { resetSend(); state.view = 'send'; render(); });
                    else if (act === 'receive') el.addEventListener('click', () => { state.view = 'receive'; render(); });
                    else if (act === 'copy') el.addEventListener('click', () => copyAddr(el));

                    else if (act === 'send-edit') el.addEventListener('click', () => { state.send.step = 'form'; render(); });

                    else if (act === 'swap-flip') el.addEventListener('click', () => { const a = state.swap.fromKey; state.swap.fromKey = state.swap.toKey; state.swap.toKey = a; render(); });

                    else if (act === 'swap-finish') el.addEventListener('click', () => { resetSwap(); render(); });
                    else if (act === 'max-swap') el.addEventListener('click', () => { const f = tokenByKey(state.swap.fromKey); if (!f) return; state.swap.amount = fmtUnits(f.base, f.decimals); const a = root.querySelector('#s-amt'); if (a) a.value = state.swap.amount; refreshSwap(); });

            function render() {
                const r = state.root; if (!r) return;
                let inner = '';
                if (state.view === 'portfolio') inner = viewPortfolio();
                else if (state.view === 'activity') inner = viewActivity();
                else if (state.view === 'swap') inner = viewSwap();

            async function mount(body) {
                state.root = body; state.view = 'portfolio'; state.active = null; state.busy = false;

                body.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-zinc-500 text-sm gap-y-2"><i class="fa-solid fa-spinner fa-spin text-lg"></i>Loading wallet…</div>';
                const holdings = await loadHoldings();
                await loadPrices(holdings);
                buildTokens(holdings);

            async function refresh(btn) {

                if (btn) { const ic = btn.querySelector('i'); if (ic) ic.classList.add('fa-spin'); }
                const holdings = await loadHoldings();
                await loadPrices(holdings);
                buildTokens(holdings);
                ensureSwapDefaults();
                state.busy = false;
                render();
