            return { mount };
        })();

        // ================= start menu / clock / wallet ====================
        function toggleStart(e) { e.stopPropagation(); document.getElementById('start-menu').classList.toggle('hidden'); }
        function hideStart() { document.getElementById('start-menu').classList.add('hidden'); }
        document.addEventListener('click', hideStart);
        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // True when a local Cloudiy gateway (`cloudiy os`) is serving this page:
        // its /api/* is same-origin, so model endpoints run for real. Served
        // statically (Vercel), this stays false and playgrounds show the demo.
        let GATEWAY_OK = false;
        (async () => {
            try {
                const r = await fetch(GW_HTTP + '/api/id');
                GATEWAY_OK = r.ok && !!(await r.json()).id;
            } catch (e) { GATEWAY_OK = false; }
        })();

        let walletPubkey = null;
        window.addEventListener('load', async () => {
            const provider = window.phantom?.solana || window.solana;
            if (provider) {
                try { const r = await provider.connect({ onlyIfTrusted: true }); walletPubkey = r.publicKey.toString(); } catch (e) {}
            }
        });

        // ============ On-chain USDC escrow, signed in the browser ============
        // A faithful JS port of `create_job` from crates/cloudiy/src/solana.rs
        // (devnet-tested): identical PDA seeds, account order and instruction
        // data, against the deployed escrow program. Phantom signs; the wallet
        // never leaves the user. The provider verifies the Job on-chain (its
        // --require-payment mode) before running the workload.
        const ESCROW = {
            programId:         '9zMBC7JDA8SJ2mk3ATYqRuJvn14MQyZVg9q3XPnzc1TN',
            rpcUrl:            'https://api.devnet.solana.com',
            mint:              '7E2fxsgWJiXGyFtLuybzhEavKXPkuCXMyqdW8GaZegRw', // devnet USDC test mint
            tokenProgram:      'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA',
            assocTokenProgram: 'ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL',
            systemProgram:     '11111111111111111111111111111111',
        };
        const hasWeb3 = () => typeof solanaWeb3 !== 'undefined';
        function hexToBytes(hex) {
            hex = (hex || '').replace(/^0x/, '').trim();
            if (hex.length % 2) throw new Error('odd-length hex');
            const out = new Uint8Array(hex.length / 2);
            for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
            return out;
        }
        const bytesToHex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
        function writeIntLE(buf, off, value, bytes) {
            let v = BigInt(value);
            for (let i = 0; i < bytes; i++) { buf[off + i] = Number(v & 0xffn); v >>= 8n; }
        }
        async function anchorDiscriminator(name) {
            const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('global:' + name)));
            return hash.slice(0, 8);
        }
        function ataFor(owner, mint) {
            const w = solanaWeb3;
            return w.PublicKey.findProgramAddressSync(
                [owner.toBytes(), new w.PublicKey(ESCROW.tokenProgram).toBytes(), mint.toBytes()],
                new w.PublicKey(ESCROW.assocTokenProgram))[0];
        }
        // Lock `amountMicro` (micro-USDC) for a provider. `providerPayout` is the
        // provider's payout pubkey; `providerNodeKeyHex` its 32-byte node identity.
        async function escrowCreateJob({ providerPayout, providerNodeKeyHex, amountMicro, timeoutSecs = 3600, mint: mintStr, programId: programStr }) {
            if (!hasWeb3()) throw new Error('Solana web3 not loaded (offline?).');
            const w = solanaWeb3;
            const wallet = window.phantom?.solana || window.solana;
            if (!wallet) throw new Error('No Solana wallet found.');
            const { publicKey: consumer } = await wallet.connect();
            const programId = new w.PublicKey(programStr || ESCROW.programId);
            const provider = new w.PublicKey(providerPayout);
            const mint = new w.PublicKey(mintStr || ESCROW.mint);
            const nodeKey = hexToBytes(providerNodeKeyHex);
            if (nodeKey.length !== 32) throw new Error('provider node key must be 32 bytes (64 hex chars).');
            const jobId = crypto.getRandomValues(new Uint8Array(16));
            const enc = new TextEncoder();
            const [job]   = w.PublicKey.findProgramAddressSync([enc.encode('job'), consumer.toBytes(), jobId], programId);
            const [vault] = w.PublicKey.findProgramAddressSync([enc.encode('vault'), job.toBytes()], programId);
            const consumerToken = ataFor(consumer, mint);
            // data = disc(8) ++ job_id(16) ++ amount(u64 LE) ++ timeout(i64 LE) ++ node_key(32)
            const disc = await anchorDiscriminator('create_job');
            const data = new Uint8Array(8 + 16 + 8 + 8 + 32);
            let o = 0;
            data.set(disc, o); o += 8;
            data.set(jobId, o); o += 16;
            writeIntLE(data, o, amountMicro, 8); o += 8;
            writeIntLE(data, o, timeoutSecs, 8); o += 8;
            data.set(nodeKey, o);
            const keys = [
                { pubkey: consumer,     isSigner: true,  isWritable: true  },
                { pubkey: provider,     isSigner: false, isWritable: false },
                { pubkey: mint,         isSigner: false, isWritable: false },
                { pubkey: job,          isSigner: false, isWritable: true  },
                { pubkey: vault,        isSigner: false, isWritable: true  },
                { pubkey: consumerToken, isSigner: false, isWritable: true },
                { pubkey: new w.PublicKey(ESCROW.tokenProgram),  isSigner: false, isWritable: false },
                { pubkey: new w.PublicKey(ESCROW.systemProgram), isSigner: false, isWritable: false },
            ];
            const ix = new w.TransactionInstruction({ programId, keys, data });
            const conn = new w.Connection(ESCROW.rpcUrl, 'confirmed');
            const { blockhash, lastValidBlockHeight } = await conn.getLatestBlockhash();
            const tx = new w.Transaction({ feePayer: consumer, blockhash, lastValidBlockHeight });
            tx.add(ix);
            const sent = await wallet.signAndSendTransaction(tx);
            const signature = sent.signature || sent;
            await conn.confirmTransaction({ signature, blockhash, lastValidBlockHeight }, 'confirmed');
            return { jobAccount: job.toBase58(), jobId: bytesToHex(jobId), signature };
        }

        // Ask the gateway for a real x402 quote: the best provider announcing
        // this model, plus everything needed to fund its escrow. Returns null
        // when no gateway or no provider — the deposit modal then lets the
        // user fill a devnet target by hand.
        async function gatewayProvider(epKey) {
            if (!GATEWAY_OK) return null;
            try {
                const r = await fetch(GW_HTTP + '/api/quote?key=' + encodeURIComponent(epKey || ''));
                if (!r.ok) return null;
                const q2 = await r.json();
                if (!q2 || q2.error || !q2.node_key) return null;
                return {
                    node:      q2.node,
                    payout:    q2.payout || '',
                    nodeKey:   q2.node_key,           // hex 32-byte node identity
                    mint:      q2.usdc_mint || null,
                    programId: q2.escrow_program || null,
                    price:     q2.price_usdc != null ? q2.price_usdc : null,
                };
            } catch (e) { return null; }
        }

        // Best announced provider for a model (60s cache): fills the `to` of a
        // routed run. null = none announced → the local gateway serves it.
        const EP_ROUTE_CACHE = {};
        async function bestProviderFor(key) {
            if (!GATEWAY_OK) return null;
            const c = EP_ROUTE_CACHE[key];
            if (c && Date.now() - c.t < 60000) return c.best;
            try {
                const r = await fetch(GW_HTTP + '/api/endpoint/providers?key=' + encodeURIComponent(key));
                const d = r.ok ? await r.json() : null;
                const best = (d && d.best) || null;
                EP_ROUTE_CACHE[key] = { t: Date.now(), best };
                return best;
            } catch (e) { return null; }
        }

        // 16-byte hex job id (from escrowCreateJob) → the UUID string the
        // provider hashes to bind the run to the funded escrow.
        function uuidFromHex(hex) {
            if (!hex || !/^[0-9a-fA-F]{32}$/.test(hex)) return null;
            const h = hex.toLowerCase();
            return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
        }

        // Escrow payment fields for a run: present only when the user funded a
        // session for this endpoint. The provider verifies the escrow on-chain
        // against this exact job id.
        function escrowPaymentFor(key) {
            const s = (VM.sessions || {})[key];
            if (!s || !s.jobAccount) return {};
            const jid = uuidFromHex(s.jobId);
            const out = { payment: btoa(JSON.stringify({ escrow: s.jobAccount })) };
            if (jid) out.job_id = jid;
            return out;
        }

        // Per-endpoint escrow session the user has funded (key -> {jobAccount…}).
        VM.sessions = VM.sessions || {};
        // A small modal: connect wallet, confirm amount + provider, sign create_job.
        async function openEscrowDeposit(ep) {
            const body = createWindow('escrow-' + (ep.key || 'x'), 'Deposit USDC · escrow', 'fa-lock', 460);
            if (!body) return;
            const gp = await gatewayProvider(ep.key);
            const price = (gp && gp.price != null) ? gp.price : (ep && ep.price ? ep.price : 0.05);
            const suggested = Math.max(price * 20, 0.10); // ~20 requests of headroom
            const useProgram = (gp && gp.programId) || ESCROW.programId;
            const useMint = (gp && gp.mint) || ESCROW.mint;
            const short = s => s ? s.slice(0, 4) + '…' + s.slice(-4) : '—';
            body.innerHTML = `
                <p class="text-xs text-zinc-500 mb-4">Lock USDC in the on-chain escrow (devnet). The provider verifies the deposit before running, and you release payment as you consume. Phantom signs — your keys never leave the wallet.</p>
                <label class="text-[11px] text-zinc-400 block mb-1">Amount to deposit (USDC)</label>
                <input id="esc-amt" type="number" min="0" step="0.01" value="${suggested.toFixed(2)}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-sm font-mono mb-3 focus:outline-none focus:border-[#ccff33]">
                <label class="text-[11px] text-zinc-400 block mb-1">Provider payout address</label>
                <input id="esc-prov" placeholder="provider USDC wallet (base58)" value="${escAttr(gp?.payout)}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs font-mono mb-3 focus:outline-none focus:border-[#ccff33]">
                <label class="text-[11px] text-zinc-400 block mb-1">Provider node key <span class="text-zinc-600">(64 hex)</span></label>
                <input id="esc-node" placeholder="32-byte node identity, hex" value="${escAttr(gp?.nodeKey)}" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs font-mono mb-4 focus:outline-none focus:border-[#ccff33]">
                <button id="esc-go" class="w-full py-3 bg-[#ccff33] hover:bg-white text-black font-semibold rounded-xl text-sm">Sign & deposit with Phantom</button>
                <div id="esc-out" class="text-[11px] font-mono mt-4"></div>
                <p class="text-[10px] text-zinc-600 mt-3"><i class="fa-solid fa-circle-info mr-1"></i>${gp ? 'Provider auto-filled from the gateway. ' : ''}Program <span class="text-zinc-400">${short(useProgram)}</span>, mint <span class="text-zinc-400">${short(useMint)}</span>. Fund your wallet with the matching USDC first.</p>`;
            const out = body.querySelector('#esc-out');
            body.querySelector('#esc-go').onclick = async () => {
                const amount = parseFloat(body.querySelector('#esc-amt').value);
                const providerPayout = body.querySelector('#esc-prov').value.trim();
                const providerNodeKeyHex = body.querySelector('#esc-node').value.trim();
                if (!(amount > 0)) { out.innerHTML = '<span class="text-rose-400">Set an amount.</span>'; return; }
                if (!providerPayout || !providerNodeKeyHex) { out.innerHTML = '<span class="text-rose-400">Provider payout and node key are required.</span>'; return; }
                out.innerHTML = '<span class="text-zinc-400">Awaiting Phantom signature…</span>';
                try {
                    const r = await escrowCreateJob({
                        providerPayout, providerNodeKeyHex,
                        amountMicro: Math.round(amount * 1e6),
                        mint: (gp && gp.mint) || undefined,
                        programId: (gp && gp.programId) || undefined,
                    });
                    if (ep && ep.key) { VM.sessions[ep.key] = { jobAccount: r.jobAccount, jobId: r.jobId, remaining: amount }; saveVM(); }
                    recordReceipt('deposit', (ep && ep.key) || 'escrow', amount, 0);
                    out.innerHTML = `<span class="text-[#ccff33]">✓ Deposited $${amount.toFixed(2)} USDC</span>`
                        + `<div class="text-zinc-500 mt-1 break-all">job ${r.jobAccount}</div>`
                        + `<div class="text-zinc-500 break-all">tx ${r.signature}</div>`
                        + `<a class="text-[#ccff33] hover:text-white" target="_blank" href="https://explorer.solana.com/tx/${r.signature}?cluster=devnet">view on explorer →</a>`;
                } catch (e) {
                    out.innerHTML = `<span class="text-rose-400">⚠ ${(e.message || e).toString().replace(/</g, '&lt;')}</span>`;
                }
            };
        }

        // ================= boot ===========================================
        // Build marker — check the console to confirm you're on the latest
        // deploy (not a cached/old version).
        console.info('%cCloudiyOS%c build 2026-07-08 · pay-per-message · no upfront deposit',
            'color:#ccff33;font-weight:bold', 'color:#888');
        (async () => {
            const bar = document.getElementById('boot-bar'), msg = document.getElementById('boot-msg');
            const steps = [
                ['mounting encrypted volume…', 30],
                ['verifying identity…', 55],
                [`restoring ${VM.installed.length} installed image${VM.installed.length === 1 ? '' : 's'}…`, 80],
                ['connecting to compute network…', 100],
            ];
            for (const [m, p] of steps) { msg.textContent = m; bar.style.width = p + '%'; await sleep(380); }
            document.getElementById('boot').style.transition = 'opacity .4s';
            document.getElementById('boot').style.opacity = '0';
            setTimeout(() => document.getElementById('boot').remove(), 450);
            showLogin();
        })();

        // ---------- login: the machine unlocks with a Solana identity ------
        function showLogin() {
            document.getElementById('login-vm').textContent = 'vm://' + VM.name;
            applyWallpaper(); // saved wallpaper shows behind the login too
            if (walletPubkey) {
                // Wallet already trusted this site: one click to enter.
                document.getElementById('login-avatar').src = avatarSrc();
                document.getElementById('login-hint').textContent = 'Welcome back.';
                document.getElementById('login-btn').innerHTML =
                    `<i class="fa-solid fa-wallet mr-2"></i>Enter as ${walletPubkey.slice(0, 4)}…${walletPubkey.slice(-4)}`;
            }
            const login = document.getElementById('login');
            login.classList.remove('hidden');
            login.classList.add('flex');
        }

        async function loginConnect() {
            if (walletPubkey) { enterDesktop(); return; }
            const provider = window.phantom?.solana || window.solana;
            if (provider) {
                try {
                    const resp = await provider.connect();
                    walletPubkey = resp.publicKey.toString();
                    try { localStorage.setItem('cloudiy_wallet', walletPubkey); } catch (e) {}
                    enterDesktop();
                } catch (err) {
                    console.warn('Wallet connection rejected:', err);
                }
                return;
            }
            if (confirm('No Solana wallet detected.\n\nOK: install Phantom\nCancel: continue in demo mode')) {
                window.open('https://phantom.com/', '_blank');
            } else {
                loginDemo();
            }
        }

        function loginDemo() {
            walletPubkey = 'DemoWa11etCLoUD1Yxxxxxxxxxxxxxxxxxxxxxxxxxxx';
            enterDesktop();
        }

        function enterDesktop() {
            // Bind VM state to the connected wallet BEFORE anything reads it, so
            // each identity lands on its own VM (not a browser-global one).
            bindWalletVM(walletPubkey);
            // Then reconcile with the identity's on-chain manifest so the same
            // wallet resumes on any device (no-op until the program is live).
            try { CloudiyVM.syncOnLogin(); } catch (e) {}
            const login = document.getElementById('login');
            login.style.transition = 'opacity .35s';
            login.style.opacity = '0';
            setTimeout(() => login.remove(), 400);
            // Apply the user's saved appearance (avatar, username, wallpaper).
            applyAppearance();
            renderDesktop();
            maybeStartOnboarding();
        }

        // ================= First-run onboarding (green-cloud tour) =========
        // Interactive step-by-step tour shown once per browser (Skip anytime).
        // The popup is a comic speech-cloud; it anchors above (or below) the app
        // it explains. App Store and Models get the "how to use it" gist, not a
        // walk through every catalog item. No em dashes in the copy (on purpose).
        const ONBOARD_STEPS = [
            { target: null, title: 'Welcome to cloudiyOS', body: 'A whole computer on a decentralized network. A quick tour of what is built in. Skip anytime.' },
            { target: 'menubar', title: 'The app menu', body: 'This cloud opens the app menu. Every app is one click from here.' },
            { target: 'myvm', title: 'My Virtual Machine', body: 'A persistent, encrypted volume. Compute runs per job on the network, paid in USDC.' },
            { target: 'mynodes', title: 'My Nodes', body: 'Turn this machine into a provider. It auto-hosts when there is demand, earning USDC.' },
            { target: 'hw', title: 'Hardware Store', body: 'Rent a machine or single parts for your VM, or offer your own hardware to the network.' },
            { target: 'store', title: 'App Store', body: 'Deploy apps and workers to your VM. Install to add one, Deploy to run it on a node.' },
            { target: 'models', title: 'Models', body: 'Call AI models per request, paid in USDC. Nothing to install: pick one, prompt, run.' },
            { target: 'wallet', title: 'My Wallet', body: 'Your Solana wallet funds the USDC escrow that pays providers. Keys never leave it.' },
            { target: 'term', title: 'Terminal', body: 'A real shell into your VM over the P2P gateway. Connect a Node ID to run for real.' },
            { target: null, title: 'You are all set', body: 'That is the tour. To run for real, start a local gateway and connect a node. Welcome aboard.' },
        ];
        let onbIndex = 0;
        // A wide central ellipse plus perimeter bumps: the ellipse gives a large
        // flat middle so the centered content never clips on a scallop.
        const CP_BUMPS = [[120,92,52],[215,68,60],[300,92,52],[60,160,50],[360,160,50],[125,236,52],[215,256,56],[300,236,52]];
        function cloudSvg() {
            const fill = CP_BUMPS.map(b => `<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}"/>`).join('');
            const dots = [[54,282,7],[31,296,5],[74,296,4]].map(d => `<circle cx="${d[0]}" cy="${d[1]}" r="${d[2]}"/>`).join('');
            // One gradient shared across every shape (userSpaceOnUse) so the bumps
            // merge into a seamless fill. No outline; faint dots are the tail.
            return `<svg class="cp-svg" viewBox="0 0 420 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="cpg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="320"><stop offset="0" stop-color="#eaff8f"/><stop offset=".55" stop-color="#ccff33"/><stop offset="1" stop-color="#a4dc00"/></linearGradient></defs><g fill="url(#cpg)"><ellipse cx="210" cy="162" rx="182" ry="112"/>${fill}</g><g fill="#0a0a0a" opacity=".5">${dots}</g></svg>`;
        }

        // Per-wallet so a fresh account sees the tour once (a new pubkey in the
        // same browser gets its own flag, not the previous account's).
        function onbKey() { return 'cloudiy_onboarded_' + (typeof walletPubkey !== 'undefined' && walletPubkey ? walletPubkey : 'anon'); }
        function maybeStartOnboarding() {
            try { if (localStorage.getItem(onbKey()) === '1') return; } catch (e) {}
            setTimeout(() => startOnboarding(false), 700); // after the login fade + dock render
        }
        function injectOnbStyle() {
            if (document.getElementById('onb-style')) return;
            const st = document.createElement('style'); st.id = 'onb-style';
            st.textContent = `
                #onb-overlay { position: fixed; inset: 0; z-index: 9990; background: rgba(0,0,0,.5); }
                body.onb-active #dock, body.onb-active #menubar { z-index: 9995 !important; }
                .dock-item.onb-hi .dock-icon { box-shadow: 0 0 0 3px #ccff33, 0 0 24px 6px rgba(204,255,51,.7); animation: onbpulse 1.4s ease-in-out infinite; }
                @keyframes onbpulse { 0%,100% { transform: translateY(-2px) scale(1.04); } 50% { transform: translateY(-6px) scale(1.11); } }
                /* menubar button: steady green ring, only the glow breathes (no scale) so it never slides off screen */
                #menubar > button.onb-hi { border-radius: 8px; box-shadow: 0 0 0 3px #ccff33, 0 0 14px 4px rgba(204,255,51,.55); animation: onbglow 1.7s ease-in-out infinite; }
                @keyframes onbglow { 0%,100% { box-shadow: 0 0 0 3px #ccff33, 0 0 12px 3px rgba(204,255,51,.45); } 50% { box-shadow: 0 0 0 3px #ccff33, 0 0 20px 6px rgba(204,255,51,.8); } }
                .cloud-pop { position: fixed; z-index: 10000; width: min(420px, 94vw); aspect-ratio: 42 / 32; animation: onbfade .28s ease; }
                @keyframes onbfade { from { opacity: 0; } to { opacity: 1; } }
                .cloud-pop .cp-svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 16px 34px rgba(0,0,0,.5)); }
                .cloud-pop .cp-content { position: absolute; inset: 21% 16% 22% 16%; z-index: 1; color: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
                .cloud-pop .cp-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; margin-bottom: 6px; }
                .cloud-pop .cp-text { font-size: 12px; line-height: 1.45; margin: 0 0 12px; }
                .cloud-pop .cp-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
                .cloud-pop .cp-back { background: none; border: none; color: #0a0a0a; font-size: 12px; font-weight: 600; cursor: pointer; }
                .cloud-pop .cp-next { background: #0a0a0a; color: #ccff33; border: none; border-radius: 10px; padding: 6px 18px; font-size: 12px; font-weight: 700; cursor: pointer; }
                .cloud-pop .cp-step { font-size: 11px; font-weight: 600; opacity: .6; margin-bottom: 4px; }
                .cloud-pop .cp-skip { background: none; border: none; color: #0a0a0a; font-size: 11px; text-decoration: underline; opacity: .75; cursor: pointer; }`;
            document.head.appendChild(st);
        }
        function clearOnbHighlight() { document.querySelectorAll('.onb-hi').forEach(e => e.classList.remove('onb-hi')); }
        function onbTargetEl(t) {
            if (!t) return null;
            if (t === 'menubar') return document.querySelector('#menubar > button');
            return document.querySelector('#dock [data-dock-id="' + t + '"]');
        }
        function positionOnbPop(pop, t) {
            const el = onbTargetEl(t);
            const W = pop.offsetWidth || 420, H = pop.offsetHeight || 320, vw = window.innerWidth, vh = window.innerHeight;
            if (!el) { // intro/outro: dead-center on the screen
                pop.style.left = '50%'; pop.style.top = '50%'; pop.style.bottom = 'auto';
                pop.style.transform = 'translate(-50%, -50%)';
                return;
            }
            const r = el.getBoundingClientRect();
            pop.style.transform = 'none'; pop.style.bottom = 'auto';
            pop.style.left = Math.max(8, Math.min(r.left + r.width / 2 - W / 2, vw - W - 8)) + 'px';
            // below the target when it is up top (menubar), otherwise above it (dock)
            const top = r.top < vh / 2 ? r.bottom + 14 : r.top - 26 - H;
            pop.style.top = Math.max(8, Math.min(top, vh - H - 8)) + 'px';
        }
        function startOnboarding(force) {
            if (force) { try { localStorage.removeItem(onbKey()); } catch (e) {} }
            injectOnbStyle();
            onbIndex = 0;
            document.body.classList.add('onb-active');
            if (!document.getElementById('onb-overlay')) { const ov = document.createElement('div'); ov.id = 'onb-overlay'; document.body.appendChild(ov); }
            if (!document.getElementById('onb-pop')) { const p = document.createElement('div'); p.className = 'cloud-pop'; p.id = 'onb-pop'; document.body.appendChild(p); }
            renderOnboardStep();
        }
        function renderOnboardStep() {
            const s = ONBOARD_STEPS[onbIndex]; const pop = document.getElementById('onb-pop'); if (!pop) return;
            clearOnbHighlight();
            const el = onbTargetEl(s.target); if (el) el.classList.add('onb-hi');
            const last = onbIndex === ONBOARD_STEPS.length - 1;
            pop.innerHTML = cloudSvg() + `<div class="cp-content">
                <div class="cp-title"><i class="fa-solid fa-cloud"></i>${s.title}</div>
                <p class="cp-text">${s.body}</p>
                <div class="cp-nav">
                    ${onbIndex > 0 ? `<button id="onb-back" class="cp-back">Back</button>` : ''}
                    <button id="onb-next" class="cp-next">${last ? 'Done' : 'Next'}</button>
                </div>
                <div class="cp-step">${onbIndex + 1} / ${ONBOARD_STEPS.length}</div>
                <button id="onb-skip" class="cp-skip">Skip</button>
            </div>`;
            positionOnbPop(pop, s.target);
            pop.querySelector('#onb-skip').onclick = endOnboarding;
            pop.querySelector('#onb-next').onclick = () => { if (last) { endOnboarding(); } else { onbIndex++; renderOnboardStep(); } };
            const back = pop.querySelector('#onb-back'); if (back) back.onclick = () => { onbIndex--; renderOnboardStep(); };
        }
        function endOnboarding() {
            try { localStorage.setItem(onbKey(), '1'); } catch (e) {}
            clearOnbHighlight();
            document.body.classList.remove('onb-active');
            document.getElementById('onb-pop')?.remove();
            document.getElementById('onb-overlay')?.remove();
        }
    </script>
</body>
</html>
