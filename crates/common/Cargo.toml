[package]
name = "gpuasas-common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
prost = "0.13"
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
dirs = "5"
bs58 = "0.5"

[build-dependencies]
tonic-build = "0.12"