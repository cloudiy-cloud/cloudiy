[package]
name = "cloudiy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloudiy — decentralized GPU compute on Solana. One command to share your GPU or run jobs on someone else's."

[[bin]]
name = "cloudiy"
path = "src/main.rs"

[dependencies]
cloudiy-common = { path = "../common" }
cloudiy-protocol = { path = "../protocol" }
cloudiy-runtime = { path = "../runtime" }
cloudiy-scheduler = { path = "../scheduler" }
cloudiy-sdk = { path = "../sdk" }

tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
subtle.workspace = true
base64.workspace = true
iroh.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
reqwest.workspace = true
# Adapt an mpsc receiver into a Stream for axum's Body::from_stream (token
# streaming from the text worker to the browser).
tokio-stream = "0.1"
bs58 = "0.5"
hex = "0.4"
sha2.workspace = true
ed25519-dalek.workspace = true
curve25519-dalek = "4"
portable-pty = "0.9"
# Cross-platform hardware detection (RAM/CPU) so Linux, macOS AND Windows
# providers all report real resources — replaces the OS-specific probes.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[dev-dependencies]
tokio-test.workspace = true
