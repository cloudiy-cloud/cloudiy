[package]
name = "cloudiy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloudiy — decentralized GPU compute on Solana. One command to share your GPU or run jobs on someone else's."

[[bin]]
name = "cloudiy"
path = "src/main.rs"

[dependencies]
cloudiy-common = { path = "../common" }
cloudiy-protocol = { path = "../protocol" }
cloudiy-runtime = { path = "../runtime" }
cloudiy-scheduler = { path = "../scheduler" }
cloudiy-sdk = { path = "../sdk" }

tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
subtle.workspace = true
base64.workspace = true
iroh.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
portable-pty = "0.9"

[dev-dependencies]
tokio-test.workspace = true
