<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudiyOS — live terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  :root { --lime:#ccff33; --bg:#09090b; --panel:#131316; --line:#27272a; --muted:#a1a1aa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#e4e4e7;
         font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem;
           border-bottom:1px solid var(--line); }
  .logo { width:26px; height:26px; border-radius:7px; background:var(--lime);
          display:grid; place-items:center; color:#000; font-weight:700; }
  h1 { font-size:1rem; margin:0; letter-spacing:-.02em; }
  .tag { color:var(--muted); font-size:.75rem; }
  main { max-width:1000px; margin:0 auto; padding:1rem; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:.6rem; }
  input { background:var(--panel); border:1px solid var(--line); color:#fff;
          border-radius:8px; padding:.5rem .6rem; font-size:.85rem; font-family:ui-monospace,monospace; }
  input#node { flex:1; min-width:280px; }
  button { background:var(--lime); color:#000; border:0; border-radius:8px;
           padding:.5rem .9rem; font-weight:600; cursor:pointer; font-size:.85rem; }
  button.ghost { background:transparent; color:var(--lime); border:1px solid var(--line); }
  #status { font-size:.78rem; color:var(--muted); margin-left:auto; }
  #term { background:#000; border:1px solid var(--line); border-radius:10px;
          height:64vh; padding:.6rem; }
  .hint { color:var(--muted); font-size:.72rem; margin-top:.5rem; }
</style>
</head>
<body>
<header>
  <div class="logo">C</div>
  <h1>CloudiyOS</h1>
  <span class="tag">live terminal · your machine → a provider's VM over P2P</span>
</header>
<main>
  <div class="row">
    <input id="node" placeholder="provider Node ID (from `cloudiy share`)" autocomplete="off">
    <input id="token" placeholder="access code" style="width:190px" autocomplete="off">
  </div>
  <div class="row">
    <button id="up">Provision VM</button>
    <button id="connect" class="ghost">Open shell</button>
    <button id="down" class="ghost">Destroy VM</button>
    <span id="status">idle · gateway <span id="gwid">…</span></span>
  </div>
  <div id="term"></div>
  <div class="hint">A real pseudo-terminal — vim, htop, less all work. Served by <code>cloudiy os</code>, which speaks to the network under your client identity.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const statusEl = $('#status');
let ws = null, gwid = '…';

const term = new Terminal({
  fontSize: 13, cursorBlink: true, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
  theme: { background: '#000000', foreground: '#e4e4e7', cursor: '#ccff33',
           selectionBackground: 'rgba(204,255,51,0.3)', black:'#18181b', brightBlack:'#52525b' }
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($('#term'));
fit.fit();
window.addEventListener('resize', () => { try { fit.fit(); } catch(e){} });

function setStatus(t){ statusEl.textContent = t + ' · gateway ' + gwid; }
fetch('/api/id').then(r=>r.json()).then(d=>{ gwid=(d.id||'?').slice(0,10)+'…'; setStatus('idle'); });

async function api(path, body){
  const r = await fetch(path, body ? {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)} : {});
  return r.json();
}

$('#up').onclick = async () => {
  const to = $('#node').value.trim(); if(!to){ term.writeln('\r\n\x1b[38;2;204;255;51menter a Node ID first\x1b[0m'); return; }
  setStatus('provisioning…');
  const r = await api('/api/vm/up', {to, token:$('#token').value.trim()||null, image:'debian:12-slim', cpu:1, memory_mb:1024});
  if(r.error){ term.writeln('\r\n\x1b[31m✗ '+r.error+'\x1b[0m'); setStatus('idle'); }
  else if(r.payment_required){ term.writeln('\r\npayment required (x402) — provision via CLI with --x402-demo'); setStatus('idle'); }
  else { term.writeln('\r\n\x1b[38;2;204;255;51m✓ VM '+r.state+' — '+r.image+' · '+(r.cpu_millis/1000)+' vCPU · '+r.memory_mb+' MiB\x1b[0m'); setStatus('VM ready'); }
};

$('#down').onclick = async () => {
  const to = $('#node').value.trim(); if(!to) return;
  const r = await api('/api/vm/down', {to});
  term.writeln(r.ok ? '\r\n\x1b[38;2;204;255;51m✓ VM destroyed (disk kept)\x1b[0m' : '\r\n\x1b[31m✗ '+(r.error||'failed')+'\x1b[0m');
  setStatus('idle');
};

$('#connect').onclick = () => {
  const to = $('#node').value.trim(); if(!to){ term.writeln('\r\nenter a Node ID first'); return; }
  if(ws){ ws.close(); return; }
  const scheme = location.protocol==='https:' ? 'wss' : 'ws';
  const tok = $('#token').value.trim();
  fit.fit();
  const url = scheme+'://'+location.host+'/api/shell?to='+encodeURIComponent(to)
            + (tok?'&token='+encodeURIComponent(tok):'')
            + '&cols='+term.cols+'&rows='+term.rows;
  ws = new WebSocket(url); ws.binaryType='arraybuffer';
  setStatus('connecting…'); $('#connect').textContent='Disconnect';
  ws.onmessage = e => term.write(typeof e.data==='string' ? e.data : new Uint8Array(e.data));
  ws.onopen = () => { setStatus('● shell open'); term.focus(); };
  ws.onclose = () => { setStatus('idle'); ws=null; $('#connect').textContent='Open shell'; };
  ws.onerror = () => term.writeln('\r\n\x1b[31mconnection error\x1b[0m');
};

// Raw mode: keystrokes go straight to the remote PTY (which echoes); resize
// follows the browser terminal size.
term.onData(d => { if(ws && ws.readyState===1) ws.send(new TextEncoder().encode(d)); });
term.onResize(({cols,rows}) => { if(ws && ws.readyState===1) ws.send(JSON.stringify({cols,rows})); });
</script>
</body>
</html>
