[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudiy-sdk"
version = "0.3.0"
description = "Cloudiy SDK — run GPU jobs on the Cloudiy network (USDC on Solana, x402). Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cloudiy Team" }]
requires-python = ">=3.9"
keywords = ["gpu", "solana", "usdc", "x402", "depin", "ai-agents", "compute"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/w3-surfer/cloudiy"

[tool.setuptools]
packages = ["cloudiy_sdk"]

# Ship the PEP 561 marker so type checkers treat the SDK's hints as authoritative.
[tool.setuptools.package-data]
cloudiy_sdk = ["py.typed"]
