[build-system]
# 77+ for the PEP 639 SPDX `license` string below; build isolation fetches it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudiy-sdk"
version = "0.3.0"
description = "Cloudiy SDK — run GPU jobs on the Cloudiy network (USDC on Solana, x402). Zero dependencies."
readme = "README.md"
# PEP 639: an SPDX expression, not the deprecated `{ text = "MIT" }` table —
# setuptools drops support for that form on 2027-02-18. The matching
# "License :: OSI Approved ::" classifier is deprecated alongside it, so the
# license is declared here only.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cloudiy Team" }]
requires-python = ">=3.9"
keywords = ["gpu", "solana", "usdc", "x402", "depin", "ai-agents", "compute"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cloudiy-cloud/cloudiy"

[tool.setuptools]
packages = ["cloudiy_sdk"]

# Ship the PEP 561 marker so type checkers treat the SDK's hints as authoritative.
[tool.setuptools.package-data]
cloudiy_sdk = ["py.typed"]
